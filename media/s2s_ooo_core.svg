<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="640" height="420" fill="#fff"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
  <text x="320" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Out-of-order core: in order &#8594; out of order &#8594; in order</text>
  <!-- front end band -->
  <rect x="20" y="40" width="600" height="92" rx="8" fill="#eaf0ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="30" y="56" fill="#3b5bdb" font-weight="bold">FRONT END (in program order)</text>
  <g stroke="#222" stroke-width="1.5" fill="#fff">
    <rect x="30" y="66" width="80" height="50" rx="5"/>
    <rect x="130" y="66" width="80" height="50" rx="5"/>
    <rect x="230" y="66" width="90" height="50" rx="5"/>
    <rect x="340" y="66" width="80" height="50" rx="5"/>
    <rect x="440" y="66" width="170" height="50" rx="5"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="70" y="86">Branch</text><text x="70" y="102">predictor</text>
    <text x="170" y="86">Fetch</text><text x="170" y="102">(I-cache)</text>
    <text x="275" y="86">Decode</text><text x="275" y="102">x86 &#8594; &#181;ops</text>
    <text x="380" y="86">&#181;op cache</text><text x="380" y="102">/ MSROM</text>
    <text x="525" y="86">Rename / Allocate</text><text x="525" y="102">arch reg &#8594; phys reg, ROB slot</text>
  </g>
  <g stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M110 91 L128 91"/><path d="M210 91 L228 91"/><path d="M320 91 L338 91"/><path d="M420 91 L438 91"/>
  </g>
  <!-- OoO band -->
  <rect x="20" y="150" width="600" height="150" rx="8" fill="#fff4e0" stroke="#d9770b" stroke-width="1.5"/>
  <text x="30" y="166" fill="#d9770b" font-weight="bold">BACK END (out of order: oldest ready &#181;op wins)</text>
  <g stroke="#222" stroke-width="1.5" fill="#fff">
    <rect x="30" y="180" width="130" height="100" rx="5"/>
    <rect x="190" y="180" width="60" height="30" rx="4"/><rect x="190" y="215" width="60" height="30" rx="4"/><rect x="190" y="250" width="60" height="30" rx="4"/>
    <rect x="270" y="180" width="60" height="30" rx="4"/><rect x="270" y="215" width="60" height="30" rx="4"/><rect x="270" y="250" width="60" height="30" rx="4"/>
    <rect x="360" y="180" width="120" height="100" rx="5"/>
    <rect x="500" y="180" width="110" height="100" rx="5"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="95" y="200">Scheduler</text><text x="95" y="216">(reservation</text><text x="95" y="232">stations)</text>
    <text x="95" y="256" font-size="11" fill="#555">waits for operands,</text><text x="95" y="270" font-size="11" fill="#555">issues when ready</text>
    <text x="220" y="199">ALU</text><text x="220" y="234">ALU</text><text x="220" y="269">MUL</text>
    <text x="300" y="199">Load</text><text x="300" y="234">Load</text><text x="300" y="269">Store</text>
    <text x="420" y="200">Physical</text><text x="420" y="216">register file</text>
    <text x="420" y="246" font-size="11" fill="#555">many more regs</text><text x="420" y="260" font-size="11" fill="#555">than the ISA names</text>
    <text x="555" y="200">Load / store</text><text x="555" y="216">queues</text>
    <text x="555" y="246" font-size="11" fill="#555">store buffer,</text><text x="555" y="260" font-size="11" fill="#555">disambiguation</text>
  </g>
  <g stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M160 230 L188 230"/><path d="M330 230 L358 230"/><path d="M480 230 L498 230"/>
  </g>
  <path d="M525 132 L95 178" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <!-- retire band -->
  <rect x="20" y="318" width="600" height="80" rx="8" fill="#e6f7ea" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="30" y="334" fill="#2b8a3e" font-weight="bold">RETIRE (in program order)</text>
  <rect x="30" y="344" width="420" height="44" rx="5" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="240" y="362" text-anchor="middle" fill="#222">Reorder buffer (ROB): &#181;ops complete in any order, commit oldest-first</text>
  <text x="240" y="379" text-anchor="middle" fill="#555" font-size="11">precise exceptions; a mispredict flushes everything younger</text>
  <rect x="470" y="344" width="140" height="44" rx="5" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="540" y="362" text-anchor="middle" fill="#222">Architectural state</text>
  <text x="540" y="379" text-anchor="middle" fill="#555" font-size="11">what the ISA promises</text>
  <path d="M450 366 L468 366" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M240 300 L240 342" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
</svg>
