<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
<rect width="600" height="400" fill="#fff"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#555"/></marker></defs>
<text x="300" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Flyweight: share the intrinsic, pass the extrinsic</text>
<text x="150" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Document: millions of positions</text>
<text x="150" y="72" text-anchor="middle" font-size="11" fill="#1d4ed8">extrinsic state, stored by the client</text>
<g font-size="11" fill="#222" font-family="Courier New, monospace">
<rect x="30" y="84" width="240" height="26" fill="#dbeafe" stroke="#1d4ed8"/><text x="40" y="101">(x=10, y=40, red)   → 'b'</text>
<rect x="30" y="116" width="240" height="26" fill="#dbeafe" stroke="#1d4ed8"/><text x="40" y="133">(x=18, y=40, red)   → 'e'</text>
<rect x="30" y="148" width="240" height="26" fill="#dbeafe" stroke="#1d4ed8"/><text x="40" y="165">(x=26, y=40, black) → 'e'</text>
<rect x="30" y="180" width="240" height="26" fill="#dbeafe" stroke="#1d4ed8"/><text x="40" y="197">(x=34, y=40, black) → 'b'</text>
<rect x="30" y="212" width="240" height="26" fill="#dbeafe" stroke="#1d4ed8"/><text x="40" y="229">(x=50, y=58, black) → 'e'</text>
</g>
<text x="150" y="258" text-anchor="middle" font-size="16" fill="#1d4ed8">⋮</text>
<text x="450" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Glyph pool: one object per character</text>
<text x="450" y="72" text-anchor="middle" font-size="11" fill="#15803d">intrinsic state, immutable and shared</text>
<rect x="370" y="100" width="160" height="44" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="450" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Glyph 'b'</text><text x="450" y="136" text-anchor="middle" font-size="11" fill="#333">outline, metrics</text>
<rect x="370" y="168" width="160" height="44" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="450" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Glyph 'e'</text><text x="450" y="204" text-anchor="middle" font-size="11" fill="#333">outline, metrics</text>
<g stroke="#555" marker-end="url(#arr)"><line x1="270" y1="97" x2="368" y2="118"/><line x1="270" y1="193" x2="368" y2="128"/><line x1="270" y1="129" x2="368" y2="184"/><line x1="270" y1="161" x2="368" y2="190"/><line x1="270" y1="225" x2="368" y2="198"/></g>
<rect x="370" y="236" width="160" height="30" fill="#fff" stroke="#15803d" stroke-dasharray="4 3"/><text x="450" y="256" text-anchor="middle" font-size="12" fill="#15803d">GlyphFactory.get(c)</text>
<text x="300" y="300" text-anchor="middle" font-size="12" fill="#222">glyph.draw(x, y, colour): context goes in as arguments,</text>
<text x="300" y="318" text-anchor="middle" font-size="12" fill="#222">so the shared object never needs to know where it is.</text>
<text x="300" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">10 million characters → about 100 glyph objects</text>
<text x="300" y="384" text-anchor="middle" font-size="11" fill="#555">Same idea: Java's Integer.valueOf cache, interned strings, game tile and sprite sheets.</text>
</svg>
