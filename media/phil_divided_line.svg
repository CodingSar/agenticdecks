<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="sans-serif" font-size="15">
<rect width="600" height="400" fill="#fff"/>
<text x="300" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Plato's divided line (Republic VI)</text>
<line x1="150" y1="60" x2="150" y2="370" stroke="#222" stroke-width="3"/>
<line x1="140" y1="215" x2="160" y2="215" stroke="#222" stroke-width="3"/>
<line x1="142" y1="137" x2="158" y2="137" stroke="#222" stroke-width="2"/>
<line x1="142" y1="292" x2="158" y2="292" stroke="#222" stroke-width="2"/>
<rect x="175" y="62" width="400" height="150" fill="#dbe7f7" stroke="#2b5fa3"/>
<rect x="175" y="218" width="400" height="150" fill="#fbe3d0" stroke="#b55d1e"/>
<text x="185" y="82" font-weight="bold" fill="#2b5fa3">INTELLIGIBLE  (knowledge, epistēmē)</text>
<text x="185" y="108" fill="#222"><tspan font-weight="bold">Understanding</tspan> (noēsis): Forms, grasped by dialectic</text>
<text x="185" y="130" fill="#555" font-size="13">object: the Forms, the Good</text>
<text x="185" y="166" fill="#222"><tspan font-weight="bold">Thought</tspan> (dianoia): mathematics, reasoning from hypotheses</text>
<text x="185" y="188" fill="#555" font-size="13">object: mathematical objects, uses diagrams</text>
<text x="185" y="238" font-weight="bold" fill="#b55d1e">VISIBLE  (opinion, doxa)</text>
<text x="185" y="264" fill="#222"><tspan font-weight="bold">Belief</tspan> (pistis): everyday perception</text>
<text x="185" y="286" fill="#555" font-size="13">object: physical things, animals, artefacts</text>
<text x="185" y="322" fill="#222"><tspan font-weight="bold">Imagination</tspan> (eikasia): shadows, reflections, images</text>
<text x="185" y="344" fill="#555" font-size="13">object: images of things (the cave wall)</text>
<text x="20" y="100" fill="#2b5fa3" font-size="13">more</text><text x="20" y="116" fill="#2b5fa3" font-size="13">real</text>
<text x="20" y="330" fill="#b55d1e" font-size="13">less</text><text x="20" y="346" fill="#b55d1e" font-size="13">real</text>
<text x="300" y="392" text-anchor="middle" fill="#555" font-size="12">Each level stands to the one below as original to image.</text>
</svg>
