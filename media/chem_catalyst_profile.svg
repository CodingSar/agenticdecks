<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Arial, Helvetica, sans-serif" font-size="14">
<rect width="600" height="400" fill="#fff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1e8449"/></marker></defs>
<path d="M60,360 V30" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<path d="M60,360 H570" stroke="#333" stroke-width="2"/>
<text x="25" y="200" transform="rotate(-90 25 200)" text-anchor="middle" font-weight="bold">Potential energy</text>
<text x="320" y="388" text-anchor="middle" font-weight="bold">Reaction coordinate</text>
<!-- uncatalysed -->
<path d="M80,170 H150 C210,170 220,50 300,50 C380,50 390,290 450,290 H540" fill="none" stroke="#c0392b" stroke-width="3"/>
<!-- catalysed -->
<path d="M80,170 H150 C210,170 220,110 260,110 C290,110 300,140 320,140 C350,140 360,100 380,100 C410,100 400,290 450,290 H540" fill="none" stroke="#1e8449" stroke-width="3" stroke-dasharray="8 4"/>
<text x="95" y="160" font-weight="bold">Reactants</text>
<text x="470" y="282" font-weight="bold">Products</text>
<text x="300" y="40" text-anchor="middle" fill="#c0392b" font-weight="bold">Transition state (uncatalysed)</text>
<text x="395" y="92" fill="#1e8449" font-weight="bold">catalysed path</text>
<text x="320" y="205" text-anchor="middle" fill="#1e8449" font-size="12">intermediate</text>
<!-- Ea uncat -->
<path d="M110,170 V54" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="118" y="115" fill="#c0392b" font-weight="bold">Eₐ</text>
<!-- Ea cat -->
<path d="M175,170 V114" stroke="#1e8449" stroke-width="2" marker-end="url(#ag)" marker-start="url(#ag)"/>
<text x="183" y="146" fill="#1e8449" font-weight="bold">Eₐ(cat)</text>
<!-- dH -->
<path d="M560,170 V288" stroke="#333" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M540,170 H565" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
<text x="552" y="225" text-anchor="end" font-weight="bold">ΔH &lt; 0</text>
<text x="552" y="242" text-anchor="end" font-size="12">(same with or</text>
<text x="552" y="257" text-anchor="end" font-size="12">without catalyst)</text>
</svg>
