<text x="300" y="258" text-anchor="middle" fill="#1f6fb2" font-weight="bold">Ionisation energy, electronegativity: up and right</text>
<text x="300" y="290" text-anchor="middle" fill="#c0392b" font-weight="bold">Atomic radius, metallic character: down and left</text>
<text x="300" y="322" text-anchor="middle" fill="#222">Across: more protons, same shell, little extra shielding, so Z_eff rises.</text>
<text x="300" y="342" text-anchor="middle" fill="#222">Down: new shell, more shielding, outer electron is farther away.</text>
<text x="300" y="368" text-anchor="middle" fill="#555" font-size="12">Exceptions: N/O and Be/B (half-filled and filled subshells) dip in ionisation energy.</text>
