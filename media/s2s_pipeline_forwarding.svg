<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="620" height="400" fill="#fff"/>
  <text x="310" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Classic 5-stage pipeline with a forwarding path</text>
  <!-- stage boxes -->
  <g stroke="#222" stroke-width="2" fill="#f4f6fb">
    <rect x="30" y="60" width="90" height="56" rx="6"/>
    <rect x="150" y="60" width="90" height="56" rx="6"/>
    <rect x="270" y="60" width="90" height="56" rx="6"/>
    <rect x="390" y="60" width="90" height="56" rx="6"/>
    <rect x="510" y="60" width="90" height="56" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#222" font-weight="bold">
    <text x="75" y="84">IF</text><text x="195" y="84">ID</text><text x="315" y="84">EX</text><text x="435" y="84">MEM</text><text x="555" y="84">WB</text>
  </g>
  <g text-anchor="middle" fill="#555" font-size="11">
    <text x="75" y="104">fetch</text><text x="195" y="104">decode / regs</text><text x="315" y="104">ALU</text><text x="435" y="104">load / store</text><text x="555" y="104">write reg</text>
  </g>
  <!-- arrows between stages -->
  <g stroke="#222" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M120 88 L148 88"/><path d="M240 88 L268 88"/><path d="M360 88 L388 88"/><path d="M480 88 L508 88"/>
  </g>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker>
  </defs>
  <!-- forwarding path: EX output back to EX input -->
  <path d="M360 72 C 380 40, 300 30, 268 72" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="318" y="40" text-anchor="middle" fill="#c0392b" font-size="12" font-weight="bold">forwarding (bypass) EX&#8594;EX</text>
  <!-- pipeline diagram over time -->
  <text x="30" y="150" fill="#222" font-weight="bold">cycle:</text>
  <g fill="#222" text-anchor="middle">
    <text x="190" y="150">1</text><text x="250" y="150">2</text><text x="310" y="150">3</text><text x="370" y="150">4</text><text x="430" y="150">5</text><text x="490" y="150">6</text><text x="550" y="150">7</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">
    <text x="30" y="185">add r1, r2, r3</text>
    <text x="30" y="230">sub r4, r1, r5</text>
    <text x="30" y="300">ld  r6, [r7]</text>
    <text x="30" y="345">add r8, r6, r9</text>
  </g>
  <!-- row 1 -->
  <g stroke="#222" stroke-width="1.5" font-size="11" text-anchor="middle">
    <rect x="165" y="170" width="50" height="22" fill="#eaf0ff"/><rect x="225" y="170" width="50" height="22" fill="#eaf0ff"/><rect x="285" y="170" width="50" height="22" fill="#ffe3d6"/><rect x="345" y="170" width="50" height="22" fill="#eaf0ff"/><rect x="405" y="170" width="50" height="22" fill="#eaf0ff"/>
    <rect x="225" y="215" width="50" height="22" fill="#eaf0ff"/><rect x="285" y="215" width="50" height="22" fill="#eaf0ff"/><rect x="345" y="215" width="50" height="22" fill="#ffe3d6"/><rect x="405" y="215" width="50" height="22" fill="#eaf0ff"/><rect x="465" y="215" width="50" height="22" fill="#eaf0ff"/>
    <rect x="165" y="285" width="50" height="22" fill="#eaf0ff"/><rect x="225" y="285" width="50" height="22" fill="#eaf0ff"/><rect x="285" y="285" width="50" height="22" fill="#eaf0ff"/><rect x="345" y="285" width="50" height="22" fill="#ffe3d6"/><rect x="405" y="285" width="50" height="22" fill="#eaf0ff"/>
    <rect x="225" y="330" width="50" height="22" fill="#eaf0ff"/><rect x="285" y="330" width="50" height="22" fill="#eaf0ff"/><rect x="345" y="330" width="50" height="22" fill="#fff3b0"/><rect x="405" y="330" width="50" height="22" fill="#ffe3d6"/><rect x="465" y="330" width="50" height="22" fill="#eaf0ff"/><rect x="525" y="330" width="50" height="22" fill="#eaf0ff"/>
  </g>
  <g font-size="11" fill="#222" text-anchor="middle">
    <text x="190" y="185">IF</text><text x="250" y="185">ID</text><text x="310" y="185">EX</text><text x="370" y="185">MEM</text><text x="430" y="185">WB</text>
    <text x="250" y="230">IF</text><text x="310" y="230">ID</text><text x="370" y="230">EX</text><text x="430" y="230">MEM</text><text x="490" y="230">WB</text>
    <text x="190" y="300">IF</text><text x="250" y="300">ID</text><text x="310" y="300">EX</text><text x="370" y="300">MEM</text><text x="430" y="300">WB</text>
    <text x="250" y="345">IF</text><text x="310" y="345">ID</text><text x="370" y="345">stall</text><text x="430" y="345">EX</text><text x="490" y="345">MEM</text><text x="550" y="345">WB</text>
  </g>
  <!-- forward arrows -->
  <path d="M310 192 L365 214" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M370 307 L425 329" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="330" y="262" fill="#c0392b" font-size="11">r1 forwarded: no stall</text>
  <text x="250" y="380" fill="#c0392b" font-size="11">load-use: the value exists only after MEM, so one bubble remains</text>
</svg>
