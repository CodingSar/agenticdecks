<g font-size="13" fill="#222">
<text x="115" y="175" text-anchor="middle">2p</text><text x="485" y="175" text-anchor="middle">2p</text>
<text x="115" y="332" text-anchor="middle">2s</text><text x="485" y="332" text-anchor="middle">2s</text>
<text x="300" y="48" text-anchor="middle">σ*2p (empty)</text>
