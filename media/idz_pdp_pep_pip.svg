<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"><style>
text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#222}
.t{font-size:15px;font-weight:bold}.s{font-size:11px;fill:#555}
.box{fill:#f4f6fa;stroke:#333;stroke-width:1.5}
.blue{fill:#dbe8fb}.green{fill:#dcefdc}.orange{fill:#fde7cc}.red{fill:#f9d6d5}.grey{fill:#ececec}
.ln{stroke:#333;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="600" height="400" fill="#fff"/><rect class="box grey" x="20" y="160" width="110" height="60" rx="6"/><text class="t" x="75.0" y="190.0" text-anchor="middle">Subject</text><text class="s" x="75.0" y="206.0" text-anchor="middle">user / service</text><rect class="box blue" x="200" y="160" width="130" height="60" rx="6"/><text class="t" x="265.0" y="190.0" text-anchor="middle">PEP</text><text class="s" x="265.0" y="206.0" text-anchor="middle">gateway, sidecar</text><rect class="box green" x="450" y="160" width="130" height="60" rx="6"/><text class="t" x="515.0" y="190.0" text-anchor="middle">Resource</text><text class="s" x="515.0" y="206.0" text-anchor="middle">API / data</text><rect class="box orange" x="200" y="30" width="130" height="60" rx="6"/><text class="t" x="265.0" y="60.0" text-anchor="middle">PDP</text><text class="s" x="265.0" y="76.0" text-anchor="middle">policy engine</text><rect class="box grey" x="400" y="30" width="170" height="60" rx="6"/><text class="t" x="485.0" y="60.0" text-anchor="middle">PIP</text><text class="s" x="485.0" y="76.0" text-anchor="middle">attributes: HR, device, graph</text><rect class="box grey" x="20" y="30" width="130" height="60" rx="6"/><text class="t" x="85.0" y="60.0" text-anchor="middle">PAP</text><text class="s" x="85.0" y="76.0" text-anchor="middle">authors policies</text><path class="ln" d="M130,190 L200,190" marker-end="url(#a)"/><rect x="139" y="171.0" width="52" height="17" fill="#fff"/><text class="" x="165.0" y="184.0" text-anchor="middle">request</text><path class="ln" d="M330,190 L450,190" marker-end="url(#a)"/><rect x="357" y="171.0" width="65" height="17" fill="#fff"/><text class="" x="390.0" y="184.0" text-anchor="middle">if Permit</text><path class="ln" d="M250,160 L250,90" marker-end="url(#a)"/><text x="135" y="130" class="s">decision request</text><text x="275" y="130" class="s">Permit / Deny</text><path class="ln" d="M280,90 L280,160" marker-end="url(#a)"/><path class="ln" d="M330,60 L400,60" marker-end="url(#a)"/><rect x="326" y="39.0" width="79" height="17" fill="#fff"/><text class="" x="365.0" y="52.0" text-anchor="middle">fetch attrs</text><path class="ln" d="M150,60 L200,60" marker-end="url(#a)"/><rect x="146" y="39.0" width="59" height="17" fill="#fff"/><text class="" x="175.0" y="52.0" text-anchor="middle">policies</text><text x="20" y="300" class="t">Separation of concerns</text><text x="20" y="325">PEP: in the request path, enforces, knows HTTP</text><text x="20" y="347">PDP: evaluates policy, knows nothing about transport</text><text x="20" y="369">PIP: supplies facts the request itself lacks</text></svg>