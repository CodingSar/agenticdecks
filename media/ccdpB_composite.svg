<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
<rect width="600" height="400" fill="#fff"/>
<defs><marker id="tri" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L10,6 L0,12 z" fill="#fff" stroke="#222"/></marker>
<marker id="dia" markerWidth="14" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M0,5 L6,0 L12,5 L6,10 z" fill="#222"/></marker></defs>
<text x="300" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Composite: treat a leaf and a tree the same</text>
<text x="160" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">Object tree</text>
<g stroke="#555" stroke-width="1.3"><line x1="160" y1="96" x2="90" y2="146"/><line x1="160" y1="96" x2="235" y2="146"/><line x1="90" y1="176" x2="50" y2="236"/><line x1="90" y1="176" x2="135" y2="236"/><line x1="235" y1="176" x2="235" y2="236"/></g>
<rect x="110" y="66" width="100" height="30" rx="4" fill="#fef9c3" stroke="#a16207"/><text x="160" y="86" text-anchor="middle" font-size="12" fill="#222">/ (Folder)</text>
<rect x="40" y="146" width="100" height="30" rx="4" fill="#fef9c3" stroke="#a16207"/><text x="90" y="166" text-anchor="middle" font-size="12" fill="#222">docs (Folder)</text>
<rect x="185" y="146" width="100" height="30" rx="4" fill="#fef9c3" stroke="#a16207"/><text x="235" y="166" text-anchor="middle" font-size="12" fill="#222">img (Folder)</text>
<rect x="10" y="236" width="80" height="30" fill="#dbeafe" stroke="#1d4ed8"/><text x="50" y="256" text-anchor="middle" font-size="12" fill="#222">a.txt 2 KB</text>
<rect x="95" y="236" width="80" height="30" fill="#dbeafe" stroke="#1d4ed8"/><text x="135" y="256" text-anchor="middle" font-size="12" fill="#222">b.pdf 8 KB</text>
<rect x="190" y="236" width="90" height="30" fill="#dbeafe" stroke="#1d4ed8"/><text x="235" y="256" text-anchor="middle" font-size="12" fill="#222">c.png 40 KB</text>
<text x="160" y="300" text-anchor="middle" font-size="12" fill="#333">root.size() → 50 KB, one call,</text>
<text x="160" y="316" text-anchor="middle" font-size="12" fill="#333">recursion does the rest</text>
<line x1="320" y1="50" x2="320" y2="340" stroke="#ddd"/>
<text x="460" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">Classes</text>
<rect x="385" y="70" width="150" height="46" fill="#f3f4f6" stroke="#222"/><text x="460" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Node «interface»</text><text x="460" y="106" text-anchor="middle" font-size="11" fill="#333">size()</text>
<rect x="340" y="200" width="110" height="46" fill="#dbeafe" stroke="#1d4ed8"/><text x="395" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">File (leaf)</text><text x="395" y="236" text-anchor="middle" font-size="11" fill="#333">size() = bytes</text>
<rect x="470" y="200" width="120" height="46" fill="#fef9c3" stroke="#a16207"/><text x="530" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Folder</text><text x="530" y="236" text-anchor="middle" font-size="11" fill="#333">size() = Σ child.size()</text>
<line x1="395" y1="200" x2="440" y2="118" stroke="#222" marker-end="url(#tri)"/>
<line x1="530" y1="200" x2="482" y2="118" stroke="#222" marker-end="url(#tri)"/>
<path d="M565,200 C 580,150 575,100 537,93" fill="none" stroke="#a16207" stroke-width="1.3" marker-start="url(#dia)"/>
<text x="530" y="264" text-anchor="middle" font-size="11" fill="#a16207">◆ holds children: Node[]</text>
<text x="300" y="384" text-anchor="middle" font-size="12" fill="#333">The container holds the same interface it implements: that is the whole trick.</text>
</svg>
