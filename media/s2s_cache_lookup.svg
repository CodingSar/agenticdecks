ke="#9ca3af" stroke-width="1"/><text x="111" y="198" font-size="10" text-anchor="middle" fill="#1f2937">w0</text><rect x="141" y="184" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="167" y="198" font-size="10" text-anchor="middle" fill="#1f2937">w1</text><rect x="197" y="184" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="223" y="198" font-size="10" text-anchor="middle" fill="#1f2937">w2</text><rect x="253" y="184" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="279" y="198" font-size="10" text-anchor="middle" fill="#1f2937">w3</text><rect x="309" y="184" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="335" y="198" font-size="10" text-anchor="middle" fill="#1f2937">w4</text><rect x="365" y="184" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="391" y="198" font-size="10" text-anchor="middle" fill="#1f2937">w5</text><rect x="421" y="184" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="447" y="198" font-size="10" text-anchor="middle" fill="#1f2937">w6</text><rect x="477" y="184" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="503" y="198" font-size="10" text-anchor="middle" fill="#1f2937">w7</text><rect x="80" y="210" width="460" height="28" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><text x="72" y="228" font-size="11" text-anchor="end" fill="#1f2937">...</text><rect x="85" y="214" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><rect x="141" y="214" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><rect x="197" y="214" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><rect x="253" y="214" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><rect x="309" y="214" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><rect x="365" y="214" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><rect x="421" y="214" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><rect x="477" y="214" width="52" height="20" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="300" y="250" font-size="12" text-anchor="middle" fill="#1f2937">8 ways = 8 tags compared in parallel against the address tag</text><line x1="220" y1="72" x2="220" y2="268" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ab)"/><rect x="150" y="270" width="140" height="30" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="220" y="290" font-size="12" text-anchor="middle" fill="#1f2937">tag == tag[w]?</text><line x1="290" y1="285" x2="340" y2="285" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="340" y="270" width="100" height="30" rx="0" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/><text x="390" y="290" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">hit: way w</text><line x1="440" y1="285" x2="480" y2="285" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="480" y="270" width="60" height="30" rx="0" fill="#fee2e2" stroke="#1f2937" stroke-width="2"/><text x="510" y="290" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">miss</text><path d="M560,72 L578,72 L578,318" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="300" y="335" font-size="12" text-anchor="middle" fill="#1f2937">offset picks the byte inside the 64 B line; it is never translated</text><text x="300" y="365" font-size="11" text-anchor="middle" fill="#4b5563">VIPT: bits 11..0 are inside the 4 KB page offset, so index + offset can be</text><text x="300" y="382" font-size="11" text-anchor="middle" fill="#4b5563">taken from the virtual address while the TLB produces the physical tag</text></svg>