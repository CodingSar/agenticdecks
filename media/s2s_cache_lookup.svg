<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937"><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="600" height="400" fill="white"/><text x="300" y="24" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">Set-associative cache lookup (64 B lines, 64 sets, 8 ways)</text><text x="60" y="60" font-size="12" text-anchor="end" fill="#1f2937">address</text><rect x="70" y="46" width="300" height="26" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="220" y="64" font-size="13" text-anchor="middle" fill="#1f2937">tag (bits 63..12)</text><rect x="370" y="46" width="120" height="26" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="430" y="64" font-size="13" text-anchor="middle" fill="#1f2937">index (11..6)</text><rect x="490" y="46" width="80" height="26" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="530" y="64" font-size="13" text-anchor="middle" fill="#1f2937">offset (5..0)</text><line x1="430" y1="72" x2="430" y2="118" stroke="#d97706" stroke-width="2" marker-end="url(#a)"/><text x="445" y="100" font-size="11" text-anchor="start" fill="#1f2937">selects one set</text><rect x="80" y="120" width="460" height="28" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><text x="72" y="138" font-size="11" text-anchor="end" fill="#1f2937">set 0</text><rect x="85" y="124" width="52" height="20" rx="0" fill="#ffffff" stroke="