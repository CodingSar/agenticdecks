<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="600" height="420" fill="white"/><text x="300" y="26" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937" >Gothic nave: half-section</text><line x1="20" y1="360" x2="580" y2="360" stroke="#1f2937" stroke-width="3"/><rect x="340" y="110" width="22" height="250" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><rect x="345" y="120" width="12" height="70" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="300" y="140" font-size="11" text-anchor="end" font-weight="normal" fill="#2563eb" >clerestory</text><line x1="304" y1="142" x2="342" y2="150" stroke="#2563eb" stroke-width="1"/><path d="M362,110 A170,170 0 0 1 520,60" stroke="#1f2937" stroke-width="3" fill="none" stroke-linejoin="round"/><line x1="520" y1="60" x2="520" y2="40" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/><text x="528" y="50" font-size="10" text-anchor="start" font-weight="normal" fill="#9ca3af" >nave axis</text><rect x="130" y="230" width="22" height="130" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><rect x="120" y="150" width="42" height="80" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><path d="M152,230 A94,94 0 0 1 340,230" stroke="#1f2937" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="246" y="300" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937" >aisle</text><path d="M160,165 Q250,145 340,150" stroke="#d97706" stroke-width="5" fill="none" stroke-linejoin="round"/><path d="M160,185 Q250,165 340,172" stroke="#d97706" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="250" y="135" font-size="12" text-anchor="middle" font-weight="bold" fill="#d97706" >flying buttress (flyer)</text><polygon points="128,150 154,150 141,100" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="100" y="110" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2937" >pinnacle</text><line x1="104" y1="108" x2="136" y2="112" stroke="#9ca3af" stroke-width="1"/><text x="60" y="260" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2937" >buttress</text><line x1="64" y1="258" x2="128" y2="258" stroke="#9ca3af" stroke-width="1"/><line x1="400" y1="95" x2="362" y2="112" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/><line x1="335" y1="152" x2="190" y2="178" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/><line x1="150" y1="200" x2="141" y2="340" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/><text x="440" y="92" font-size="11" text-anchor="start" font-weight="normal" fill="#dc2626" >vault thrust</text><text x="300" y="390" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >The vault's sideways push leaps over the aisle and is carried to the ground outside;</text><text x="300" y="406" font-size="11" text-anchor="middle" font-weight="normal" fill="#9ca3af" >the nave wall between piers carries almost nothing → it can become glass.</text></svg>