<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"><style>
text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#222}
.t{font-size:15px;font-weight:bold}.s{font-size:11px;fill:#555}
.box{fill:#f4f6fa;stroke:#333;stroke-width:1.5}
.blue{fill:#dbe8fb}.green{fill:#dcefdc}.orange{fill:#fde7cc}.red{fill:#f9d6d5}.grey{fill:#ececec}
.ln{stroke:#333;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="600" height="400" fill="#fff"/><rect x="20" y="20" width="560" height="150" rx="8" fill="#fff7e6" stroke="#999" stroke-dasharray="4 3"/><text class="s" x="30" y="38">CONTROL PLANE</text><rect class="box orange" x="60" y="60" width="180" height="60" rx="6"/><text class="t" x="150.0" y="90.0" text-anchor="middle">Policy Engine</text><text class="s" x="150.0" y="106.0" text-anchor="middle">trust algorithm: decide</text><rect class="box orange" x="340" y="60" width="200" height="60" rx="6"/><text class="t" x="440.0" y="90.0" text-anchor="middle">Policy Administrator</text><text class="s" x="440.0" y="106.0" text-anchor="middle">configure path, credentials</text><path class="ln" d="M240,90 L340,90" marker-end="url(#a)"/><rect x="261" y="69.0" width="59" height="17" fill="#fff"/><text class="" x="290.0" y="82.0" text-anchor="middle">decision</text><rect x="20" y="200" width="560" height="180" rx="8" fill="#eef5ee" stroke="#999" stroke-dasharray="4 3"/><text class="s" x="30" y="218">DATA PLANE</text><rect class="box grey" x="40" y="270" width="120" height="60" rx="6"/><text class="t" x="100.0" y="300.0" text-anchor="middle">Subject</text><text class="s" x="100.0" y="316.0" text-anchor="middle">user + device</text><rect class="box blue" x="250" y="270" width="120" height="60" rx="6"/><text class="t" x="310.0" y="300.0" text-anchor="middle">PEP</text><text class="s" x="310.0" y="316.0" text-anchor="middle">proxy, gateway</text><rect class="box green" x="440" y="270" width="120" height="60" rx="6"/><text class="t" x="500.0" y="300.0" text-anchor="middle">Resource</text><text class="s" x="500.0" y="316.0" text-anchor="middle">app / data</text><path class="ln" d="M160,300 L250,300" marker-end="url(#a)"/><rect x="179" y="279.0" width="52" height="17" fill="#fff"/><text class="" x="205.0" y="292.0" text-anchor="middle">request</text><path class="ln" d="M370,300 L440,300" marker-end="url(#a)"/><text x="405" y="345" class="s" text-anchor="middle">implicit trust zone</text><path class="ln dash" d="M405,335 L405,308"/><path class="ln dash" d="M310,270 L440,120" marker-end="url(#a)"/><rect x="310" y="184" width="129" height="15" fill="#fff"/><text class="s" x="375" y="195" text-anchor="middle">allow / revoke session</text><path class="ln dash" d="M150,120 L150,200" marker-end="url(#a)"/><text x="160" y="165" class="s">inputs: identity, posture,</text><text x="160" y="180" class="s">threat intel, logs, policy</text><text x="30" y="368" class="s">per-session, per-request decisions; network location grants nothing</text></svg>