<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="sans-serif" font-size="14">
<rect width="600" height="400" fill="#fff"/>
<text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Positions on free will</text>
<text x="300" y="62" text-anchor="middle" fill="#222">Is free will compatible with determinism?</text>
<rect x="60" y="90" width="210" height="60" rx="8" fill="#dbe7f7" stroke="#2b5fa3"/>
<text x="165" y="115" text-anchor="middle" font-weight="bold" fill="#2b5fa3">YES: Compatibilism</text>
<text x="165" y="137" text-anchor="middle" font-size="12" fill="#333">Hobbes, Hume, Frankfurt, Dennett</text>
<rect x="330" y="90" width="210" height="60" rx="8" fill="#fbe3d0" stroke="#b55d1e"/>
<text x="435" y="115" text-anchor="middle" font-weight="bold" fill="#b55d1e">NO: Incompatibilism</text>
<text x="435" y="137" text-anchor="middle" font-size="12" fill="#333">consequence argument (van Inwagen)</text>
<line x1="300" y1="75" x2="165" y2="90" stroke="#555"/>
<line x1="300" y1="75" x2="435" y2="90" stroke="#555"/>
<text x="435" y="185" text-anchor="middle" fill="#222">Is determinism true?</text>
<line x1="435" y1="150" x2="435" y2="170" stroke="#555"/>
<line x1="435" y1="195" x2="330" y2="220" stroke="#555"/>
<line x1="435" y1="195" x2="540" y2="220" stroke="#555"/>
<rect x="240" y="220" width="180" height="70" rx="8" fill="#f3d9d9" stroke="#a33"/>
<text x="330" y="245" text-anchor="middle" font-weight="bold" fill="#a33">Yes: Hard determinism</text>
<text x="330" y="266" text-anchor="middle" font-size="12" fill="#333">no free will (d'Holbach,</text>
<text x="330" y="282" text-anchor="middle" font-size="12" fill="#333">Spinoza in spirit, Pereboom)</text>
<rect x="450" y="220" width="140" height="70" rx="8" fill="#dff0d8" stroke="#3a7d3a"/>
<text x="520" y="245" text-anchor="middle" font-weight="bold" fill="#3a7d3a">No: Libertarianism</text>
<text x="520" y="266" text-anchor="middle" font-size="12" fill="#333">agent causation</text>
<text x="520" y="282" text-anchor="middle" font-size="12" fill="#333">(Reid, Kane, Chisholm)</text>
<rect x="60" y="170" width="210" height="80" rx="8" fill="#fff" stroke="#2b5fa3" stroke-dasharray="4 3"/>
<text x="165" y="192" text-anchor="middle" font-size="12" fill="#2b5fa3">Freedom = acting from your own</text>
<text x="165" y="210" text-anchor="middle" font-size="12" fill="#2b5fa3">desires without compulsion, so</text>
<text x="165" y="228" text-anchor="middle" font-size="12" fill="#2b5fa3">determinism is irrelevant.</text>
<text x="300" y="340" text-anchor="middle" font-size="13" fill="#555">Hard determinism + libertarianism = incompatibilist; compatibilism is unaffected by physics.</text>
<text x="300" y="365" text-anchor="middle" font-size="12" fill="#777">(Hard incompatibilism: no free will whether or not determinism holds.)</text>
</svg>
