<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-family="Helvetica, Arial, sans-serif"><rect x="0" y="0" width="600" height="330" rx="12" fill="#ffffff"/><text x="300" y="26" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold" >Polyrhythm: 3 against 2 and the 12-pulse bell</text><line x1="90" y1="60" x2="90" y2="230" stroke="#e5e7eb" stroke-width="1"/><text x="90" y="56" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" >1</text><line x1="130" y1="60" x2="130" y2="230" stroke="#e5e7eb" stroke-width="1"/><text x="130" y="56" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" >2</text><line x1="170" y1="60" x2="170" y2="230" stroke="#e5e7eb" stroke-width="1"/><text x="170" y="56" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" >3</text><line x1="210" y1="60" x2="210" y2="230" stroke="#e5e7eb" stroke-width="1"/><text x="210" y="56" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" >4</text><line x1="250" y1="60" x2="250" y2="230" stroke="#e5e7eb" stroke-width="1"/><text x="250" y="56" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" >5</text><line x1="290" y1="60" x2="290" y2="230" stroke="#e5e7eb" stroke-width="1"/><text x="290" y="56" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" >6</text><line x1="330" y1="60" x2="330" y2="230" stroke="#e5e7eb" stroke-width="1"/><text x="330" y="56" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" >7</text><line x1="370" y1="60" x2="370" y2="230" stroke="#e5e7eb" stroke-width="1"/><text x="370" y="56" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" >8</text><line x1="410" y1="60" x2="410" y2="230" stroke="#e5e7eb" stroke-width="1"/><text x="410" y="56" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" >9</text><line x1="450" y1="60" x2="450" y2="230" stroke="#e5e7eb" stroke-width="1"/><text x="450" y="56" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" >10</text><line x1="490" y1="60" x2="490" y2="230" stroke="#e5e7eb" stroke-width="1"/><text x="490" y="56" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" >11</text><line x1="530" y1="60" x2="530" y2="230" stroke="#e5e7eb" stroke-width="1"/><text x="530" y="56" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" >12</text><text x="75" y="95" font-size="12" fill="#1f2937" text-anchor="end" font-weight="normal" >2 beats</text><line x1="90" y1="90" x2="530" y2="90" stroke="#9ca3af" stroke-width="1"/><circle cx="90" cy="90" r="9" fill="#2563eb"/><circle cx="330" cy="90" r="9" fill="#2563eb"/><text x="75" y="135" font-size="12" fill="#1f2937" text-anchor="end" font-weight="normal" >3 beats</text><line x1="90" y1="130" x2="530" y2="130" stroke="#9ca3af" stroke-width="1"/><circle cx="90" cy="130" r="9" fill="#dc2626"/><circle cx="250" cy="130" r="9" fill="#dc2626"/><circle cx="410" cy="130" r="9" fill="#dc2626"/><text x="75" y="175" font-size="12" fill="#1f2937" text-anchor="end" font-weight="normal" >4 beats</text><line x1="90" y1="170" x2="530" y2="170" stroke="#9ca3af" stroke-width="1"/><circle cx="90" cy="170" r="9" fill="#059669"/><circle cx="210" cy="170" r="9" fill="#059669"/><circle cx="330" cy="170" r="9" fill="#059669"/><circle cx="450" cy="170" r="9" fill="#059669"/><text x="75" y="215" font-size="12" fill="#1f2937" text-anchor="end" font-weight="normal" >bell</text><line x1="90" y1="210" x2="530" y2="210" stroke="#9ca3af" stroke-width="1"/><circle cx="90" cy="210" r="9" fill="#d97706"/><circle cx="170" cy="210" r="9" fill="#d97706"/><circle cx="250" cy="210" r="9" fill="#d97706"/><circle cx="290" cy="210" r="9" fill="#d97706"/><circle cx="370" cy="210" r="9" fill="#d97706"/><circle cx="450" cy="210" r="9" fill="#d97706"/><circle cx="530" cy="210" r="9" fill="#d97706"/><text x="300" y="265" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >12 pulses divide evenly by 2, 3 and 4: every player hears a different grouping of the same pulses.</text><text x="300" y="287" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >The standard bell pattern (x.x.xx.x.x.x) is asymmetric, so it fixes where the cycle starts.</text><text x="300" y="310" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" >Hemiola in Western music (Bernstein's 'America') = the same 3:2 idea, used sparingly.</text></svg>