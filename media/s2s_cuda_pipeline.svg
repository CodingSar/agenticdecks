<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937"><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="600" height="400" fill="white"/><text x="300" y="24" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">CUDA C++ → PTX → SASS: the two halves of nvcc</text><rect x="230" y="44" width="140" height="34" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="300" y="66" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">kernel.cu</text><line x1="300" y1="78" x2="300" y2="100" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="320" y="94" font-size="11" text-anchor="start" fill="#1f2937">nvcc splits host / device</text><rect x="40" y="104" width="170" height="34" rx="0" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="125" y="126" font-size="11" text-anchor="middle" fill="#1f2937">host C++ (main, launches)</text><line x1="125" y1="138" x2="125" y2="166" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="140" y="156" font-size="10" text-anchor="start" fill="#1f2937">gcc / clang / MSVC</text><rect x="40" y="170" width="170" height="34" rx="0" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="125" y="192" font-size="11" text-anchor="middle" fill="#1f2937">host object (x86-64 / arm64)</text><line x1="125" y1="204" x2="125" y2="330" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="104" width="240" height="34" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="450" y="126" font-size="11" text-anchor="middle" fill="#1f2937">device code: __global__ kernels</text><line x1="450" y1="138" x2="450" y2="166" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="465" y="156" font-size="10" text-anchor="start" fill="#1f2937">cicc (LLVM-based)</text><rect x="330" y="170" width="240" height="34" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="450" y="192" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2937">PTX: virtual ISA, text (compute_90)</text><line x1="450" y1="204" x2="450" y2="232" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="465" y="222" font-size="10" text-anchor="start" fill="#1f2937">ptxas (regalloc, scheduling)</text><rect x="330" y="236" width="240" height="34" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="450" y="258" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2937">SASS cubin: real ISA (sm_90)</text><line x1="450" y1="270" x2="450" y2="300" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="302" width="240" height="30" rx="0" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="450" y="322" font-size="11" text-anchor="middle" fill="#1f2937">fatbin = cubins + PTX, embedded</text><line x1="330" y1="317" x2="215" y2="317" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><line x1="125" y1="330" x2="125" y2="340" stroke="#1f2937" stroke-width="2"/><rect x="40" y="340" width="320" height="34" rx="0" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/><text x="200" y="362" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">one executable: host code + fatbin</text><path d="M572,187 Q605,270 575,350" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ab)"/><text x="590" y="388" font-size="10" text-anchor="end" fill="#2563eb">driver JIT: PTX → SASS at run time for a newer GPU with no matching cubin</text></svg>