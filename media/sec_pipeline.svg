<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
<rect width="600" height="400" fill="#fff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="300" y="28" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">The deployment pipeline (Humble &amp; Farley)</text>
<g font-size="12" fill="#222" text-anchor="middle">
<rect x="20" y="120" width="95" height="70" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="67" y="150">Commit</text><text x="67" y="166">stage</text>
<rect x="140" y="120" width="95" height="70" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="187" y="150">Automated</text><text x="187" y="166">acceptance</text>
<rect x="260" y="120" width="95" height="70" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><text x="307" y="150">Capacity</text><text x="307" y="166">tests</text>
<rect x="380" y="120" width="95" height="70" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><text x="427" y="150">Manual /</text><text x="427" y="166">UAT</text>
<rect x="500" y="120" width="85" height="70" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="542" y="150">Release</text><text x="542" y="166">(prod)</text>
</g>
<g stroke="#333" stroke-width="2" marker-end="url(#a)"><line x1="115" y1="155" x2="138" y2="155"/><line x1="235" y1="155" x2="258" y2="155"/><line x1="355" y1="155" x2="378" y2="155"/><line x1="475" y1="155" x2="498" y2="155"/></g>
<text x="67" y="105" text-anchor="middle" font-size="11" fill="#15803d">&lt; 10 min · compile, unit, lint</text>
<!-- artifact -->
<rect x="20" y="215" width="565" height="26" fill="#e0e7ff" stroke="#3730a3"/>
<text x="302" y="233" text-anchor="middle" font-size="12" fill="#3730a3">one binary, built once at the commit stage, promoted unchanged – only configuration varies</text>
<!-- confidence / cost arrows -->
<line x1="30" y1="300" x2="570" y2="300" stroke="#15803d" stroke-width="2" marker-end="url(#a)"/>
<text x="300" y="292" text-anchor="middle" font-size="12" fill="#15803d">confidence rises →</text>
<line x1="30" y1="330" x2="570" y2="330" stroke="#b91c1c" stroke-width="2" marker-end="url(#a)"/>
<text x="300" y="350" text-anchor="middle" font-size="12" fill="#b91c1c">cost and time per run rise → so fail fast in the cheap stages</text>
<text x="300" y="385" text-anchor="middle" font-size="12" fill="#555">Any red stage stops the line. Every environment is deployed the same way.</text>
</svg>
