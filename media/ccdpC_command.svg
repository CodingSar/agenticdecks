<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937"><title>Command pattern with undo history</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="640" height="370" fill="#ffffff"/><text x="320" y="30" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="bold">Command: request as an object, with an undo stack</text><rect x="20" y="70" width="140" height="60" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="90.0" y="96.05" text-anchor="middle" font-size="13" font-weight="bold">Invoker</text><text x="90.0" y="113.05" text-anchor="middle" font-size="13">button, shortcut</text><rect x="230" y="60" width="180" height="80" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="320.0" y="87.55" text-anchor="middle" font-size="13" font-weight="bold">«interface» Command</text><text x="320.0" y="104.55" text-anchor="middle" font-size="13">execute()</text><text x="320.0" y="121.55" text-anchor="middle" font-size="13">undo()</text><line x1="160" y1="100" x2="228" y2="100" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="194" y="92" text-anchor="middle" font-size="11" fill="#1f2937" font-style="italic">calls</text><rect x="230" y="190" width="180" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="320.0" y="216.05" text-anchor="middle" font-size="13" font-weight="bold">MoveShape</text><text x="320.0" y="233.05" text-anchor="middle" font-size="13">shape, dx, dy</text><line x1="320" y1="190" x2="320" y2="142" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/><path d="M312,152 L320,140 L328,152 z" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><rect x="230" y="300" width="180" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="320.0" y="321.05" text-anchor="middle" font-size="13" font-weight="bold">Receiver</text><text x="320.0" y="338.05" text-anchor="middle" font-size="13">Drawing (does the work)</text><line x1="320" y1="250" x2="320" y2="298" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="350" y="280" text-anchor="start" font-size="11" fill="#1f2937" font-style="italic">acts on</text><text x="530" y="62" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="bold">History stack</text><rect x="460" y="75" width="140" height="36" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="530.0" y="97.55" text-anchor="middle" font-size="13" font-weight="bold">Recolour #3</text><rect x="460" y="117" width="140" height="36" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="530.0" y="139.55" text-anchor="middle" font-size="13">Delete #7</text><rect x="460" y="159" width="140" height="36" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="530.0" y="181.55" text-anchor="middle" font-size="13">Move #2</text><line x1="455" y1="72" x2="455" y2="205" stroke="#1f2937" stroke-width="2"/><line x1="605" y1="72" x2="605" y2="205" stroke="#1f2937" stroke-width="2"/><line x1="455" y1="205" x2="605" y2="205" stroke="#1f2937" stroke-width="2"/><line x1="412" y1="90" x2="458" y2="90" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="435" y="82" text-anchor="middle" font-size="11" fill="#1f2937" font-style="italic">push</text><text x="530" y="232" text-anchor="middle" font-size="13" fill="#1f2937">Undo: pop the top,</text><text x="530" y="250" text-anchor="middle" font-size="13" fill="#1f2937">call undo()</text><text x="530" y="270" text-anchor="middle" font-size="13" fill="#1f2937">Redo: re-execute()</text></svg>