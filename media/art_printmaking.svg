<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="600" height="400" rx="14" fill="#fbfbf8"/>
<text x="30" y="32" fill="#1f2937" font-size="16" text-anchor="start" font-weight="700">Relief vs intaglio: where the ink sits</text>
<rect x="50" y="150" width="220" height="80" fill="#e7d5b8" stroke="#1f2937" stroke-width="1.8"/>
<rect x="70" y="150" width="30" height="22" fill="#fbfbf8" stroke="#1f2937" stroke-width="1.2"/>
<rect x="140" y="150" width="35" height="22" fill="#fbfbf8" stroke="#1f2937" stroke-width="1.2"/>
<rect x="215" y="150" width="35" height="22" fill="#fbfbf8" stroke="#1f2937" stroke-width="1.2"/>
<rect x="50" y="144" width="20" height="6" fill="#1f2937"/>
<rect x="100" y="144" width="40" height="6" fill="#1f2937"/>
<rect x="175" y="144" width="40" height="6" fill="#1f2937"/>
<rect x="250" y="144" width="20" height="6" fill="#1f2937"/>
<text x="160" y="120" fill="#1f2937" font-size="12" text-anchor="middle">ink on the raised surface</text>
<text x="160" y="262" fill="#1f2937" font-size="12" text-anchor="middle">cut away what should stay white</text>
<rect x="40" y="86" width="240" height="10" fill="#fff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="40" y="80" fill="#9ca3af" font-size="10.5" text-anchor="start">paper</text>
<line x1="160.0" y1="100.0" x2="160.0" y2="138.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)" opacity="1"/>
<text x="160" y="300" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="700">RELIEF: woodcut, linocut</text>
<rect x="330" y="150" width="220" height="80" fill="#e7d5b8" stroke="#1f2937" stroke-width="1.8"/>
<path d="M360,150 L364.0,168 L368,150 Z" fill="#1f2937" stroke="#1f2937" stroke-width="1"/>
<path d="M400,150 L402.5,168 L405,150 Z" fill="#1f2937" stroke="#1f2937" stroke-width="1"/>
<path d="M440,150 L445.0,168 L450,150 Z" fill="#1f2937" stroke="#1f2937" stroke-width="1"/>
<path d="M480,150 L483.0,168 L486,150 Z" fill="#1f2937" stroke="#1f2937" stroke-width="1"/>
<path d="M515,150 L519.5,168 L524,150 Z" fill="#1f2937" stroke="#1f2937" stroke-width="1"/>
<text x="440" y="120" fill="#1f2937" font-size="12" text-anchor="middle">ink wiped into the grooves</text>
<text x="440" y="262" fill="#1f2937" font-size="12" text-anchor="middle">damp paper pressed in picks it up</text>
<rect x="320" y="86" width="240" height="10" fill="#fff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="320" y="80" fill="#9ca3af" font-size="10.5" text-anchor="start">paper</text>
<line x1="440.0" y1="100.0" x2="440.0" y2="138.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)" opacity="1"/>
<text x="440" y="300" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="700">INTAGLIO: engraving, etching, drypoint</text>
<text x="30" y="340" fill="#1f2937" font-size="12" text-anchor="start">Relief prints show bold black lines on white; intaglio lines are fine and sit as a raised ridge of ink;</text>
<text x="30" y="358" fill="#1f2937" font-size="12" text-anchor="start">the plate mark (embossed edge) around an intaglio print betrays the press.</text>
<text x="30" y="386" fill="#1f2937" font-size="12" text-anchor="start">Engraving: cut by a burin (Dürer). Etching: drawn through wax, bitten by acid (Rembrandt, Goya).</text>
</svg>
