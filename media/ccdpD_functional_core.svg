<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Helvetica, Arial, sans-serif">
<rect width="640" height="380" fill="#ffffff"/>
<text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Functional core, imperative shell</text>
<rect x="40" y="50" width="560" height="300" rx="20" fill="#fff3e0" stroke="#222" stroke-width="2.5"/>
<text x="60" y="78" font-size="15" font-weight="bold" fill="#e65100">Imperative shell: I/O, clock, randomness, few branches</text>
<rect x="190" y="130" width="260" height="140" rx="16" fill="#e8f5e9" stroke="#222" stroke-width="2.5"/>
<text x="320" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">Functional core</text>
<text x="320" y="185" text-anchor="middle" font-size="14" fill="#222">pure functions, all decisions</text>
<text x="320" y="207" text-anchor="middle" font-size="14" fill="#222">values in, values out</text>
<text x="320" y="229" text-anchor="middle" font-size="14" fill="#222">unit tests, no mocks</text>
<g font-size="14" fill="#222">
<text x="58" y="160">1. read</text><text x="58" y="180">DB, HTTP,</text><text x="58" y="200">now()</text>
<text x="492" y="160">3. act</text><text x="492" y="180">write DB,</text><text x="492" y="200">send email</text>
</g>
<g stroke="#1565c0" stroke-width="3" fill="#1565c0">
<line x1="130" y1="200" x2="180" y2="200"/><polygon points="180,193 192,200 180,207"/>
<line x1="450" y1="200" x2="470" y2="200"/><polygon points="470,193 482,200 470,207"/>
</g>
<text x="155" y="225" text-anchor="middle" font-size="13" fill="#1565c0">data</text>
<text x="486" y="228" text-anchor="start" font-size="13" fill="#1565c0">decision</text>
<text x="320" y="320" text-anchor="middle" font-size="14" fill="#444">2. decide. The shell is thin, tested by a few integration tests</text>
</svg>
