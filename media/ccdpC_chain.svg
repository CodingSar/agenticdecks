<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937"><title>Chain of Responsibility pipeline</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="640" height="370" fill="#ffffff"/><text x="320" y="30" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="bold">Chain of Responsibility: HTTP middleware</text><rect x="10" y="90" width="90" height="60" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="55.0" y="116.05" text-anchor="middle" font-size="13" font-weight="bold">Request</text><text x="55.0" y="133.05" text-anchor="middle" font-size="13">GET /cart</text><line x1="100" y1="120" x2="128" y2="120" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="90" width="100" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="180.0" y="116.05" text-anchor="middle" font-size="13" font-weight="bold">Auth</text><text x="180.0" y="133.05" text-anchor="middle" font-size="13">logged in?</text><line x1="230" y1="120" x2="248" y2="120" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="250" y="90" width="100" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="300.0" y="116.05" text-anchor="middle" font-size="13" font-weight="bold">Rate limit</text><text x="300.0" y="133.05" text-anchor="middle" font-size="13">quota left?</text><line x1="350" y1="120" x2="368" y2="120" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="370" y="90" width="100" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="420.0" y="116.05" text-anchor="middle" font-size="13" font-weight="bold">Logging</text><text x="420.0" y="133.05" text-anchor="middle" font-size="13">always</text><line x1="470" y1="120" x2="488" y2="120" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="490" y="90" width="100" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="540.0" y="116.05" text-anchor="middle" font-size="13" font-weight="bold">Handler</text><text x="540.0" y="133.05" text-anchor="middle" font-size="13">build cart</text><text x="320" y="70" text-anchor="middle" font-size="12" fill="#1f2937" font-style="italic">each arrow = next(): pass the request on</text><line x1="180" y1="152" x2="180" y2="222" stroke="#b91c1c" stroke-width="2" marker-end="url(#a)"/><rect x="125" y="225" width="110" height="46" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="180.0" y="244.2" text-anchor="middle" font-size="12" font-weight="bold">401 stop</text><text x="180.0" y="260.2" text-anchor="middle" font-size="12">chain ends here</text><line x1="300" y1="152" x2="300" y2="222" stroke="#b91c1c" stroke-width="2" marker-end="url(#a)"/><rect x="245" y="225" width="110" height="46" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="300.0" y="244.2" text-anchor="middle" font-size="12" font-weight="bold">429 stop</text><text x="300.0" y="260.2" text-anchor="middle" font-size="12">chain ends here</text><rect x="390" y="225" width="230" height="46" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="505.0" y="244.2" text-anchor="middle" font-size="12">Sender knows only the first link</text><text x="505.0" y="260.2" text-anchor="middle" font-size="12">links can be added or reordered</text><text x="320" y="320" text-anchor="middle" font-size="13" fill="#1f2937">Each handler either handles the request (and may stop the chain)</text><text x="320" y="340" text-anchor="middle" font-size="13" fill="#1f2937">or passes it to its successor. Servlet filters, Express middleware.</text></svg>