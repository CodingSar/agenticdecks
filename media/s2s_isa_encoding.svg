<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="640" height="400" fill="#fff"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Instruction encoding: three ISA families</text>
  <!-- AArch64 / RISC-V -->
  <text x="20" y="60" fill="#222" font-weight="bold">AArch64 / RISC-V base: every instruction 32 bits</text>
  <g stroke="#222" stroke-width="1.5">
    <rect x="20" y="70" width="140" height="34" fill="#eaf0ff"/><rect x="160" y="70" width="140" height="34" fill="#eaf0ff"/><rect x="300" y="70" width="140" height="34" fill="#eaf0ff"/><rect x="440" y="70" width="140" height="34" fill="#eaf0ff"/>
  </g>
  <g text-anchor="middle" fill="#222" font-family="Menlo, Consolas, monospace" font-size="11">
    <text x="90" y="91">add x0,x1,x2</text><text x="230" y="91">ldr x3,[x4,#8]</text><text x="370" y="91">movk x0,#1,lsl 16</text><text x="510" y="91">b.eq .L1</text>
  </g>
  <text x="20" y="122" fill="#555" font-size="11">4-byte aligned: the decoder knows where N+1 starts before decoding N, so wide decode is cheap. Price: small immediates.</text>
  <!-- RISC-V C -->
  <text x="20" y="152" fill="#222" font-weight="bold">RISC-V with C extension: 16-bit and 32-bit mixed, 2-byte aligned</text>
  <g stroke="#222" stroke-width="1.5">
    <rect x="20" y="162" width="70" height="30" fill="#e6f7ea"/><rect x="90" y="162" width="140" height="30" fill="#eaf0ff"/><rect x="230" y="162" width="70" height="30" fill="#e6f7ea"/><rect x="300" y="162" width="70" height="30" fill="#e6f7ea"/><rect x="370" y="162" width="140" height="30" fill="#eaf0ff"/>
  </g>
  <g text-anchor="middle" fill="#222" font-family="Menlo, Consolas, monospace" font-size="11">
    <text x="55" y="181">c.add</text><text x="160" y="181">lw a0,100(a1)</text><text x="265" y="181">c.li</text><text x="335" y="181">c.bnez</text><text x="440" y="181">jal ra,f</text>
  </g>
  <text x="20" y="208" fill="#555" font-size="11">low 2 bits of the first halfword say "16-bit" (not 11) or "32-bit" (11): length known from one field.</text>
  <!-- x86 -->
  <text x="20" y="240" fill="#222" font-weight="bold">x86-64: 1 to 15 bytes, length found only by decoding prefixes/opcode/ModRM</text>
  <g stroke="#222" stroke-width="1.5">
    <rect x="20" y="250" width="40" height="30" fill="#ffe3d6"/><rect x="60" y="250" width="80" height="30" fill="#ffe3d6"/><rect x="140" y="250" width="120" height="30" fill="#ffe3d6"/><rect x="260" y="250" width="200" height="30" fill="#ffe3d6"/><rect x="460" y="250" width="60" height="30" fill="#ffe3d6"/>
  </g>
  <g text-anchor="middle" fill="#222" font-family="Menlo, Consolas, monospace" font-size="11">
    <text x="40" y="269">ret</text><text x="100" y="269">mov eax,ebx</text><text x="200" y="269">add rax,[rbx+rcx*8]</text><text x="360" y="269">mov r11,[rip+disp32] (7 B)</text><text x="490" y="269">jne</text>
  </g>
  <text x="20" y="296" fill="#555" font-size="11">1 B &#160;&#160;&#160;&#160;&#160;&#160; 2 B &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160; 4 B (REX+op+ModRM+SIB) &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160; 2 B</text>
  <!-- z -->
  <text x="20" y="326" fill="#222" font-weight="bold">z/Architecture: 2, 4 or 6 bytes; the top two bits of the opcode byte give the length</text>
  <g stroke="#222" stroke-width="1.5">
    <rect x="20" y="336" width="60" height="30" fill="#fff3b0"/><rect x="80" y="336" width="120" height="30" fill="#fff3b0"/><rect x="200" y="336" width="180" height="30" fill="#fff3b0"/><rect x="380" y="336" width="180" height="30" fill="#fff3b0"/>
  </g>
  <g text-anchor="middle" fill="#222" font-family="Menlo, Consolas, monospace" font-size="11">
    <text x="50" y="355">AR 1,2</text><text x="140" y="355">L 3,8(4,5)</text><text x="290" y="355">MVC 0(80,6),0(7)</text><text x="470" y="355">AP 0(8,6),0(5,7)</text>
  </g>
  <text x="20" y="384" fill="#555" font-size="11">RR 2 B (00) &#160;&#160;&#160; RX 4 B (01/10) &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160; SS 6 B (11): memory-to-memory with length(s) in the instruction</text>
</svg>
