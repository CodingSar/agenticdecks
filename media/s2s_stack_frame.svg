<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937"><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="600" height="400" fill="white"/><text x="300" y="24" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">x86-64 System V stack frame (one call deep)</text><rect x="170" y="46" width="220" height="34" rx="2" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="280.0" y="67.0" font-size="12" text-anchor="middle" fill="#1f2937">caller's frame</text><rect x="170" y="80" width="220" height="30" rx="2" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="280.0" y="99.0" font-size="12" text-anchor="middle" fill="#1f2937">stack args 7+ (if any)</text><rect x="170" y="110" width="220" height="30" rx="2" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="280.0" y="129.0" font-size="12" text-anchor="middle" fill="#1f2937">return address (pushed by call)</text><line x1="110" y1="140" x2="166" y2="140" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/><text x="104" y="144" font-size="11" text-anchor="end" fill="#1f2937">entry: rsp ≡ 8 (mod 16)</text><rect x="170" y="140" width="220" height="30" rx="2" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="280.0" y="159.0" font-size="12" text-anchor="middle" fill="#1f2937">saved rbp (push rbp)</text><line x1="450" y1="155.0" x2="394" y2="155.0" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="456" y="159.0" font-size="12" text-anchor="start" fill="#dc2626">rbp (if frame pointer kept)</text><rect x="170" y="170" width="220" height="30" rx="2" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="280.0" y="189.0" font-size="12" text-anchor="middle" fill="#1f2937">callee-saved regs (rbx, r12–r15)</text><rect x="170" y="200" width="220" height="30" rx="2" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/><text x="280.0" y="219.0" font-size="12" text-anchor="middle" fill="#1f2937">locals</text><rect x="170" y="230" width="220" height="30" rx="2" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/><text x="280.0" y="249.0" font-size="12" text-anchor="middle" fill="#1f2937">spill slots</text><rect x="170" y="260" width="220" height="30" rx="2" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="280.0" y="279.0" font-size="12" text-anchor="middle" fill="#1f2937">outgoing args for next call</text><line x1="450" y1="290" x2="394" y2="290" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><text x="456" y="294" font-size="12" text-anchor="start" fill="#2563eb">rsp: 16-byte aligned at each call</text><rect x="170" y="290" width="220" height="34" rx="2" fill="#fee2e2" stroke="#1f2937" stroke-width="2"/><text x="280.0" y="311.0" font-size="12" text-anchor="middle" fill="#1f2937">red zone: 128 B, leaf functions only</text><text x="220.0" y="346" font-size="12" text-anchor="middle" fill="#374151">lower addresses ↓ (stack grows down)</text><text x="80" y="60" font-size="12" text-anchor="middle" fill="#374151">higher addresses ↑</text><text x="80" y="230" font-size="11" text-anchor="middle" fill="#1f2937">frame = everything</text><text x="80" y="246" font-size="11" text-anchor="middle" fill="#1f2937">from return address</text><text x="80" y="262" font-size="11" text-anchor="middle" fill="#1f2937">down to rsp</text></svg>