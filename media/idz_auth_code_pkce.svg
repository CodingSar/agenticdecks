<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"><style>
text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#222}
.t{font-size:15px;font-weight:bold}.s{font-size:11px;fill:#555}
.box{fill:#f4f6fa;stroke:#333;stroke-width:1.5}
.blue{fill:#dbe8fb}.green{fill:#dcefdc}.orange{fill:#fde7cc}.red{fill:#f9d6d5}.grey{fill:#ececec}
.ln{stroke:#333;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="600" height="400" fill="#fff"/><rect class="box grey" x="20" y="20" width="120" height="40" rx="6"/><text class="t" x="80.0" y="45.0" text-anchor="middle">Browser</text><rect class="box blue" x="240" y="20" width="120" height="40" rx="6"/><text class="t" x="300.0" y="45.0" text-anchor="middle">Client app</text><rect class="box orange" x="460" y="20" width="120" height="40" rx="6"/><text class="t" x="520.0" y="45.0" text-anchor="middle">Auth Server</text><path class="ln dash" d="M80,60 L80,380"/><path class="ln dash" d="M300,60 L300,380"/><path class="ln dash" d="M520,60 L520,380"/><path class="ln" d="M300,90 L90,90" marker-end="url(#a)"/><rect x="50" y="71.0" width="290" height="17" fill="#fff"/><text class="" x="195.0" y="84.0" text-anchor="middle">1 redirect: code_challenge=SHA256(verifier)</text><path class="ln" d="M80,130 L510,130" marker-end="url(#a)"/><rect x="190" y="111.0" width="211" height="17" fill="#fff"/><text class="" x="295.0" y="124.0" text-anchor="middle">2 authorize request + challenge</text><rect x="450" y="159" width="140" height="15" fill="#fff"/><text class="s" x="520" y="170" text-anchor="middle">3 user logs in, consents</text><path class="ln" d="M510,205 L90,205" marker-end="url(#a)"/><rect x="231" y="186.0" width="138" height="17" fill="#fff"/><text class="" x="300.0" y="199.0" text-anchor="middle">4 redirect with code</text><path class="ln" d="M90,245 L290,245" marker-end="url(#a)"/><rect x="167" y="226.0" width="46" height="17" fill="#fff"/><text class="" x="190.0" y="239.0" text-anchor="middle">5 code</text><path class="ln" d="M310,285 L510,285" marker-end="url(#a)"/><rect x="268" y="266.0" width="283" height="17" fill="#fff"/><text class="" x="410.0" y="279.0" text-anchor="middle">6 POST code + code_verifier (back channel)</text><rect x="385" y="309" width="208" height="15" fill="#fff"/><text class="s" x="590" y="320" text-anchor="end">verify SHA256(verifier) == challenge</text><path class="ln" d="M510,350 L310,350" marker-end="url(#a)"/><rect x="324" y="331.0" width="171" height="17" fill="#fff"/><text class="" x="410.0" y="344.0" text-anchor="middle">7 access (+refresh) token</text></svg>