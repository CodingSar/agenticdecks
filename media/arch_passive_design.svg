<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 385" width="600" height="385" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="600" height="385" fill="white"/><text x="300" y="26" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937" >Passive design: section of a house</text><line x1="20" y1="320" x2="580" y2="320" stroke="#1f2937" stroke-width="3"/><rect x="150" y="150" width="20" height="170" fill="#d97706" stroke="#1f2937" stroke-width="2"/><text x="140" y="240" font-size="11" text-anchor="end" font-weight="normal" fill="#1f2937" >thick insulation</text><text x="140" y="254" font-size="10" text-anchor="end" font-weight="normal" fill="#9ca3af" >(north/cold side)</text><rect x="170" y="300" width="230" height="20" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><text x="285" y="314" font-size="10" text-anchor="middle" font-weight="normal" fill="white" >thermal mass (slab)</text><rect x="400" y="170" width="10" height="130" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="420" y="250" font-size="11" text-anchor="start" font-weight="normal" fill="#2563eb" >south glazing</text><path d="M150,150 L300,110 L470,150" stroke="#1f2937" stroke-width="4" fill="none" stroke-linejoin="round"/><rect x="410" y="146" width="60" height="8" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><text x="480" y="140" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2937" >overhang</text><circle cx="540" cy="60" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="540" y="40" font-size="10" text-anchor="middle" font-weight="normal" fill="#d97706" >summer sun (high)</text><line x1="526" y1="72" x2="455" y2="148" stroke="#d97706" stroke-width="2" marker-end="url(#aa)"/><text x="500" y="100" font-size="10" text-anchor="middle" font-weight="normal" fill="#d97706" >blocked</text><circle cx="560" cy="170" r="16" fill="#fde68a" stroke="#dc2626" stroke-width="2"/><text x="560" y="206" font-size="10" text-anchor="middle" font-weight="normal" fill="#dc2626" >winter sun (low)</text><line x1="542" y1="178" x2="300" y2="298" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="380" y="230" font-size="10" text-anchor="middle" font-weight="normal" fill="#dc2626" >warms the slab</text><rect x="160" y="160" width="10" height="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><line x1="400" y1="190" x2="180" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><text x="290" y="165" font-size="10" text-anchor="middle" font-weight="normal" fill="#2563eb" >cross-ventilation / stack</text><text x="300" y="350" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >Orientation, shading, mass, insulation and airtightness do the work before any machine runs.</text><text x="300" y="368" font-size="11" text-anchor="middle" font-weight="normal" fill="#9ca3af" >Passivhaus adds: ≤ 15 kWh/m²·yr heating, airtight shell, heat-recovery ventilation.</text></svg>