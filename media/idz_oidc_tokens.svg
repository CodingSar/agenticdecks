<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"><style>
text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#222}
.t{font-size:15px;font-weight:bold}.s{font-size:11px;fill:#555}
.box{fill:#f4f6fa;stroke:#333;stroke-width:1.5}
.blue{fill:#dbe8fb}.green{fill:#dcefdc}.orange{fill:#fde7cc}.red{fill:#f9d6d5}.grey{fill:#ececec}
.ln{stroke:#333;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="600" height="400" fill="#fff"/><rect class="box orange" x="230" y="20" width="140" height="50" rx="6"/><text class="t" x="300.0" y="45.0" text-anchor="middle">OpenID Provider</text><text class="s" x="300.0" y="61.0" text-anchor="middle">(Auth Server + IdP)</text><rect class="box blue" x="40" y="180" width="160" height="60" rx="6"/><text class="t" x="120.0" y="215.0" text-anchor="middle">Client / RP</text><rect class="box green" x="400" y="180" width="160" height="60" rx="6"/><text class="t" x="480.0" y="210.0" text-anchor="middle">Resource Server</text><text class="s" x="480.0" y="226.0" text-anchor="middle">(API)</text><path class="ln" d="M260,70 L130,180" marker-end="url(#a)"/><rect x="166" y="102.0" width="59" height="17" fill="#fff"/><text class="" x="195.0" y="115.0" text-anchor="middle">ID token</text><path class="ln" d="M300,70 L150,180" marker-end="url(#a)"/><text x="245" y="140">access token</text><path class="ln" d="M200,215 L400,215" marker-end="url(#a)"/><rect x="205" y="196.0" width="191" height="17" fill="#fff"/><text class="" x="300.0" y="209.0" text-anchor="middle">access token (Bearer / DPoP)</text><path class="ln dash" d="M430,180 L350,70" marker-end="url(#a)"/><rect x="331" y="97" width="138" height="17" fill="#fff"/><text class="" x="400" y="110" text-anchor="middle">JWKS / introspection</text><rect class="box" x="40" y="280" width="250" height="100" rx="6"/><text class="t" x="50" y="300">ID token (for the client)</text><text class="s" x="50" y="320">iss, sub, aud = client_id, exp, nonce</text><text class="s" x="50" y="338">acr, amr, auth_time, email…</text><text class="s" x="50" y="362">"who logged in, how, when"</text><rect class="box" x="310" y="280" width="250" height="100" rx="6"/><text class="t" x="320" y="300">Access token (for the API)</text><text class="s" x="320" y="320">aud = API, scope, exp, sub</text><text class="s" x="320" y="338">JWT or opaque; may be sender-bound</text><text class="s" x="320" y="362">"what this client may call"</text></svg>