<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"><style>
text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#222}
.t{font-size:15px;font-weight:bold}.s{font-size:11px;fill:#555}
.box{fill:#f4f6fa;stroke:#333;stroke-width:1.5}
.blue{fill:#dbe8fb}.green{fill:#dcefdc}.orange{fill:#fde7cc}.red{fill:#f9d6d5}.grey{fill:#ececec}
.ln{stroke:#333;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="600" height="400" fill="#fff"/><rect class="box red" x="40" y="40" width="200" height="60" rx="6"/><text class="t" x="140.0" y="70.0" text-anchor="middle">Root CA</text><text class="s" x="140.0" y="86.0" text-anchor="middle">self-signed, offline</text><rect class="box orange" x="40" y="150" width="200" height="60" rx="6"/><text class="t" x="140.0" y="180.0" text-anchor="middle">Intermediate CA</text><text class="s" x="140.0" y="196.0" text-anchor="middle">signed by root, online</text><rect class="box green" x="40" y="260" width="200" height="60" rx="6"/><text class="t" x="140.0" y="290.0" text-anchor="middle">Leaf certificate</text><text class="s" x="140.0" y="306.0" text-anchor="middle">api.example.com, SAN, EKU</text><path class="ln" d="M140,150 L140,100" marker-end="url(#a)"/><rect x="120" y="112.0" width="39" height="17" fill="#fff"/><text class="" x="140.0" y="125.0" text-anchor="middle">signs</text><path class="ln" d="M140,260 L140,210" marker-end="url(#a)"/><rect x="120" y="222.0" width="39" height="17" fill="#fff"/><text class="" x="140.0" y="235.0" text-anchor="middle">signs</text><text x="100" y="125" class="s"></text><text x="100" y="235" class="s"></text><rect class="box blue" x="330" y="40" width="240" height="90" rx="6"/><text class="t" x="340" y="62">Verifier trust store</text><text class="s" x="340" y="82">contains Root CA (and others)</text><text class="s" x="340" y="100">browser / OS / JVM / container</text><text class="s" x="340" y="118">differ from each other!</text><path class="ln dash" d="M330,85 L245,70" marker-end="url(#a)"/><text x="340" y="170" class="t">Validation path</text><text x="340" y="195">1 leaf signature → intermediate key</text><text x="340" y="219">2 intermediate signature → root key</text><text x="340" y="243">3 root present in trust store</text><text x="340" y="267">4 names (SAN), validity, EKU, CA flag</text><text x="340" y="291">5 revocation: CRL / OCSP / short-lived</text><text class="s" x="330" y="340">Server must send leaf + intermediates;</text><text class="s" x="330" y="356">the root comes from the client.</text></svg>