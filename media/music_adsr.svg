<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" width="600" height="410" font-family="Helvetica, Arial, sans-serif"><rect x="0" y="0" width="600" height="410" rx="12" fill="#ffffff"/><text x="300" y="26" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold" >ADSR envelope: loudness over time</text><line x1="60" y1="320" x2="570" y2="320" stroke="#1f2937" stroke-width="2"/><line x1="60" y1="320" x2="60" y2="60" stroke="#1f2937" stroke-width="2"/><text x="40" y="70" font-size="11" fill="#9ca3af" text-anchor="end" font-weight="normal" >level</text><text x="575" y="340" font-size="11" fill="#9ca3af" text-anchor="end" font-weight="normal" >time</text><polyline points="60,320 140,80 220,160 420,160 520,320" fill="none" stroke="#2563eb" stroke-width="3"/><line x1="140" y1="60" x2="140" y2="320" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><line x1="220" y1="60" x2="220" y2="320" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><line x1="420" y1="60" x2="420" y2="320" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><text x="100" y="352" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" >Attack</text><text x="100" y="370" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" >key down → peak</text><text x="180" y="352" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" >Decay</text><text x="180" y="370" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" >fall to sustain</text><text x="320" y="352" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" >Sustain</text><text x="320" y="370" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" >level while held</text><text x="470" y="352" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" >Release</text><text x="470" y="370" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" >key up → silence</text><text x="420" y="150" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="normal" >key released</text><text x="300" y="395" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" >Piano: fast attack, no sustain. Organ: instant attack, full sustain. Strings: slow attack.</text></svg>