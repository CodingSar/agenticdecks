<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="600" height="400" rx="14" fill="#fbfbf8"/>
<text x="30" y="32" fill="#1f2937" font-size="16" text-anchor="start" font-weight="700">Composition: off-centre placement (thirds) and the stable pyramid</text>
<rect x="40" y="70" width="240" height="170" fill="#fff" stroke="#1f2937" stroke-width="1.8"/>
<line x1="120.0" y1="70.0" x2="120.0" y2="240.0" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4" opacity="1"/>
<line x1="40.0" y1="126.7" x2="280.0" y2="126.7" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4" opacity="1"/>
<line x1="200.0" y1="70.0" x2="200.0" y2="240.0" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4" opacity="1"/>
<line x1="40.0" y1="183.3" x2="280.0" y2="183.3" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4" opacity="1"/>
<line x1="188.3" y1="70.0" x2="188.3" y2="240.0" stroke="#d97706" stroke-width="1.4" stroke-linecap="round" opacity="1"/>
<line x1="40.0" y1="134.9" x2="280.0" y2="134.9" stroke="#d97706" stroke-width="1.4" stroke-linecap="round" opacity="1"/>
<circle cx="200" cy="127" r="9" fill="#dc2626"/>
<text x="186.0" y="150.66666666666666" fill="#dc2626" font-size="11.5" text-anchor="end" font-weight="700">focal point</text>
<line x1="40.0" y1="183.3" x2="280.0" y2="183.3" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" opacity="1"/>
<text x="46" y="177.33333333333331" fill="#2563eb" font-size="11" text-anchor="start">horizon on a third</text>
<text x="40" y="262" fill="#1f2937" font-size="12" text-anchor="start">Rule of thirds (grey) vs golden section 0.618 (amber):</text>
<text x="40" y="280" fill="#1f2937" font-size="12" text-anchor="start">in practice nearly the same lines.</text>
<rect x="330" y="70" width="240" height="170" fill="#fff" stroke="#1f2937" stroke-width="1.8"/>
<polygon points="450.0,92 360,226 540,226" fill="#dbeafe" fill-opacity="0.6" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/>
<circle cx="450.0" cy="106" r="11" fill="#1f2937"/>
<circle cx="400" cy="170" r="9" fill="#1f2937"/>
<circle cx="500" cy="174" r="9" fill="#1f2937"/>
<path d="M425.0,226 Q450.0,122 475.0,226" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.2"/>
<text x="330" y="262" fill="#1f2937" font-size="12" text-anchor="start">Pyramid: broad base, apex at the main head.</text>
<text x="330" y="280" fill="#1f2937" font-size="12" text-anchor="start">Stable and calm (Leonardo, Raphael).</text>
<text x="30" y="330" fill="#1f2937" font-size="12.5" text-anchor="start">Horizontals/verticals read as calm and monumental;</text>
<text x="30" y="348" fill="#1f2937" font-size="12.5" text-anchor="start">diagonals read as movement and drama (Baroque, Romanticism).</text>
<line x1="330.0" y1="322.0" x2="560.0" y2="372.0" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ar)" opacity="1"/>
<text x="470" y="318" fill="#dc2626" font-size="11.5" text-anchor="start">diagonal = energy</text>
</svg>
