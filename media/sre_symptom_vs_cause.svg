<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="s" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect width="600" height="400" rx="14" fill="#fbfbf8"/>
<text x="24" y="32" font-size="17" font-weight="700" fill="#1f2937">Page on symptoms, investigate causes</text>
<!-- causes -->
<g font-size="12" fill="#1f2937">
<rect x="24" y="70" width="150" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="99" y="92" text-anchor="middle">disk 90% full</text>
<rect x="24" y="118" width="150" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="99" y="140" text-anchor="middle">CPU 95%</text>
<rect x="24" y="166" width="150" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="99" y="188" text-anchor="middle">DB replica lag</text>
<rect x="24" y="214" width="150" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="99" y="236" text-anchor="middle">bad deploy</text>
<rect x="24" y="262" width="150" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="99" y="284" text-anchor="middle">cert expiring</text>
<text x="99" y="320" text-anchor="middle" fill="#b45309" font-weight="700">causes: many, changing</text>
<text x="99" y="338" text-anchor="middle" fill="#b45309">→ dashboards, tickets</text>
</g>
<g stroke="#1f2937" stroke-width="1.3">
<line x1="174" y1="87" x2="330" y2="170" marker-end="url(#s)"/>
<line x1="174" y1="135" x2="330" y2="176" marker-end="url(#s)"/>
<line x1="174" y1="183" x2="330" y2="183" marker-end="url(#s)"/>
<line x1="174" y1="231" x2="330" y2="190" marker-end="url(#s)"/>
<line x1="174" y1="279" x2="330" y2="196" marker-end="url(#s)"/>
</g>
<!-- symptom -->
<rect x="332" y="140" width="244" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="454" y="166" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">symptom the user feels</text>
<text x="454" y="188" font-size="12" fill="#991b1b" text-anchor="middle">SLI drops: errors up, latency up</text>
<text x="454" y="208" font-size="12" fill="#991b1b" text-anchor="middle">burn rate &gt; 14.4 → PAGE</text>
<text x="454" y="262" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="700">symptoms: few, stable, user-centred</text>
<text x="454" y="282" font-size="12" fill="#1f2937" text-anchor="middle">one page per user-visible failure,</text>
<text x="454" y="300" font-size="12" fill="#1f2937" text-anchor="middle">not one per possible cause</text>
<text x="24" y="376" font-size="11" fill="#6b7280">A cause alert without a symptom is noise today; a symptom without a known cause is still an outage.</text>
</svg>
