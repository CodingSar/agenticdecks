<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
<rect width="600" height="400" fill="#fff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<text x="300" y="28" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">The Three Ways (Phoenix Project)</text>
<g font-size="13" fill="#222" text-anchor="middle">
<rect x="40" y="120" width="110" height="50" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="95" y="150">Business</text>
<rect x="190" y="120" width="110" height="50" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="245" y="150">Dev</text>
<rect x="340" y="120" width="110" height="50" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="395" y="150">Ops</text>
<rect x="490" y="120" width="90" height="50" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="535" y="150">Customer</text>
</g>
<!-- First way: flow -->
<line x1="40" y1="100" x2="575" y2="100" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
<text x="300" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1st Way – Flow: left to right, small batches, WIP limits, no defects passed downstream</text>
<!-- Second way: feedback -->
<path d="M575,190 L45,190" stroke="#b45309" stroke-width="3" marker-end="url(#b)" fill="none"/>
<text x="300" y="215" text-anchor="middle" font-size="13" fill="#b45309" font-weight="bold">2nd Way – Feedback: right to left, fast and constant (telemetry, stop the line, swarm)</text>
<!-- Third way: learning loop -->
<path d="M120,330 C120,250 480,250 480,330 C480,380 120,380 120,330" stroke="#15803d" stroke-width="3" fill="none" stroke-dasharray="8 5"/>
<text x="300" y="318" text-anchor="middle" font-size="13" fill="#15803d" font-weight="bold">3rd Way – Continual learning and experimentation</text>
<text x="300" y="338" text-anchor="middle" font-size="12" fill="#15803d">blameless post-mortems, inject faults, repetition → mastery</text>
<text x="300" y="356" text-anchor="middle" font-size="12" fill="#15803d">improving daily work beats doing daily work</text>
</svg>
