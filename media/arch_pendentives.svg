<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="600" height="350" fill="white"/><text x="300" y="26" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937" >Dome over a square: pendentives</text><rect x="40" y="70" width="200" height="200" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><circle cx="140.0" cy="170.0" r="100.0" fill="white" stroke="#1f2937" stroke-width="2"/><circle cx="140.0" cy="170.0" r="72.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M40,70 L140.0,70" stroke="none"/><path d="M240,70 L140.0,70" stroke="none"/><path d="M40,270 L140.0,270" stroke="none"/><path d="M240,270 L140.0,270" stroke="none"/><path d="M40,70 L140.0,70 A100.0,100.0 0 0 0 40,170.0 Z" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/><path d="M240,70 L240,170.0 A100.0,100.0 0 0 0 140.0,70 Z" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/><path d="M40,270 L40,170.0 A100.0,100.0 0 0 0 140.0,270 Z" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/><path d="M240,270 L140.0,270 A100.0,100.0 0 0 0 240,170.0 Z" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/><text x="140.0" y="174.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#2563eb" >dome</text><text x="140.0" y="300" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937" >Plan: 4 pendentives (yellow)</text><text x="140.0" y="318" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >turn the square into a circle</text><text x="140.0" y="334" font-size="11" text-anchor="middle" font-weight="normal" fill="#9ca3af" >4 piers, not 4 walls, carry the dome</text><rect x="330" y="120" width="20" height="150" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><rect x="540" y="120" width="20" height="150" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><path d="M350,120 A95.0,80.0 0 0 1 540,120" stroke="#1f2937" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M350,120 A95.0,80.0 0 0 1 540,120 L540,80 Q445.0,65 350,80 Z" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/><rect x="350" y="70" width="190" height="12" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="568" y="80" font-size="10" text-anchor="start" font-weight="normal" fill="#9ca3af" >ring</text><path d="M350,70 A95.0,70 0 0 1 540,70" stroke="#2563eb" stroke-width="3" fill="#dbeafe" stroke-linejoin="round"/><text x="445.0" y="40" font-size="12" text-anchor="middle" font-weight="normal" fill="#2563eb" >dome</text><text x="445.0" y="150" font-size="11" text-anchor="middle" font-weight="bold" fill="#d97706" >pendentive</text><text x="445.0" y="210" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937" >arch</text><line x1="330" y1="270" x2="560" y2="270" stroke="#1f2937" stroke-width="3"/><text x="445.0" y="300" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937" >Elevation: arches on piers,</text><text x="445.0" y="318" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >spherical triangles fill the corners,</text><text x="445.0" y="334" font-size="11" text-anchor="middle" font-weight="normal" fill="#9ca3af" >ring, then dome (Hagia Sophia, 537)</text></svg>