<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="600" height="400" rx="14" fill="#fbfbf8"/>
<text x="30" y="32" fill="#1f2937" font-size="16" text-anchor="start" font-weight="700">Atmospheric perspective: distance = paler, bluer, softer, less contrast</text>
<rect x="40" y="60" width="520" height="260" fill="#eef2ff"/>
<polygon points="40,320 40,138 127,127 213,148 300,137 387,127 473,148 560,137 560,320" fill="#c7d2fe" opacity="0.9" stroke="none"/>
<polygon points="40,320 40,158 114,172 189,188 263,158 337,172 411,188 486,157 560,172 560,320" fill="#93c5fd" opacity="0.9" stroke="none"/>
<polygon points="40,320 40,187 105,226 170,209 235,187 300,226 365,209 430,187 495,226 560,209 560,320" fill="#60a5fa" opacity="0.95" stroke="none"/>
<polygon points="40,320 40,244 98,273 156,226 213,244 271,273 329,225 387,245 444,273 502,225 560,245 560,320" fill="#2d6a4f" opacity="1" stroke="none"/>
<polygon points="40,320 40,302 92,283 144,247 196,302 248,283 300,247 352,303 404,282 456,247 508,303 560,282 560,320" fill="#1b4332" opacity="1" stroke="none"/>
<rect x="90" y="250" width="10" height="70" fill="#3f2a14"/>
<polygon points="95,195 60,265 130,265" fill="#14532d"/>
<polygon points="95,215 55,290 135,290" fill="#14532d"/>
<line x1="70.0" y1="345.0" x2="540.0" y2="345.0" stroke="#1f2937" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ai)" opacity="1"/>
<text x="70" y="364" fill="#1f2937" font-size="12" text-anchor="start">near: dark, warm, sharp, high contrast</text>
<text x="540" y="364" fill="#1f2937" font-size="12" text-anchor="end">far: pale, blue, blurred, low contrast</text>
<text x="70" y="385" fill="#1f2937" font-size="11.5" text-anchor="start">Air scatters blue light and veils detail; Leonardo wrote the rule, landscape painters use it instinctively.</text>
</svg>
