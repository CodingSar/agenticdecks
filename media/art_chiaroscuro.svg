<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="600" height="400" rx="14" fill="#fbfbf8"/>
<text x="30" y="32" fill="#1f2937" font-size="16" text-anchor="start" font-weight="700">Chiaroscuro: modelling a sphere with light and shadow</text>
<defs><radialGradient id="sph" cx="35%" cy="32%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#d6d3d1"/><stop offset="0.7" stop-color="#57534e"/><stop offset="0.88" stop-color="#292524"/><stop offset="1" stop-color="#44403c"/></radialGradient><radialGradient id="shd" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1c1917" stop-opacity="0.8"/><stop offset="1" stop-color="#1c1917" stop-opacity="0"/></radialGradient></defs>
<ellipse cx="270" cy="313" rx="120" ry="22" fill="url(#shd)"/>
