<text x="40" y="62" fill="#d97706" font-size="12" text-anchor="start" font-weight="700">light</text>
<line x1="162.0" y1="170.0" x2="330.0" y2="110.0" stroke="#1f2937" stroke-width="1.2" stroke-linecap="round" opacity="1"/>
<circle cx="162" cy="170" r="3" fill="#dc2626"/>
<text x="335" y="114" fill="#1f2937" font-size="12" text-anchor="start">highlight: lightest spot</text>
