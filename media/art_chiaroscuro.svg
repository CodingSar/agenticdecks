<circle cx="205" cy="215" r="3" fill="#dc2626"/>
<text x="335" y="164" fill="#1f2937" font-size="12" text-anchor="start">halftone: gradual turn from light</text>
<line x1="262.0" y1="255.0" x2="330.0" y2="215.0" stroke="#1f2937" stroke-width="1.2" stroke-linecap="round" opacity="1"/>
<circle cx="262" cy="255" r="3" fill="#dc2626"/>
<text x="335" y="219" fill="#1f2937" font-size="12" text-anchor="start">core shadow: darkest band on the form</text>
<line x1="272.0" y1="282.0" x2="330.0" y2="262.0" stroke="#1f2937" stroke-width="1.2" stroke-linecap="round" opacity="1"/>
<circle cx="272" cy="282" r="3" fill="#dc2626"/>
<text x="335" y="266" fill="#1f2937" font-size="12" text-anchor="start">reflected light: faint glow at the edge</text>
<line x1="290.0" y1="303.0" x2="330.0" y2="312.0" stroke="#1f2937" stroke-width="1.2" stroke-linecap="round" opacity="1"/>
<circle cx="290" cy="303" r="3" fill="#dc2626"/>
<text x="335" y="316" fill="#1f2937" font-size="12" text-anchor="start">cast shadow: sharp near, softer far</text>
