<rect x="320" y="345" width="40" height="28" fill="rgb(31,31,31)" stroke="#1f2937" stroke-width="0.8"/>
<rect x="360" y="345" width="40" height="28" fill="rgb(0,0,0)" stroke="#1f2937" stroke-width="0.8"/>
<text x="40" y="392" fill="#1f2937" font-size="11.5" text-anchor="start">value scale: white → black. Form, depth and legibility ride on value; hue is mostly mood.</text>
