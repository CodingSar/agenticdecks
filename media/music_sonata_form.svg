<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif"><rect x="0" y="0" width="600" height="400" rx="12" fill="#ffffff"/><text x="300" y="26" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold" >Sonata form: a drama of keys</text><rect x="30" y="70" width="200" height="60" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="130.0" y="105" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" >Exposition</text><rect x="240" y="70" width="130" height="60" rx="6" fill="#fee2e2" stroke="#1f2937" stroke-width="2"/><text x="305.0" y="105" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" >Development</text><rect x="380" y="70" width="160" height="60" rx="6" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/><text x="460.0" y="105" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" >Recapitulation</text><rect x="548" y="70" width="40" height="60" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="568.0" y="105" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold" >Coda</text><rect x="40" y="150" width="80" height="40" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="80" y="175" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal" >Theme 1</text><text x="80" y="204" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" >home key (I)</text><rect x="140" y="150" width="80" height="40" rx="6" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="180" y="175" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal" >Theme 2</text><text x="180" y="204" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" >new key (V / III)</text><text x="305" y="165" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >fragments,</text><text x="305" y="181" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >modulations,</text><text x="305" y="197" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >instability</text><rect x="390" y="150" width="70" height="40" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="425" y="175" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal" >Theme 1</text><rect x="470" y="150" width="60" height="40" rx="6" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="500" y="175" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal" >Th. 2</text><text x="460" y="204" font-size="11" fill="#059669" text-anchor="middle" font-weight="bold" >BOTH in home key (I)</text><text x="30" y="250" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="normal" >harmonic tension</text><polyline points="40,330 120,322 220,300 260,280 300,255 340,270 370,250 400,320 530,328 585,332" fill="none" stroke="#d97706" stroke-width="3"/><line x1="30" y1="340" x2="590" y2="340" stroke="#9ca3af" stroke-width="1"/><text x="300" y="365" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >Tension = distance from the home key; resolution = Theme 2 finally heard at home</text><text x="300" y="385" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" >Repeat sign usually after the exposition</text></svg>