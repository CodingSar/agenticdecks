<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="600" height="400" fill="white"/><text x="300" y="26" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937" >Four ways to span a gap</text><rect x="40" y="130" width="18" height="80" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><rect x="152" y="130" width="18" height="80" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><path d="M40,130 L40,114 L170,114 L170,130" stroke="#1f2937" stroke-width="2" fill="#e5e7eb" stroke-linejoin="round"/><path d="M58,120 Q105,138 152,120" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-linejoin="round"/><text x="105" y="100" font-size="11" text-anchor="middle" font-weight="normal" fill="#dc2626" >bending</text><text x="105" y="235" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937" >Post & lintel</text><text x="105" y="252" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >beam bends; stone cracks in</text><text x="105" y="266" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >tension → short spans, forest of columns</text><rect x="320" y="130" width="20" height="80" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><rect x="430" y="130" width="20" height="80" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><path d="M330,130 A55,55 0 0 1 440,130" stroke="#1f2937" stroke-width="4" fill="none" stroke-linejoin="round"/><path d="M342,130 A43,43 0 0 1 428,130" stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-linejoin="round"/><text x="385" y="100" font-size="11" text-anchor="middle" font-weight="normal" fill="#2563eb" >all compression</text><line x1="328" y1="160" x2="302" y2="180" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><line x1="442" y1="160" x2="468" y2="180" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><text x="385" y="235" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937" >Arch</text><text x="385" y="252" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >wedges push each other; needs</text><text x="385" y="266" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >abutment against outward thrust</text><line x1="40" y1="350" x2="180" y2="350" stroke="#1f2937" stroke-width="3"/><line x1="40" y1="350" x2="110" y2="300" stroke="#1f2937" stroke-width="3"/><line x1="110" y1="300" x2="180" y2="350" stroke="#1f2937" stroke-width="3"/><line x1="75" y1="325" x2="75" y2="350" stroke="#1f2937" stroke-width="2"/><line x1="145" y1="325" x2="145" y2="350" stroke="#1f2937" stroke-width="2"/><line x1="75" y1="350" x2="110" y2="300" stroke="#9ca3af" stroke-width="2"/><line x1="145" y1="350" x2="110" y2="300" stroke="#9ca3af" stroke-width="2"/><text x="110" y="372" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937" >Truss</text><text x="110" y="389" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >triangles can't deform; long, light spans</text><rect x="320" y="290" width="30" height="70" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><path d="M350,308 L470,314 L470,322 L350,320 Z" stroke="#1f2937" stroke-width="2" fill="#e5e7eb" stroke-linejoin="round"/><line x1="470" y1="330" x2="470" y2="352" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><text x="410" y="286" font-size="10" text-anchor="middle" font-weight="normal" fill="#9ca3af" >tension on top, compression below</text><text x="410" y="372" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937" >Cantilever</text><text x="410" y="389" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >fixed one end only; needs steel/RC</text></svg>