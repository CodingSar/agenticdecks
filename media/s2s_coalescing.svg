<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937"><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="600" height="400" fill="white"/><text x="300" y="24" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">Global memory: coalesced vs strided warp access</text><text x="20" y="62" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2937">a[tid]: consecutive, aligned</text><rect x="20" y="70" width="34" height="22" rx="0" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><text x="37" y="85" font-size="9" text-anchor="middle" fill="#6b7280">0 B</text><rect x="55" y="70" width="34" height="22" rx="0" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><rect x="90" y="70" width="34" height="22" rx="0" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><rect x="125" y="70" width="34" height="22" rx="0" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><rect x="160" y="70" width="34" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><text x="177" y="85" font-size="9" text-anchor="middle" fill="#6b7280">128 B</text><rect x="195" y="70" width="34" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><rect x="230" y="70" width="34" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><rect x="265" y="70" width="34" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><rect x="300" y="70" width="34" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><text x="317" y="85" font-size="9" text-anchor="middle" fill="#6b7280">256 B</text><rect x="335" y="70" width="34" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><rect x="370" y="70" width="34" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><rect x="405" y="70" width="34" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><rect x="440" y="70" width="34" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><text x="457" y="85" font-size="9" text-anchor="middle" fill="#6b7280">384 B</text><rect x="475" y="70" width="34" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><rect x="510" y="70" width="34" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><rect x="545" y="70" width="34" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><line x1="22.0" y1="118" x2="22.0" y2="94" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><line x1="39.5" y1="118" x2="39.5" y2="94" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><line x1="57.0" y1="118" x2="57.0" y2="94" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><line x1="74.5" y1="118" x2="74.5" y2="94" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><line x1="92.0" y1="118" x2="92.0" y2="94" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><line x1="109.5" y1="118" x2="109.5" y2="94" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><line x1="127.0" y1="118" x2="127.0" y2="94" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><line x1="144.5" y1="118" x2="144.5" y2="94" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><text x="20" y="134" font-size="10" text-anchor="start" fill="#2563eb">t0  t4  t8 ... t28 (32 threads, 4 B each)</text><text x="580" y="134" font-size="10" text-anchor="end" font-weight="bold" fill="#1f2937">128 B wanted / 4 sectors = 128 B moved: 100%</text><text x="20" y="182" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2937">a[4*tid]: stride 4</text><rect x="20" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><text x="37" y="205" font-size="9" text-anchor="middle" fill="#6b7280">0 B</text><rect x="55" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><rect x="90" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><rect x="125" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><rect x="160" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><text x="177" y="205" font-size="9" text-anchor="middle" fill="#6b7280">128 B</text><rect x="195" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><rect x="230" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><rect x="265" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><rect x="300" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><text x="317" y="205" font-size="9" text-anchor="middle" fill="#6b7280">256 B</text><rect x="335" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><rect x="370" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><rect x="405" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><rect x="440" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><text x="457" y="205" font-size="9" text-anchor="middle" fill="#6b7280">384 B</text><rect x="475" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><rect x="510" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><rect x="545" y="190" width="34" height="22" rx="0" fill="#fecaca" stroke="#1f2937" stroke-width="1"/><line x1="22.0" y1="238" x2="22.0" y2="214" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><line x1="92.0" y1="238" x2="92.0" y2="214" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><line x1="162.0" y1="238" x2="162.0" y2="214" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><line x1="232.0" y1="238" x2="232.0" y2="214" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><line x1="302.0" y1="238" x2="302.0" y2="214" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><line x1="372.0" y1="238" x2="372.0" y2="214" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><line x1="442.0" y1="238" x2="442.0" y2="214" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><line x1="512.0" y1="238" x2="512.0" y2="214" stroke="#2563eb" stroke-width="1" marker-end="url(#ab)"/><text x="20" y="254" font-size="10" text-anchor="start" fill="#2563eb">t0  t4  t8 ... t28 (32 threads, 4 B each)</text><text x="580" y="254" font-size="10" text-anchor="end" font-weight="bold" fill="#1f2937">128 B wanted / 16 sectors = 512 B moved: 25%</text><text x="300" y="300" font-size="11" text-anchor="middle" fill="#4b5563">hardware merges a warp's 32 addresses into 32 B sectors; each touched sector is one memory transaction</text><text x="300" y="318" font-size="11" text-anchor="middle" fill="#4b5563">128 B line = 4 sectors. AoS (struct per thread) behaves like the strided case; SoA like the top</text><rect x="60" y="338" width="480" height="44" rx="0" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/><text x="300" y="356" font-size="12" text-anchor="middle" fill="#1f2937">rule of thumb: neighbouring threads → neighbouring addresses,</text><text x="300" y="372" font-size="12" text-anchor="middle" fill="#1f2937">and the warp's first address on a 32 B (ideally 128 B) boundary</text></svg>