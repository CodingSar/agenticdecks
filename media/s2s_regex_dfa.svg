<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect width="600" height="400" fill="white"/>
<text x="300" y="26" font-size="15" font-weight="bold" text-anchor="middle">Regex  a(b|c)*  →  NFA (Thompson)  →  DFA (subset construction)</text>
<!-- NFA -->
<text x="20" y="60" font-weight="bold" fill="#2563eb">NFA: ε-moves, several states active at once</text>
<g stroke="#1f2937" stroke-width="2" fill="white">
<circle cx="40" cy="120" r="14"/><circle cx="110" cy="120" r="14"/><circle cx="180" cy="120" r="14"/>
<circle cx="260" cy="80" r="14"/><circle cx="330" cy="80" r="14"/>
<circle cx="260" cy="160" r="14"/><circle cx="330" cy="160" r="14"/>
<circle cx="410" cy="120" r="14"/><circle cx="480" cy="120" r="14"/><circle cx="480" cy="120" r="10"/>
</g>
<g font-size="11" text-anchor="middle"><text x="40" y="124">0</text><text x="110" y="124">1</text><text x="180" y="124">2</text><text x="260" y="84">3</text><text x="330" y="84">4</text><text x="260" y="164">5</text><text x="330" y="164">6</text><text x="410" y="124">7</text><text x="480" y="124">8</text></g>
<g stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#a)">
<line x1="54" y1="120" x2="95" y2="120"/><line x1="124" y1="120" x2="165" y2="120"/>
<line x1="192" y1="112" x2="248" y2="86"/><line x1="192" y1="128" x2="248" y2="154"/>
<line x1="274" y1="80" x2="315" y2="80"/><line x1="274" y1="160" x2="315" y2="160"/>
<line x1="342" y1="86" x2="398" y2="112"/><line x1="342" y1="154" x2="398" y2="128"/>
<line x1="424" y1="120" x2="465" y2="120"/>
<path d="M410,106 Q295,30 180,106" stroke="#d97706"/>
<path d="M110,134 Q295,230 480,134" stroke="#d97706"/>
</g>
<g font-size="12" text-anchor="middle"><text x="75" y="113">a</text><text x="145" y="113">ε</text><text x="215" y="92">ε</text><text x="215" y="150">ε</text><text x="295" y="72">b</text><text x="295" y="178">c</text><text x="372" y="92">ε</text><text x="372" y="150">ε</text><text x="445" y="113">ε</text><text x="295" y="60" fill="#d97706">ε (loop)</text><text x="295" y="196" fill="#d97706">ε (skip)</text></g>
<!-- DFA -->
<text x="20" y="250" font-weight="bold" fill="#dc2626">DFA: each state = a SET of NFA states, one active state, O(1) per char</text>
<g stroke="#1f2937" stroke-width="2" fill="white">
<rect x="30" y="290" width="60" height="36" rx="18"/>
<rect x="160" y="290" width="150" height="36" rx="18"/><rect x="155" y="285" width="160" height="46" rx="22" fill="none"/>
<rect x="400" y="290" width="170" height="36" rx="18"/><rect x="395" y="285" width="180" height="46" rx="22" fill="none"/>
</g>
<g font-size="11" text-anchor="middle"><text x="60" y="312">{0}</text><text x="235" y="312">{1,2,3,5,8} accept</text><text x="485" y="312">{4 or 6,7,2,3,5,8} accept</text></g>
<g stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#a)">
<line x1="90" y1="308" x2="155" y2="308"/>
<line x1="315" y1="308" x2="395" y2="308"/>
<path d="M540,286 C570,230 450,230 472,282"/>
</g>
<g font-size="12" text-anchor="middle"><text x="122" y="300">a</text><text x="355" y="300">b, c</text><text x="505" y="248">b, c (self-loop)</text></g>
<text x="20" y="365" font-size="12">After <tspan font-weight="bold">a</tspan>, every b or c lands in an accepting set. No backtracking, no ε, one table lookup per character.</text>
<text x="20" y="385" font-size="12" fill="#6b7280">Worst case: subset construction can create 2^n states; lexers minimise the DFA afterwards.</text>
</svg>
