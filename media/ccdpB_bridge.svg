<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
<rect width="600" height="400" fill="#fff"/>
<defs><marker id="tri" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L10,6 L0,12 z" fill="#fff" stroke="#222"/></marker>
<marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#222"/></marker></defs>
<text x="300" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Bridge: two hierarchies joined by one reference</text>
<text x="140" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Abstraction (what)</text>
<text x="460" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">Implementor (how)</text>
<rect x="65" y="72" width="150" height="46" fill="#dbeafe" stroke="#1d4ed8"/><text x="140" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Shape</text><text x="140" y="108" text-anchor="middle" font-size="11" fill="#333">renderer: Renderer</text>
<rect x="385" y="72" width="150" height="46" fill="#fef3c7" stroke="#b45309"/><text x="460" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Renderer</text><text x="460" y="108" text-anchor="middle" font-size="11" fill="#333">drawCircle(), drawRect()</text>
<line x1="215" y1="95" x2="383" y2="95" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="300" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">the bridge</text>
<rect x="30" y="190" width="100" height="30" fill="#dbeafe" stroke="#1d4ed8"/><text x="80" y="210" text-anchor="middle" font-size="12" fill="#222">Circle</text>
<rect x="150" y="190" width="100" height="30" fill="#dbeafe" stroke="#1d4ed8"/><text x="200" y="210" text-anchor="middle" font-size="12" fill="#222">Square</text>
<line x1="80" y1="190" x2="125" y2="120" stroke="#222" marker-end="url(#tri)"/><line x1="200" y1="190" x2="155" y2="120" stroke="#222" marker-end="url(#tri)"/>
<rect x="345" y="190" width="110" height="30" fill="#fef3c7" stroke="#b45309"/><text x="400" y="210" text-anchor="middle" font-size="12" fill="#222">VectorRenderer</text>
<rect x="470" y="190" width="110" height="30" fill="#fef3c7" stroke="#b45309"/><text x="525" y="210" text-anchor="middle" font-size="12" fill="#222">RasterRenderer</text>
<line x1="400" y1="190" x2="445" y2="120" stroke="#222" marker-end="url(#tri)"/><line x1="525" y1="190" x2="475" y2="120" stroke="#222" marker-end="url(#tri)"/>
<text x="140" y="250" text-anchor="middle" font-size="11" fill="#1d4ed8">add Triangle: +1 class</text>
<text x="460" y="250" text-anchor="middle" font-size="11" fill="#b45309">add PdfRenderer: +1 class</text>
<rect x="60" y="280" width="480" height="70" fill="#fee2e2" stroke="#b91c1c" stroke-dasharray="5 4"/>
<text x="300" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Without the bridge (inheritance only):</text>
<text x="300" y="322" text-anchor="middle" font-size="12" fill="#991b1b">VectorCircle, RasterCircle, VectorSquare, RasterSquare, …</text>
<text x="300" y="340" text-anchor="middle" font-size="12" fill="#991b1b">M shapes × N renderers subclasses</text>
<text x="300" y="384" text-anchor="middle" font-size="12" fill="#333">Two dimensions vary independently → give each its own hierarchy: M + N classes.</text>
</svg>
