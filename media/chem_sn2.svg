<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" font-family="Helvetica,Arial,sans-serif" font-size="14">
<rect width="740" height="400" fill="#fff"/>
<text x="370" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">SN2: backside attack, one step, inversion</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker></defs>
<!-- reactant -->
<g transform="translate(0,0)">
<text x="30" y="150" fill="#1b6ca8" font-weight="bold" font-size="16">Nu</text><text x="58" y="142" fill="#1b6ca8" font-weight="bold" font-size="14">−</text>
<path d="M95,145 C115,100 150,95 170,125" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#a)"/>
<circle cx="100" cy="160" r="0" />
<text x="170" y="165" font-size="18" font-weight="bold" fill="#222">C</text>
<line x1="185" y1="160" x2="250" y2="160" stroke="#222" stroke-width="2.5"/>
<text x="252" y="166" fill="#27ae60" font-weight="bold" font-size="16">X</text>
<line x1="175" y1="150" x2="140" y2="108" stroke="#222" stroke-width="2.5"/>
<line x1="178" y1="152" x2="188" y2="95" stroke="#222" stroke-width="2.5"/>
<path d="M176,172 L150,205 L170,208 z" fill="#222"/>
<text x="120" y="102" fill="#555">R</text><text x="186" y="88" fill="#555">R</text><text x="130" y="222" fill="#555">R</text>
<text x="150" y="260" text-anchor="middle" fill="#222">Reactant</text>
<text x="150" y="280" text-anchor="middle" fill="#666" font-size="12">tetrahedral, sp³</text>
</g>
<!-- TS -->
<g transform="translate(220,0)">
<text x="60" y="165" fill="#1b6ca8" font-weight="bold">Nu</text>
<line x1="88" y1="160" x2="140" y2="160" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
<text x="142" y="165" font-size="18" font-weight="bold" fill="#222">C</text>
<line x1="158" y1="160" x2="205" y2="160" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,4"/>
<text x="208" y="166" fill="#27ae60" font-weight="bold">X</text>
<line x1="150" y1="150" x2="125" y2="105" stroke="#222" stroke-width="2.5"/>
<line x1="152" y1="150" x2="178" y2="105" stroke="#222" stroke-width="2.5"/>
<line x1="150" y1="172" x2="150" y2="215" stroke="#222" stroke-width="2.5"/>
<text x="106" y="100" fill="#555">R</text><text x="180" y="100" fill="#555">R</text><text x="144" y="232" fill="#555">R</text>
<text x="25" y="140" fill="#1b6ca8" font-size="12">δ−</text><text x="205" y="148" fill="#27ae60" font-size="12">δ−</text>
<text x="140" y="265" text-anchor="middle" fill="#222">Transition state ‡</text>
<text x="140" y="285" text-anchor="middle" fill="#666" font-size="12">trigonal bipyramid, planar CR₃</text>
<text x="140" y="302" text-anchor="middle" fill="#666" font-size="12">5-coordinate, Nu and X collinear</text>
</g>
<!-- product -->
<g transform="translate(340,0)">
<text x="150" y="150" fill="#1b6ca8" font-weight="bold" font-size="16" text-anchor="end">Nu</text>
<line x1="158" y1="146" x2="215" y2="150" stroke="#222" stroke-width="2.5"/>
<text x="217" y="160" font-size="18" font-weight="bold" fill="#222">C</text>
<line x1="226" y1="140" x2="205" y2="100" stroke="#222" stroke-width="2.5"/>
<line x1="232" y1="142" x2="255" y2="98" stroke="#222" stroke-width="2.5"/>
<path d="M232,168 L262,198 L240,204 z" fill="#222"/>
<text x="192" y="96" fill="#555">R</text><text x="257" y="92" fill="#555">R</text><text x="268" y="216" fill="#555">R</text>
<text x="300" y="165" fill="#27ae60" font-weight="bold" font-size="16">X</text><text x="316" y="157" fill="#27ae60" font-weight="bold" font-size="14">−</text>
<text x="215" y="265" text-anchor="middle" fill="#222">Product</text>
<text x="215" y="285" text-anchor="middle" fill="#666" font-size="12">configuration inverted</text>
</g>
<text x="340" y="345" text-anchor="middle" font-size="13" fill="#222">The three R groups flip like an umbrella in the wind (Walden inversion).</text>
<text x="340" y="368" text-anchor="middle" font-size="13" fill="#222">Rate = k[RX][Nu]: both partners are in the single transition state.</text>
</svg>