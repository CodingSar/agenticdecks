<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Helvetica,Arial,sans-serif" font-size="14">
<rect width="600" height="400" fill="#fff"/>
<path d="M60 350 V30 M60 350 H580" stroke="#222" stroke-width="2" fill="none"/>
<path d="M60 30 l-5 10 h10z M580 350 l-10 -5 v10z" fill="#222"/>
<text x="14" y="24" fill="#222">Energy</text><text x="420" y="378" fill="#222">Reaction coordinate</text>
<!-- reactant -->
<path d="M70 200 H150" stroke="#222" stroke-width="3"/><text x="78" y="222" fill="#222">Reactant</text>
<!-- kinetic path -->
<path d="M150 200 C190 200 195 130 235 130 C275 130 280 250 320 250" stroke="#c62828" stroke-width="3" fill="none"/>
<path d="M320 250 H380" stroke="#c62828" stroke-width="3"/>
<text x="190" y="120" fill="#c62828">TS (low barrier)</text>
<text x="322" y="242" fill="#c62828">Kinetic product</text>
<!-- thermodynamic path -->
<path d="M150 200 C220 200 240 60 300 60 C360 60 390 310 440 310" stroke="#1565c0" stroke-width="3" fill="none"/>
<path d="M440 310 H510" stroke="#1565c0" stroke-width="3"/>
<text x="310" y="52" fill="#1565c0">TS (high barrier)</text>
<text x="440" y="332" fill="#1565c0">Thermodynamic</text><text x="452" y="348" fill="#1565c0" font-size="12"> product (more stable)</text>
<path d="M235 200 V130" stroke="#c62828" stroke-dasharray="3 3"/><text x="240" y="170" font-size="12" fill="#c62828">Ea fast</text>
<path d="M300 200 V60" stroke="#1565c0" stroke-dasharray="3 3"/><text x="306" y="110" font-size="12" fill="#1565c0">Ea slow</text>
<text x="70" y="60" font-size="13" fill="#222">Low T, short time: kinetic wins</text>
<text x="70" y="78" font-size="13" fill="#222">High T, reversible: thermodynamic wins</text>
</svg>
