<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="Helvetica,Arial,sans-serif">
<rect width="640" height="340" fill="#fff"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">Untrusted vs trusted pipeline stages</text>
<rect x="20" y="60" width="290" height="230" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="165" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a2d2d">UNTRUSTED: runs contributor code</text>
<g font-size="13" fill="#1f2328">
<text x="40" y="115">• lint, unit tests, build</text>
<text x="40" y="140">• fork pull requests</text>
<text x="40" y="165">• dependency install scripts</text>
<text x="40" y="200" font-weight="bold" fill="#8a2d2d">No secrets. No deploy rights.</text>
<text x="40" y="222" fill="#8a2d2d">Ephemeral runner, egress allow-list,</text>
<text x="40" y="240" fill="#8a2d2d">read-only token, own cache scope.</text>
</g>
<rect x="330" y="60" width="290" height="230" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/>
<text x="475" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d6a2d">TRUSTED: consumes artifacts only</text>
<g font-size="13" fill="#1f2328">
<text x="350" y="115">• sign + attest provenance</text>
<text x="350" y="140">• push to production registry</text>
<text x="350" y="165">• deploy (commit to GitOps repo)</text>
<text x="350" y="200" font-weight="bold" fill="#2d6a2d">Never executes contributor code.</text>
<text x="350" y="222" fill="#2d6a2d">OIDC job identity, environment-scoped</text>
<text x="350" y="240" fill="#2d6a2d">secrets, approval gate, separate runner.</text>
</g>
<path d="M310 175h20" stroke="#1f2328" stroke-width="3" fill="none" marker-end="url(#b)"/>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2328"/></marker></defs>
<text x="320" y="165" text-anchor="middle" font-size="11" fill="#1f2328">artifact</text>
<text x="320" y="194" text-anchor="middle" font-size="11" fill="#1f2328">by digest</text>
<text x="320" y="320" text-anchor="middle" font-size="13" fill="#1f2328">Crossing the boundary with code instead of an artifact = poisoned pipeline execution</text>
</svg>
