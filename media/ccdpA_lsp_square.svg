<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
<rect width="600" height="400" fill="#fff"/>
<text x="300" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Liskov: the caller's expectation is the contract</text>
<rect x="20" y="50" width="560" height="62" fill="#f3f4f6" stroke="#222"/>
<text x="35" y="72" font-family="Courier New, monospace" font-size="13" fill="#222">void resize(Rectangle r) {</text>
<text x="35" y="88" font-family="Courier New, monospace" font-size="13" fill="#222">  r.setWidth(5); r.setHeight(4);</text>
<text x="35" y="104" font-family="Courier New, monospace" font-size="13" fill="#222">  assert r.area() == 20; }</text>
<text x="150" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">Rectangle passed in</text>
<text x="450" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">Square passed in</text>
<rect x="75" y="165" width="150" height="120" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="150" y="160" text-anchor="middle" font-size="12" fill="#333">width 5</text><text x="232" y="230" font-size="12" fill="#333">height 4</text>
<text x="150" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">area 20</text>
<rect x="390" y="165" width="120" height="120" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="450" y="160" text-anchor="middle" font-size="12" fill="#333">setHeight(4) also sets width</text>
<text x="450" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">area 16</text>
<text x="300" y="325" text-anchor="middle" font-size="13" fill="#222">Square IS-A rectangle in geometry, but a <tspan font-weight="bold">mutable</tspan> Square breaks</text>
<text x="300" y="345" text-anchor="middle" font-size="13" fill="#222">Rectangle's promise "setHeight leaves width alone".</text>
<text x="300" y="375" text-anchor="middle" font-size="12" fill="#555">Fix: immutable shapes, or no subtype relation.</text>
</svg>
