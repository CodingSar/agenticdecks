<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
<rect width="600" height="400" fill="#fff"/>
<defs><marker id="tri" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L10,6 L0,12 z" fill="#fff" stroke="#222"/></marker>
<marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#222"/></marker></defs>
<text x="300" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Abstract Factory: one factory per product family</text>
<rect x="230" y="42" width="140" height="30" fill="#f3f4f6" stroke="#222"/><text x="300" y="62" text-anchor="middle" font-size="13" fill="#222">Client</text>
<line x1="300" y1="72" x2="300" y2="96" stroke="#222" marker-end="url(#arr)"/>
<rect x="190" y="98" width="220" height="52" fill="#fef9c3" stroke="#222"/>
<text x="300" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">GUIFactory «interface»</text>
<text x="300" y="134" text-anchor="middle" font-size="11" fill="#333">createButton()</text>
<text x="300" y="146" text-anchor="middle" font-size="11" fill="#333">createCheckbox()</text>
<line x1="150" y1="196" x2="250" y2="152" stroke="#222" marker-end="url(#tri)"/>
<line x1="450" y1="196" x2="350" y2="152" stroke="#222" marker-end="url(#tri)"/>
<rect x="30" y="178" width="250" height="180" fill="none" stroke="#1d4ed8" stroke-dasharray="5 4"/>
<text x="155" y="374" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="bold">macOS family</text>
<rect x="80" y="196" width="150" height="30" fill="#dbeafe" stroke="#1d4ed8"/><text x="155" y="216" text-anchor="middle" font-size="13" fill="#222">MacFactory</text>
<rect x="45" y="290" width="105" height="30" fill="#dbeafe" stroke="#1d4ed8"/><text x="97" y="310" text-anchor="middle" font-size="12" fill="#222">MacButton</text>
<rect x="160" y="290" width="110" height="30" fill="#dbeafe" stroke="#1d4ed8"/><text x="215" y="310" text-anchor="middle" font-size="12" fill="#222">MacCheckbox</text>
<g stroke="#1d4ed8" stroke-dasharray="3 3"><line x1="140" y1="226" x2="100" y2="288" marker-end="url(#arr)"/><line x1="170" y1="226" x2="212" y2="288" marker-end="url(#arr)"/></g>
<text x="155" y="262" text-anchor="middle" font-size="10" fill="#1d4ed8">creates</text>
<rect x="320" y="178" width="250" height="180" fill="none" stroke="#15803d" stroke-dasharray="5 4"/>
<text x="445" y="374" text-anchor="middle" font-size="12" fill="#15803d" font-weight="bold">Windows family</text>
<rect x="370" y="196" width="150" height="30" fill="#dcfce7" stroke="#15803d"/><text x="445" y="216" text-anchor="middle" font-size="13" fill="#222">WinFactory</text>
<rect x="335" y="290" width="105" height="30" fill="#dcfce7" stroke="#15803d"/><text x="387" y="310" text-anchor="middle" font-size="12" fill="#222">WinButton</text>
<rect x="450" y="290" width="110" height="30" fill="#dcfce7" stroke="#15803d"/><text x="505" y="310" text-anchor="middle" font-size="12" fill="#222">WinCheckbox</text>
<g stroke="#15803d" stroke-dasharray="3 3"><line x1="430" y1="226" x2="390" y2="288" marker-end="url(#arr)"/><line x1="460" y1="226" x2="502" y2="288" marker-end="url(#arr)"/></g>
<text x="445" y="262" text-anchor="middle" font-size="10" fill="#15803d">creates</text>
<text x="300" y="394" text-anchor="middle" font-size="12" fill="#333">Swap the one factory object → every product changes together, never mixed.</text>
</svg>
