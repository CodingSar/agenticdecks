<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="600" height="400" rx="14" fill="#fbfbf8"/>
<text x="30" y="32" fill="#1f2937" font-size="16" text-anchor="start" font-weight="700">Round arch (Romanesque) vs pointed arch (Gothic)</text>
<path d="M80,285 A80,80 0 0 1 240,285 L218,285 A58,58 0 0 0 102,285 Z" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.8"/>
<rect x="80" y="285" width="22" height="55" fill="#d1d5db" stroke="#1f2937" stroke-width="1.5"/>
<line x1="91.0" y1="270.0" x2="30.0" y2="297.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar)" opacity="1"/>
<rect x="218" y="285" width="22" height="55" fill="#d1d5db" stroke="#1f2937" stroke-width="1.5"/>
<line x1="229.0" y1="270.0" x2="290.0" y2="297.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar)" opacity="1"/>
<text x="160" y="366" fill="#1f2937" font-size="12.5" text-anchor="middle" font-weight="700">round: height fixed at half the span</text>
<text x="160" y="384" fill="#1f2937" font-size="12" text-anchor="middle">thrust pushes sideways</text>
<path d="M360,285 A160,160 0 0 1 440,146.4 A160,160 0 0 1 520,285 L498,285 A116,116 0 0 0 440,184.5 A116,116 0 0 0 382,285 Z" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.8"/>
<rect x="360" y="285" width="22" height="55" fill="#d1d5db" stroke="#1f2937" stroke-width="1.5"/>
<line x1="371.0" y1="270.0" x2="344.0" y2="330.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar)" opacity="1"/>
<rect x="498" y="285" width="22" height="55" fill="#d1d5db" stroke="#1f2937" stroke-width="1.5"/>
<line x1="509.0" y1="270.0" x2="536.0" y2="330.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ar)" opacity="1"/>
<text x="440" y="366" fill="#1f2937" font-size="12.5" text-anchor="middle" font-weight="700">pointed: any height over any span</text>
<text x="440" y="384" fill="#1f2937" font-size="12" text-anchor="middle">thrust steeper, more downward</text>
<text x="30" y="62" fill="#1f2937" font-size="12.5" text-anchor="start">Round arches need thick walls to absorb sideways thrust (small windows).</text>
<text x="30" y="80" fill="#1f2937" font-size="12.5" text-anchor="start">Pointed arches let bays of different widths share one vault height.</text>
</svg>
