<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect width="600" height="400" fill="white"/>
<text x="300" y="24" font-size="15" text-anchor="middle" font-weight="bold">JAX / XLA: from Python function to accelerator binary</text>
<g stroke="#1f2937" stroke-width="2">
<rect x="30" y="50" width="160" height="56" rx="8" fill="#dbeafe"/>
<rect x="220" y="50" width="160" height="56" rx="8" fill="#dbeafe"/>
<rect x="410" y="50" width="160" height="56" rx="8" fill="#fde68a"/>
<rect x="410" y="150" width="160" height="70" rx="8" fill="#fde68a"/>
<rect x="220" y="150" width="160" height="70" rx="8" fill="#fde68a"/>
<rect x="30" y="150" width="160" height="70" rx="8" fill="#fde68a"/>
<rect x="30" y="260" width="160" height="56" rx="8" fill="#d1fae5"/>
<rect x="220" y="260" width="160" height="56" rx="8" fill="#d1fae5"/>
<rect x="410" y="260" width="160" height="56" rx="8" fill="#d1fae5"/>
</g>
<g text-anchor="middle">
<text x="110" y="72" font-weight="bold">Python + jax.jit</text><text x="110" y="90" font-size="11">runs once with tracers</text>
<text x="300" y="72" font-weight="bold">jaxpr</text><text x="300" y="90" font-size="11">shapes + dtypes, no values</text>
<text x="490" y="72" font-weight="bold">HLO (StableHLO)</text><text x="490" y="90" font-size="11">graph of tensor ops</text>
<text x="490" y="174" font-weight="bold">simplify</text><text x="490" y="192" font-size="11">algebra, CSE, DCE,</text><text x="490" y="207" font-size="11">layout assignment</text>
<text x="300" y="174" font-weight="bold">fusion</text><text x="300" y="192" font-size="11">elementwise chains glued</text><text x="300" y="207" font-size="11">to producers/consumers</text>
<text x="110" y="174" font-weight="bold">tiling + buffers</text><text x="110" y="192" font-size="11">tiles fit SRAM / vregs;</text><text x="110" y="207" font-size="11">static buffer assignment</text>
<text x="110" y="282" font-weight="bold">TPU backend</text><text x="110" y="300" font-size="11">MXU / VPU code</text>
<text x="300" y="282" font-weight="bold">GPU backend</text><text x="300" y="300" font-size="11">LLVM/Triton → PTX → SASS</text>
<text x="490" y="282" font-weight="bold">CPU backend</text><text x="490" y="300" font-size="11">LLVM → AVX / NEON</text>
</g>
<g stroke="#1f2937" stroke-width="2" marker-end="url(#ar)" fill="none">
<line x1="190" y1="78" x2="216" y2="78"/><line x1="380" y1="78" x2="406" y2="78"/>
<line x1="490" y1="106" x2="490" y2="146"/>
<line x1="410" y1="185" x2="384" y2="185"/><line x1="220" y1="185" x2="194" y2="185"/>
<path d="M110,220 L110,240 L300,240 L300,256"/>
<line x1="110" y1="240" x2="110" y2="256"/><line x1="300" y1="240" x2="490" y2="240"/><line x1="490" y1="240" x2="490" y2="256"/>
</g>
<text x="300" y="350" text-anchor="middle" font-size="11" fill="#4b5563">one static-shape program → one compiled executable; a new shape ⇒ retrace + recompile</text>
<text x="300" y="372" text-anchor="middle" font-size="11" fill="#4b5563">blue = front end (tracing) · yellow = target-independent + target-aware passes · green = codegen</text>
</svg>
