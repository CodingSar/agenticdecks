" fill="none"/><circle cx="300.0" cy="210.0" r="7" stroke="#dc2626" stroke-width="2" fill="#dc2626"/><line x1="310.0" y1="210.0" x2="360.0" y2="210.0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#mdc2626)"/><text x="470.0" y="150.0" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="bold" >ahead: bunched</text><text x="470.0" y="170.0" fill="#1f2937" font-size="13" text-anchor="middle" font-weight="normal" >shorter λ, higher f</text><text x="95.0" y="320.0" fill="#1f2937" font-size="14" text-anchor="middle" font-weight="bold" >behind: stretched</text><text x="95.0" y="340.0" fill="#1f2937" font-size="13" text-anchor="middle" font-weight="normal" >longer λ, lower f</text><text x="300.0" y="385.0" fill="#1f2937" font-size="13" text-anchor="middle" font-weight="normal" >f' = f · (v ± v_obs)/(v -/+ v_src) for sound; redshift z = Δλ/λ for light</text></svg>