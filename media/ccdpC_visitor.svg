<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937"><title>Visitor grid and double dispatch</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="640" height="380" fill="#ffffff"/><text x="320" y="28" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="bold">Visitor: operations are columns, element types are rows</text><rect x="150" y="60" width="114" height="40" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="207.0" y="84.55" text-anchor="middle" font-size="13" font-weight="bold">TypeCheck</text><rect x="270" y="60" width="114" height="40" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="327.0" y="84.55" text-anchor="middle" font-size="13" font-weight="bold">PrettyPrint</text><rect x="390" y="60" width="114" height="40" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="447.0" y="84.55" text-anchor="middle" font-size="13" font-weight="bold">CodeGen</text><rect x="510" y="60" width="114" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="567.0" y="84.55" text-anchor="middle" font-size="13" font-weight="bold">+ Optimise</text><rect x="20" y="106" width="120" height="42" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="80.0" y="131.55" text-anchor="middle" font-size="13" font-weight="bold">Number</text><rect x="150" y="106" width="114" height="42" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="207.0" y="132" text-anchor="middle" font-size="11" fill="#1f2937">visitNumber()</text><rect x="270" y="106" width="114" height="42" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="327.0" y="132" text-anchor="middle" font-size="11" fill="#1f2937">visitNumber()</text><rect x="390" y="106" width="114" height="42" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="447.0" y="132" text-anchor="middle" font-size="11" fill="#1f2937">visitNumber()</text><rect x="510" y="106" width="114" height="42" fill="#dcfce7" stroke="#9ca3af" stroke-width="1"/><text x="567.0" y="132" text-anchor="middle" font-size="11" fill="#1f2937">visitNumber()</text><rect x="20" y="154" width="120" height="42" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="80.0" y="179.55" text-anchor="middle" font-size="13" font-weight="bold">BinaryOp</text><rect x="150" y="154" width="114" height="42" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="207.0" y="180" text-anchor="middle" font-size="11" fill="#1f2937">visitBinaryOp()</text><rect x="270" y="154" width="114" height="42" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="327.0" y="180" text-anchor="middle" font-size="11" fill="#1f2937">visitBinaryOp()</text><rect x="390" y="154" width="114" height="42" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="447.0" y="180" text-anchor="middle" font-size="11" fill="#1f2937">visitBinaryOp()</text><rect x="510" y="154" width="114" height="42" fill="#dcfce7" stroke="#9ca3af" stroke-width="1"/><text x="567.0" y="180" text-anchor="middle" font-size="11" fill="#1f2937">visitBinaryOp()</text><rect x="20" y="202" width="120" height="42" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="80.0" y="227.55" text-anchor="middle" font-size="13" font-weight="bold">Call</text><rect x="150" y="202" width="114" height="42" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="207.0" y="228" text-anchor="middle" font-size="11" fill="#1f2937">visitCall()</text><rect x="270" y="202" width="114" height="42" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="327.0" y="228" text-anchor="middle" font-size="11" fill="#1f2937">visitCall()</text><rect x="390" y="202" width="114" height="42" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="447.0" y="228" text-anchor="middle" font-size="11" fill="#1f2937">visitCall()</text><rect x="510" y="202" width="114" height="42" fill="#dcfce7" stroke="#9ca3af" stroke-width="1"/><text x="567.0" y="228" text-anchor="middle" font-size="11" fill="#1f2937">visitCall()</text><rect x="20" y="250" width="120" height="42" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="80.0" y="275.55" text-anchor="middle" font-size="13" font-weight="bold">+ Lambda</text><rect x="150" y="250" width="114" height="42" fill="#fee2e2" stroke="#9ca3af" stroke-width="1"/><text x="207.0" y="276" text-anchor="middle" font-size="11" fill="#1f2937">visitLambda()</text><rect x="270" y="250" width="114" height="42" fill="#fee2e2" stroke="#9ca3af" stroke-width="1"/><text x="327.0" y="276" text-anchor="middle" font-size="11" fill="#1f2937">visitLambda()</text><rect x="390" y="250" width="114" height="42" fill="#fee2e2" stroke="#9ca3af" stroke-width="1"/><text x="447.0" y="276" text-anchor="middle" font-size="11" fill="#1f2937">visitLambda()</text><rect x="510" y="250" width="114" height="42" fill="#fee2e2" stroke="#9ca3af" stroke-width="1"/><text x="567.0" y="276" text-anchor="middle" font-size="11" fill="#1f2937">visitLambda()</text><text x="510" y="330" text-anchor="end" font-size="13" fill="#15803d" font-weight="bold">New operation: one new class (cheap)</text><text x="20" y="330" text-anchor="start" font-size="13" fill="#b91c1c" font-weight="bold">New element type: edit every visitor</text><text x="320" y="362" text-anchor="middle" font-size="13" fill="#1f2937">Double dispatch: node.accept(v) picks the row, v.visitX(this) picks the cell.</text></svg>