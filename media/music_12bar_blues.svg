<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="Helvetica, Arial, sans-serif"><rect x="0" y="0" width="600" height="380" rx="12" fill="#ffffff"/><text x="300" y="26" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold" >12-bar blues (basic form)</text><rect x="60" y="70" width="115" height="60" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="117" y="108" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" >I</text><text x="68" y="84" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" >1</text><rect x="185" y="70" width="115" height="60" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="242" y="108" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" >I</text><text x="193" y="84" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" >2</text><rect x="310" y="70" width="115" height="60" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="367" y="108" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" >I</text><text x="318" y="84" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" >3</text><rect x="435" y="70" width="115" height="60" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="492" y="108" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" >I</text><text x="443" y="84" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" >4</text><rect x="60" y="150" width="115" height="60" rx="6" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/><text x="117" y="188" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" >IV</text><text x="68" y="164" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" >5</text><rect x="185" y="150" width="115" height="60" rx="6" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/><text x="242" y="188" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" >IV</text><text x="193" y="164" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" >6</text><rect x="310" y="150" width="115" height="60" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="367" y="188" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" >I</text><text x="318" y="164" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" >7</text><rect x="435" y="150" width="115" height="60" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="492" y="188" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" >I</text><text x="443" y="164" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" >8</text><rect x="60" y="230" width="115" height="60" rx="6" fill="#fee2e2" stroke="#1f2937" stroke-width="2"/><text x="117" y="268" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" >V</text><text x="68" y="244" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" >9</text><rect x="185" y="230" width="115" height="60" rx="6" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/><text x="242" y="268" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" >IV</text><text x="193" y="244" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" >10</text><rect x="310" y="230" width="115" height="60" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="367" y="268" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" >I</text><text x="318" y="244" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" >11</text><rect x="435" y="230" width="115" height="60" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="492" y="268" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" >I</text><text x="443" y="244" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" >12</text><text x="590" y="105" font-size="12" fill="#1f2937" text-anchor="end" font-weight="normal" >A: statement</text><text x="590" y="185" font-size="12" fill="#1f2937" text-anchor="end" font-weight="normal" >A: repeat</text><text x="590" y="265" font-size="12" fill="#1f2937" text-anchor="end" font-weight="normal" >B: answer</text><text x="300" y="340" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >Lyric form AAB: line 1, line 1 again, rhyming answer. Bar 12 often V (turnaround).</text><text x="300" y="362" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" >I = home, IV = away, V = tension home. Chords often played as dominant 7ths; melody uses blue notes.</text></svg>