<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
<rect width="600" height="400" fill="#fff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="300" y="28" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">Stocks and flows (Meadows), applied to delivery</text>
<!-- cloud sources -->
<ellipse cx="60" cy="170" rx="35" ry="22" fill="#f3f4f6" stroke="#9ca3af"/>
<ellipse cx="540" cy="170" rx="35" ry="22" fill="#f3f4f6" stroke="#9ca3af"/>
<!-- stock -->
<rect x="200" y="120" width="200" height="100" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/>
<text x="300" y="160" text-anchor="middle" font-size="15" fill="#1e3a8a" font-weight="bold">STOCK</text>
<text x="300" y="182" text-anchor="middle" font-size="13" fill="#1e3a8a">work in progress</text>
<text x="300" y="200" text-anchor="middle" font-size="12" fill="#1e3a8a">(a level you can count)</text>
<!-- flows -->
<line x1="95" y1="170" x2="195" y2="170" stroke="#333" stroke-width="4" marker-end="url(#a)"/>
<line x1="400" y1="170" x2="500" y2="170" stroke="#333" stroke-width="4" marker-end="url(#a)"/>
<!-- valves -->
<polygon points="135,155 155,170 135,185 115,170" fill="#fff" stroke="#333" stroke-width="2"/>
<polygon points="465,155 485,170 465,185 445,170" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="135" y="140" text-anchor="middle" font-size="12" fill="#333">inflow: work started</text>
<text x="465" y="140" text-anchor="middle" font-size="12" fill="#333">outflow: work deployed</text>
<text x="135" y="210" text-anchor="middle" font-size="11" fill="#555">(a rate per week)</text>
<text x="465" y="210" text-anchor="middle" font-size="11" fill="#555">(a rate per week)</text>
<!-- feedback -->
<path d="M300,220 C300,280 120,280 135,190" stroke="#b45309" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="215" y="285" text-anchor="middle" font-size="12" fill="#b45309">balancing loop: WIP limit closes the inflow valve</text>
<text x="300" y="330" text-anchor="middle" font-size="13" fill="#222">A stock changes only through its flows, so it lags and buffers.</text>
<text x="300" y="350" text-anchor="middle" font-size="13" fill="#222">Lead time ≈ stock ÷ outflow (Little's law): cut WIP or raise the deploy rate.</text>
<text x="300" y="385" text-anchor="middle" font-size="12" fill="#555">Boxes = stocks, valves = flows, clouds = outside the model's boundary.</text>
</svg>
