<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
<rect width="600" height="400" fill="#fff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="300" y="28" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">The Dependency Rule (Clean Architecture)</text>
<g stroke-width="2">
<circle cx="220" cy="215" r="165" fill="#dbeafe" stroke="#1e3a8a"/>
<circle cx="220" cy="215" r="125" fill="#bfdbfe" stroke="#1e3a8a"/>
<circle cx="220" cy="215" r="85" fill="#93c5fd" stroke="#1e3a8a"/>
<circle cx="220" cy="215" r="45" fill="#fde68a" stroke="#92400e"/>
</g>
<g font-size="12" fill="#1e293b" text-anchor="middle">
<text x="220" y="212" font-weight="bold">Entities</text><text x="220" y="227" font-size="10">enterprise rules</text>
<text x="220" y="150" font-weight="bold">Use cases</text>
<text x="220" y="110" font-weight="bold">Interface adapters</text><text x="220" y="124" font-size="10">controllers, presenters, gateways</text>
<text x="220" y="70" font-weight="bold">Frameworks &amp; drivers</text><text x="220" y="84" font-size="10">web, DB, UI, devices</text>
</g>
<!-- inward arrows -->
<g stroke="#333" stroke-width="2.5" marker-end="url(#a)">
<line x1="60" y1="330" x2="150" y2="265"/>
<line x1="385" y1="330" x2="292" y2="265"/>
</g>
<text x="425" y="150" font-size="12" fill="#222" font-weight="bold">Source-code dependencies</text>
<text x="425" y="168" font-size="12" fill="#222" font-weight="bold">point inward only.</text>
<text x="425" y="200" font-size="11.5" fill="#333">Inner rings know nothing of</text>
<text x="425" y="216" font-size="11.5" fill="#333">outer ones: no DB, web or</text>
<text x="425" y="232" font-size="11.5" fill="#333">framework names inside.</text>
<text x="425" y="264" font-size="11.5" fill="#b45309">Control flows outward?</text>
<text x="425" y="280" font-size="11.5" fill="#b45309">Invert it with an interface</text>
<text x="425" y="296" font-size="11.5" fill="#b45309">owned by the inner ring (DIP).</text>
<text x="425" y="330" font-size="11" fill="#555">"The database is a detail."</text>
<text x="425" y="346" font-size="11" fill="#555">(Critics: data outlives apps.)</text>
</svg>
