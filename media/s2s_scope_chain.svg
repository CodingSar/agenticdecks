<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="600" height="400" fill="white"/>
<text x="300" y="26" font-size="15" font-weight="bold" text-anchor="middle">Closure: a function plus the environment it was created in</text>
<g font-family="Menlo, Consolas, monospace" font-size="12">
<text x="20" y="60">function counter() {</text>
<text x="20" y="78">  let n = 0;               // local of counter</text>
<text x="20" y="96">  return () =&gt; ++n;        // captures n (an upvalue)</text>
<text x="20" y="114">}</text>
<text x="20" y="132">const c = counter();       // counter's frame is gone...</text>
<text x="20" y="150">c(); c();                  // ...but n lives on: 1, 2</text>
</g>
<!-- scope chain boxes -->
<g stroke="#1f2937" stroke-width="2" fill="#f3f4f6">
<rect x="40" y="200" width="150" height="60" rx="6"/>
<rect x="230" y="200" width="150" height="60" rx="6" fill="#dbeafe"/>
<rect x="420" y="200" width="150" height="60" rx="6" fill="#fee2e2"/>
</g>
<g text-anchor="middle" font-size="12">
<text x="115" y="222" font-weight="bold">global env</text><text x="115" y="242">counter, c</text>
<text x="305" y="222" font-weight="bold">counter's env</text><text x="305" y="242">n = 2  (heap, closed)</text>
<text x="495" y="222" font-weight="bold">closure c</text><text x="495" y="242">code + env pointer</text>
</g>
<g stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M420,230 L385,230"/>
<path d="M230,230 L195,230"/>
</g>
<text x="300" y="285" text-anchor="middle" font-size="12" fill="#dc2626">lookup of n: innermost env first, then follow the parent pointers outward</text>
<g font-size="12">
<text x="20" y="320" font-weight="bold">Lexical scope:</text><text x="130" y="320" font-size="12">parent env = where the code was WRITTEN; resolved at compile time to a slot index.</text>
<text x="20" y="342" font-weight="bold">Dynamic scope:</text><text x="130" y="342" font-size="12">parent env = whoever CALLED c at run time; the result would depend on the caller.</text>
<text x="20" y="372" font-size="11" fill="#6b7280">Lua: an upvalue is "open" while n is on the stack, "closed" (copied to the heap) once counter returns.</text>
</g>
</svg>
