<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937"><title>State machine with state objects</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="640" height="400" fill="#ffffff"/><text x="320" y="28" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="bold">State: order lifecycle, one object per state</text><rect x="30" y="70" width="150" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="105.0" y="100.25" text-anchor="middle" font-size="15" font-weight="bold">Pending</text><rect x="230" y="70" width="150" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="305.0" y="100.25" text-anchor="middle" font-size="15" font-weight="bold">Paid</text><rect x="430" y="70" width="150" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="505.0" y="100.25" text-anchor="middle" font-size="15" font-weight="bold">Shipped</text><rect x="130" y="200" width="150" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="205.0" y="230.25" text-anchor="middle" font-size="15" font-weight="bold">Cancelled</text><rect x="430" y="200" width="150" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="505.0" y="230.25" text-anchor="middle" font-size="15" font-weight="bold">Delivered</text><line x1="180" y1="95" x2="228" y2="95" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="204" y="87" text-anchor="middle" font-size="11" fill="#1f2937" font-style="italic">pay()</text><line x1="380" y1="95" x2="428" y2="95" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="404" y="87" text-anchor="middle" font-size="11" fill="#1f2937" font-style="italic">ship()</text><line x1="505" y1="120" x2="505" y2="198" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="512" y="165" text-anchor="start" font-size="11" fill="#1f2937" font-style="italic">deliver()</text><line x1="105" y1="120" x2="175" y2="198" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="110" y="170" text-anchor="end" font-size="11" fill="#1f2937" font-style="italic">cancel()</text><line x1="290" y1="120" x2="245" y2="198" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="282" y="165" text-anchor="start" font-size="11" fill="#1f2937" font-style="italic">cancel() + refund</text><rect x="30" y="290" width="230" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="145.0" y="312.55" text-anchor="middle" font-size="13" font-weight="bold">Order (context)</text><text x="145.0" y="329.55" text-anchor="middle" font-size="13">state: OrderState</text><text x="145.0" y="346.55" text-anchor="middle" font-size="13">ship() → state.ship(this)</text><rect x="330" y="290" width="280" height="70" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="470.0" y="312.55" text-anchor="middle" font-size="13" font-weight="bold">«interface» OrderState</text><text x="470.0" y="329.55" text-anchor="middle" font-size="13">pay() ship() cancel()</text><text x="470.0" y="346.55" text-anchor="middle" font-size="13">each state answers differently</text><line x1="262" y1="325" x2="328" y2="325" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="296" y="317" text-anchor="middle" font-size="11" fill="#1f2937" font-style="italic">delegates</text><text x="320" y="388" text-anchor="middle" font-size="13" fill="#1f2937">ship() on Pending throws; on Paid it moves to Shipped. No switch(status).</text></svg>