<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="Helvetica, Arial, sans-serif"><rect x="0" y="0" width="600" height="380" rx="12" fill="#ffffff"/><text x="300" y="26" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold" >Fugue exposition (3 voices)</text><text x="70" y="95" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" >Soprano</text><line x1="80" y1="90" x2="580" y2="90" stroke="#9ca3af" stroke-width="1"/><text x="70" y="165" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" >Alto</text><line x1="80" y1="160" x2="580" y2="160" stroke="#9ca3af" stroke-width="1"/><text x="70" y="235" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" >Bass</text><line x1="80" y1="230" x2="580" y2="230" stroke="#9ca3af" stroke-width="1"/><rect x="85" y="74" width="110" height="32" rx="4" fill="#2563eb" stroke="#1f2937" stroke-width="1.5"/><text x="140.0" y="95" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold" >SUBJECT (I)</text><rect x="200" y="74" width="110" height="32" rx="4" fill="#059669" stroke="#1f2937" stroke-width="1.5"/><text x="255.0" y="95" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold" >countersubject</text><rect x="315" y="74" width="110" height="32" rx="4" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/><text x="370" y="95" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" >free</text><rect x="200" y="144" width="110" height="32" rx="4" fill="#dc2626" stroke="#1f2937" stroke-width="1.5"/><text x="255.0" y="165" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold" >ANSWER (V)</text><rect x="315" y="144" width="110" height="32" rx="4" fill="#059669" stroke="#1f2937" stroke-width="1.5"/><text x="370.0" y="165" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold" >countersubject</text><rect x="315" y="214" width="110" height="32" rx="4" fill="#2563eb" stroke="#1f2937" stroke-width="1.5"/><text x="370.0" y="235" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold" >SUBJECT (I)</text><rect x="430" y="74" width="150" height="32" rx="4" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/><text x="505" y="95" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" >episode</text><rect x="430" y="144" width="150" height="32" rx="4" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/><text x="505" y="165" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" >episode</text><rect x="430" y="214" width="150" height="32" rx="4" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/><text x="505" y="235" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="normal" >episode → new entries…</text><text x="300" y="300" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >Each voice enters alone with the subject; the second voice gives the answer a fifth higher.</text><text x="300" y="320" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >After all voices have entered, episodes (no subject) alternate with re-entries in new keys.</text><text x="300" y="350" font-size="12" fill="#9ca3af" text-anchor="middle" font-weight="normal" >Devices: inversion, augmentation, stretto (overlapping entries), pedal point before the end</text></svg>