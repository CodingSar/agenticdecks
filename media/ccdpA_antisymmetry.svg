<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
<rect width="600" height="400" fill="#fff"/>
<text x="300" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Data/object anti-symmetry: what is cheap to add?</text>
<text x="350" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">add a new function</text><text x="350" y="86" text-anchor="middle" font-size="11" fill="#555">e.g. perimeter()</text>
<text x="510" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">add a new type</text><text x="510" y="86" text-anchor="middle" font-size="11" fill="#555">e.g. Hexagon</text>
<text x="20" y="140" font-size="14" font-weight="bold" fill="#222">Procedural</text><text x="20" y="158" font-size="11" fill="#333">data structures +</text><text x="20" y="172" font-size="11" fill="#333">Geometry.area(shape)</text><text x="20" y="186" font-size="11" fill="#333">switch on type</text>
<text x="20" y="270" font-size="14" font-weight="bold" fill="#222">Object-oriented</text><text x="20" y="288" font-size="11" fill="#333">shape.area() on each</text><text x="20" y="302" font-size="11" fill="#333">Square, Circle, ...</text>
<rect x="270" y="105" width="160" height="110" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="350" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">cheap</text><text x="350" y="172" text-anchor="middle" font-size="11" fill="#333">one new function,</text><text x="350" y="186" text-anchor="middle" font-size="11" fill="#333">shapes untouched</text>
<rect x="430" y="105" width="160" height="110" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="510" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">costly</text><text x="510" y="172" text-anchor="middle" font-size="11" fill="#333">edit every switch</text><text x="510" y="186" text-anchor="middle" font-size="11" fill="#333">in every function</text>
<rect x="270" y="235" width="160" height="110" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="350" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">costly</text><text x="350" y="302" text-anchor="middle" font-size="11" fill="#333">add a method to</text><text x="350" y="316" text-anchor="middle" font-size="11" fill="#333">every class</text>
<rect x="430" y="235" width="160" height="110" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="510" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">cheap</text><text x="510" y="302" text-anchor="middle" font-size="11" fill="#333">one new class,</text><text x="510" y="316" text-anchor="middle" font-size="11" fill="#333">old code untouched</text>
<text x="300" y="380" text-anchor="middle" font-size="12" fill="#222">Choose by which axis you expect to grow: operations or types.</text>
</svg>
