<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937"><title>What varies decision chart</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="640" height="390" fill="#ffffff"/><text x="320" y="28" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="bold">Reading a behavioural problem: what varies?</text><rect x="250" y="170" width="140" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="320.0" y="195.75" text-anchor="middle" font-size="15" font-weight="bold">What varies?</text><text x="320.0" y="214.75" text-anchor="middle" font-size="15">encapsulate it</text><rect x="10" y="50" width="190" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="105" y="72" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="bold">Strategy</text><text x="105" y="92" text-anchor="middle" font-size="11" fill="#1f2937">whole algorithm, picked at run time</text><line x1="250" y1="200" x2="202" y2="78" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="10" y="120" width="190" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="105" y="142" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="bold">Template Method</text><text x="105" y="162" text-anchor="middle" font-size="11" fill="#1f2937">some steps of a fixed algorithm</text><line x1="250" y1="200" x2="202" y2="148" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="10" y="190" width="190" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="105" y="212" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="bold">State</text><text x="105" y="232" text-anchor="middle" font-size="11" fill="#1f2937">behaviour as its state changes</text><line x1="250" y1="200" x2="202" y2="218" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="10" y="260" width="190" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="105" y="282" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="bold">Observer</text><text x="105" y="302" text-anchor="middle" font-size="11" fill="#1f2937">who reacts when something changes</text><line x1="250" y1="200" x2="202" y2="288" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="50" width="190" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="535" y="72" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="bold">Chain of Responsibility</text><text x="535" y="92" text-anchor="middle" font-size="11" fill="#1f2937">which object handles a request</text><line x1="390" y1="200" x2="438" y2="78" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="120" width="190" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="535" y="142" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="bold">Command</text><text x="535" y="162" text-anchor="middle" font-size="11" fill="#1f2937">queue, log or undo a request</text><line x1="390" y1="200" x2="438" y2="148" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="190" width="190" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="535" y="212" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="bold">Mediator</text><text x="535" y="232" text-anchor="middle" font-size="11" fill="#1f2937">how a web of peers interacts</text><line x1="390" y1="200" x2="438" y2="218" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="260" width="190" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="535" y="282" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="bold">Visitor</text><text x="535" y="302" text-anchor="middle" font-size="11" fill="#1f2937">operations over a stable tree</text><line x1="390" y1="200" x2="438" y2="288" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="320" y="350" text-anchor="middle" font-size="12.5" fill="#1f2937">Also: traversal → Iterator · snapshot to restore → Memento · a small grammar → Interpreter</text><text x="320" y="372" text-anchor="middle" font-size="12.5" fill="#1f2937" font-style="italic">No real variation yet? Write the plain code; extract the pattern on the second case.</text></svg>