<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937"><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="600" height="400" fill="white"/><text x="300" y="24" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">Grid → blocks → warps → SM</text><text x="110" y="52" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">grid (one kernel launch)</text><rect x="20" y="60" width="180" height="130" rx="0" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><rect x="30" y="70" width="36" height="30" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="48" y="89" font-size="10" text-anchor="middle" fill="#1f2937">B0</text><rect x="72" y="70" width="36" height="30" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="90" y="89" font-size="10" text-anchor="middle" fill="#1f2937">B1</text><rect x="114" y="70" width="36" height="30" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="132" y="89" font-size="10" text-anchor="middle" fill="#1f2937">B2</text><rect x="156" y="70" width="36" height="30" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="174" y="89" font-size="10" text-anchor="middle" fill="#1f2937">B3</text><rect x="30" y="108" width="36" height="30" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="48" y="127" font-size="10" text-anchor="middle" fill="#1f2937">B4</text><rect x="72" y="108" width="36" height="30" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="90" y="127" font-size="10" text-anchor="middle" fill="#1f2937">B5</text><rect x="114" y="108" width="36" height="30" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="132" y="127" font-size="10" text-anchor="middle" fill="#1f2937">B6</text><rect x="156" y="108" width="36" height="30" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="174" y="127" font-size="10" text-anchor="middle" fill="#1f2937">B7</text><rect x="30" y="146" width="36" height="30" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="48" y="165" font-size="10" text-anchor="middle" fill="#1f2937">B8</text><rect x="72" y="146" width="36" height="30" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="90" y="165" font-size="10" text-anchor="middle" fill="#1f2937">B9</text><rect x="114" y="146" width="36" height="30" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="132" y="165" font-size="10" text-anchor="middle" fill="#1f2937">B10</text><rect x="156" y="146" width="36" height="30" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="174" y="165" font-size="10" text-anchor="middle" fill="#1f2937">B11</text><text x="110" y="208" font-size="11" text-anchor="middle" fill="#1f2937">blocks: independent,</text><text x="110" y="222" font-size="11" text-anchor="middle" fill="#1f2937">any order, any SM</text><line x1="200" y1="110" x2="240" y2="110" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="320" y="52" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">block B5: 128 threads</text><rect x="240" y="60" width="160" height="130" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><rect x="250" y="68" width="140" height="24" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="320" y="84" font-size="10" text-anchor="middle" fill="#1f2937">warp 0: threads 0..31</text><rect x="250" y="98" width="140" height="24" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="320" y="114" font-size="10" text-anchor="middle" fill="#1f2937">warp 1: threads 32..63</text><rect x="250" y="128" width="140" height="24" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="320" y="144" font-size="10" text-anchor="middle" fill="#1f2937">warp 2: threads 64..95</text><rect x="250" y="158" width="140" height="24" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="320" y="174" font-size="10" text-anchor="middle" fill="#1f2937">warp 3: threads 96..127</text><text x="320" y="208" font-size="11" text-anchor="middle" fill="#1f2937">warps: 32 threads, one</text><text x="320" y="222" font-size="11" text-anchor="middle" fill="#1f2937">instruction in lockstep</text><line x1="400" y1="110" x2="440" y2="110" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="515" y="52" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">one SM</text><rect x="440" y="60" width="150" height="130" rx="0" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/><rect x="448" y="68" width="134" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><text x="515" y="83" font-size="10" text-anchor="middle" fill="#1f2937">4 warp schedulers</text><rect x="448" y="94" width="134" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><text x="515" y="109" font-size="10" text-anchor="middle" fill="#1f2937">register file (64K regs)</text><rect x="448" y="120" width="134" height="22" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><text x="515" y="135" font-size="10" text-anchor="middle" fill="#1f2937">shared memory / L1</text><rect x="448" y="146" width="134" height="36" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><text x="515" y="161" font-size="10" text-anchor="middle" fill="#1f2937">FP32/INT/tensor units</text><text x="515" y="175" font-size="10" text-anchor="middle" fill="#1f2937">(resident: many blocks)</text><text x="515" y="208" font-size="11" text-anchor="middle" fill="#1f2937">whole block lands on one SM</text><text x="515" y="222" font-size="11" text-anchor="middle" fill="#1f2937">(shared mem + __syncthreads)</text><text x="300" y="258" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">warp scheduler each cycle: pick any warp whose next instruction is ready</text><rect x="30" y="272" width="62" height="26" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="61" y="290" font-size="10" text-anchor="middle" fill="#1f2937">w0 ld</text><rect x="98" y="272" width="62" height="26" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="129" y="290" font-size="10" text-anchor="middle" fill="#1f2937">w1 ld</text><rect x="166" y="272" width="62" height="26" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="197" y="290" font-size="10" text-anchor="middle" fill="#1f2937">w2 fma</text><rect x="234" y="272" width="62" height="26" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="265" y="290" font-size="10" text-anchor="middle" fill="#1f2937">w3 fma</text><rect x="302" y="272" width="62" height="26" rx="0" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="333" y="290" font-size="10" text-anchor="middle" fill="#1f2937">w0 wait</text><rect x="370" y="272" width="62" height="26" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="401" y="290" font-size="10" text-anchor="middle" fill="#1f2937">w2 ld</text><rect x="438" y="272" width="62" height="26" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="469" y="290" font-size="10" text-anchor="middle" fill="#1f2937">w1 fma</text><rect x="506" y="272" width="62" height="26" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="537" y="290" font-size="10" text-anchor="middle" fill="#1f2937">w5 fma</text><line x1="30" y1="312" x2="560" y2="312" stroke="#1f2937" stroke-width="1" marker-end="url(#a)"/><text x="300" y="328" font-size="11" text-anchor="middle" fill="#1f2937">cycles →</text><text x="300" y="356" font-size="11" text-anchor="middle" fill="#4b5563">a stalled warp (memory latency) costs nothing: another resident warp issues instead.</text><text x="300" y="372" font-size="11" text-anchor="middle" fill="#4b5563">no context switch: every resident warp keeps its registers in the register file.</text></svg>