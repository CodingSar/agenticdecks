<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"><style>
text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#222}
.t{font-size:15px;font-weight:bold}.s{font-size:11px;fill:#555}
.box{fill:#f4f6fa;stroke:#333;stroke-width:1.5}
.blue{fill:#dbe8fb}.green{fill:#dcefdc}.orange{fill:#fde7cc}.red{fill:#f9d6d5}.grey{fill:#ececec}
.ln{stroke:#333;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="600" height="400" fill="#fff"/><text class="t" x="20" y="30">SP-initiated</text><rect class="box grey" x="20" y="50" width="100" height="40" rx="6"/><text class="t" x="70.0" y="75.0" text-anchor="middle">Browser</text><rect class="box blue" x="160" y="50" width="100" height="40" rx="6"/><text class="t" x="210.0" y="75.0" text-anchor="middle">SP</text><rect class="box orange" x="300" y="50" width="100" height="40" rx="6"/><text class="t" x="350.0" y="75.0" text-anchor="middle">IdP</text><path class="ln dash" d="M70,90 L70,300"/><path class="ln dash" d="M210,90 L210,300"/><path class="ln dash" d="M350,90 L350,300"/><path class="ln" d="M70,115 L200,115" marker-end="url(#a)"/><rect x="99" y="96.0" width="72" height="17" fill="#fff"/><text class="" x="135.0" y="109.0" text-anchor="middle">1 GET /app</text><path class="ln" d="M200,145 L80,145" marker-end="url(#a)"/><rect x="104" y="126.0" width="72" height="17" fill="#fff"/><text class="" x="140.0" y="139.0" text-anchor="middle">2 redirect</text><path class="ln" d="M80,175 L340,175" marker-end="url(#a)"/><rect x="161" y="156.0" width="98" height="17" fill="#fff"/><text class="" x="210.0" y="169.0" text-anchor="middle">3 AuthnRequest</text><rect x="327" y="189" width="45" height="15" fill="#fff"/><text class="s" x="350" y="200" text-anchor="middle">4 login</text><path class="ln" d="M340,225 L80,225" marker-end="url(#a)"/><rect x="134" y="206.0" width="151" height="17" fill="#fff"/><text class="" x="210.0" y="219.0" text-anchor="middle">5 Response + Assertion</text><path class="ln" d="M80,255 L200,255" marker-end="url(#a)"/><rect x="78" y="236.0" width="125" height="17" fill="#fff"/><text class="" x="140.0" y="249.0" text-anchor="middle">6 HTTP POST to ACS</text><rect x="145" y="274" width="129" height="15" fill="#fff"/><text class="s" x="210" y="285" text-anchor="middle">InResponseTo matches 3</text><text class="t" x="430" y="30">IdP-initiated</text><rect class="box" x="430" y="50" width="150" height="250" rx="6"/><text x="505" y="80" text-anchor="middle" class="s">user clicks app tile</text><text x="505" y="104" text-anchor="middle" class="s">in IdP portal</text><text x="505" y="128" text-anchor="middle" class="s">↓</text><text x="505" y="152" text-anchor="middle" class="s">IdP posts unsolicited</text><text x="505" y="176" text-anchor="middle" class="s">assertion to SP</text><text x="505" y="200" text-anchor="middle" class="s">↓</text><text x="505" y="224" text-anchor="middle" class="s">no InResponseTo</text><text x="505" y="248" text-anchor="middle" class="s">→ replay / injection</text><text x="505" y="272" text-anchor="middle" class="s">risk</text><text x="20" y="340" class="s">Assertion: Authn statement + Attribute statement + Conditions (audience, validity), XML-signed by IdP.</text><text x="20" y="360" class="s">Binding: HTTP-POST (form auto-submit) because signed XML is too big for a redirect URL.</text></svg>