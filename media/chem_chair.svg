<text x="300" y="320" text-anchor="middle" fill="#c0392b" font-size="13">Axial (red): vertical, alternating up/down around the ring.</text>
<text x="300" y="340" text-anchor="middle" fill="#1b6ca8" font-size="13">Equatorial (blue): point outward along the ring's rim.</text>
<text x="300" y="366" text-anchor="middle" fill="#444" font-size="13">Big groups prefer equatorial: axial ones clash with the other axial H on the same face (1,3-diaxial).</text>
