<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Helvetica,Arial,sans-serif" font-size="14">
<rect width="600" height="400" fill="#fff"/>
<path d="M70 340 V40 M70 340 H570" stroke="#222" stroke-width="2" fill="none"/>
<path d="M70 40 l-5 10 h10z M570 340 l-10 -5 v10z" fill="#222"/>
<text x="20" y="30" fill="#222">Pressure</text><text x="500" y="368" fill="#222">Temperature</text>
<!-- solid-liquid: leans left going up -->
<path d="M262 292 L232 40" stroke="#1565c0" stroke-width="3" fill="none"/>
<!-- sublimation -->
<path d="M262 292 Q200 318 70 330" stroke="#2e7d32" stroke-width="3" fill="none"/>
<!-- vaporisation to critical -->
<path d="M262 292 Q340 275 400 215 Q440 170 470 130" stroke="#c62828" stroke-width="3" fill="none"/>
<path d="M470 130 Q485 112 520 100" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<circle cx="262" cy="292" r="6" fill="#222"/><circle cx="470" cy="130" r="6" fill="#222"/>
<text x="272" y="312" fill="#222">triple point</text><text x="272" y="328" fill="#555" font-size="12">0.01 °C, 0.006 atm</text>
<text x="455" y="128" text-anchor="end" fill="#222">critical point</text><text x="455" y="144" text-anchor="end" fill="#555" font-size="12">374 °C, 218 atm</text>
<text x="110" y="170" font-size="20" fill="#1565c0" font-weight="bold">SOLID</text>
<text x="285" y="150" font-size="20" fill="#c62828" font-weight="bold">LIQUID</text>
<text x="400" y="290" font-size="20" fill="#2e7d32" font-weight="bold">GAS</text>
<text x="480" y="80" font-size="13" fill="#555">supercritical</text>
<line x1="70" y1="215" x2="560" y2="215" stroke="#999" stroke-dasharray="3 4"/><text x="76" y="230" font-size="12" fill="#777">1 atm</text>
<circle cx="245" cy="215" r="4" fill="#1565c0"/><text x="205" y="206" font-size="12" fill="#1565c0">0 °C</text>
<circle cx="407" cy="215" r="4" fill="#c62828"/><text x="412" y="206" font-size="12" fill="#c62828">100 °C</text>
<text x="105" y="60" font-size="13" fill="#1565c0">melting line slopes LEFT:</text><text x="105" y="76" font-size="13" fill="#1565c0">pressure melts ice</text>
</svg>
