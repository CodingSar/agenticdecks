<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937"><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="600" height="400" fill="white"/><text x="300" y="24" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">SSA: one φ at the join, placed on the dominance frontier</text><rect x="90" y="50" width="150" height="54" rx="6" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/><text x="165" y="70" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">B0 (entry)</text><text x="165" y="90" font-size="13" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace">x1 = 0;  if (c)</text><rect x="20" y="150" width="120" height="50" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="80" y="170" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">B1</text><text x="80" y="190" font-size="13" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace">x2 = 1</text><rect x="190" y="150" width="120" height="50" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="250" y="170" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">B2</text><text x="250" y="190" font-size="13" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace">x3 = 2</text><rect x="60" y="260" width="210" height="70" rx="6" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/><text x="165" y="280" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">B3 (join)</text><text x="165" y="300" font-size="13" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace">x4 = φ(x2 [B1], x3 [B2])</text><text x="165" y="318" font-size="13" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace">use x4</text><line x1="130" y1="104" x2="90" y2="150" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/><line x1="200" y1="104" x2="240" y2="150" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/><line x1="90" y1="200" x2="130" y2="260" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/><line x1="240" y1="200" x2="200" y2="260" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/><text x="100" y="130" font-size="11" text-anchor="middle" fill="#2563eb">true</text><text x="238" y="130" font-size="11" text-anchor="middle" fill="#2563eb">false</text><text x="165" y="360" font-size="12" text-anchor="middle" fill="#374151">CFG: φ picks the value by the edge taken</text><text x="455" y="60" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Dominator tree</text><rect x="420" y="80" width="70" height="34" rx="6" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/><text x="455" y="102" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">B0</text><rect x="340" y="160" width="60" height="34" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="370" y="182" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">B1</text><rect x="425" y="160" width="60" height="34" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="455" y="182" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">B2</text><rect x="510" y="160" width="60" height="34" rx="6" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/><text x="540" y="182" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">B3</text><line x1="440" y1="114" x2="380" y2="160" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/><line x1="455" y1="114" x2="455" y2="160" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/><line x1="470" y1="114" x2="530" y2="160" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/><text x="455" y="225" font-size="12" text-anchor="middle" fill="#1f2937">B0 dominates everything;</text><text x="455" y="243" font-size="12" text-anchor="middle" fill="#1f2937">B1 and B2 do NOT dominate B3</text><text x="455" y="275" font-size="13" text-anchor="middle" font-weight="bold" fill="#dc2626" font-family="Menlo, Consolas, monospace">DF(B1) = DF(B2) = {B3}</text><text x="455" y="300" font-size="12" text-anchor="middle" fill="#1f2937">x is defined in B1 and B2,</text><text x="455" y="318" font-size="12" text-anchor="middle" fill="#1f2937">so B3 gets a φ for x</text><text x="455" y="350" font-size="12" text-anchor="middle" fill="#374151">x4 is a new name: every</text><text x="455" y="368" font-size="12" text-anchor="middle" fill="#374151">value has exactly one definition</text></svg>