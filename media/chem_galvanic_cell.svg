<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Arial, Helvetica, sans-serif" font-size="14">
<rect width="600" height="400" fill="#fff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker></defs>
<!-- wire -->
<path d="M140,215 V95 H460 V215" fill="none" stroke="#333" stroke-width="3"/>
<rect x="270" y="80" width="60" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="300" y="100" text-anchor="middle" font-weight="bold">V 1.10</text>
<path d="M180,70 H235" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<text x="150" y="62" fill="#c0392b" font-weight="bold">e⁻ flow (Zn → Cu)</text>
<!-- beakers -->
<path d="M80,200 V350 H220 V200" fill="none" stroke="#333" stroke-width="3"/>
<path d="M380,200 V350 H520 V200" fill="none" stroke="#333" stroke-width="3"/>
<rect x="83" y="240" width="134" height="107" fill="#d6eaf8"/>
<rect x="383" y="240" width="134" height="107" fill="#aed6f1"/>
<!-- electrodes -->
<rect x="130" y="210" width="20" height="120" fill="#9aa5b1" stroke="#333" stroke-width="2"/>
<rect x="430" y="210" width="20" height="120" fill="#c8793c" stroke="#333" stroke-width="2"/>
<!-- salt bridge -->
<path d="M190,240 V160 H410 V240" fill="none" stroke="#7d6608" stroke-width="16" stroke-linejoin="round"/>
<path d="M190,240 V160 H410 V240" fill="none" stroke="#f9e79f" stroke-width="12" stroke-linejoin="round"/>
<text x="300" y="150" text-anchor="middle" fill="#7d6608" font-weight="bold">salt bridge (K⁺, NO₃⁻)</text>
<path d="M230,180 H290" stroke="#1f4e79" stroke-width="2" marker-end="url(#b)"/>
<text x="225" y="200" fill="#1f4e79" font-size="12">← NO₃⁻</text>
<path d="M370,180 H312" stroke="#1f4e79" stroke-width="2" marker-end="url(#b)"/>
<text x="345" y="200" fill="#1f4e79" font-size="12">K⁺ →</text>
<!-- labels -->
<text x="150" y="272" fill="#333" font-size="13">Zn²⁺ ⟵ Zn</text>
<text x="450" y="272" fill="#333" font-size="13">Cu²⁺ ⟶ Cu</text>
<text x="150" y="375" text-anchor="middle" font-weight="bold">ANODE (−)</text>
<text x="150" y="392" text-anchor="middle" font-size="12">oxidation: Zn → Zn²⁺ + 2e⁻</text>
<text x="450" y="375" text-anchor="middle" font-weight="bold">CATHODE (+)</text>
<text x="450" y="392" text-anchor="middle" font-size="12">reduction: Cu²⁺ + 2e⁻ → Cu</text>
<text x="150" y="232" text-anchor="middle" font-size="12">ZnSO₄(aq)</text>
<text x="450" y="232" text-anchor="middle" font-size="12">CuSO₄(aq)</text>
</svg>
