<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" width="600" height="410" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="600" height="410" fill="white"/><text x="300" y="26" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937" >Le Corbusier's five points (1927)</text><line x1="20" y1="330" x2="580" y2="330" stroke="#1f2937" stroke-width="3"/><rect x="125" y="220" width="10" height="110" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><rect x="225" y="220" width="10" height="110" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><rect x="325" y="220" width="10" height="110" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><rect x="425" y="220" width="10" height="110" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><rect x="90" y="206" width="400" height="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="90" y="110" width="400" height="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="90" y="124" width="400" height="82" fill="white" stroke="#1f2937" stroke-width="2"/><rect x="96" y="140" width="388" height="32" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><line x1="120" y1="140" x2="120" y2="172" stroke="#2563eb" stroke-width="1"/><line x1="160" y1="140" x2="160" y2="172" stroke="#2563eb" stroke-width="1"/><line x1="200" y1="140" x2="200" y2="172" stroke="#2563eb" stroke-width="1"/><line x1="240" y1="140" x2="240" y2="172" stroke="#2563eb" stroke-width="1"/><line x1="280" y1="140" x2="280" y2="172" stroke="#2563eb" stroke-width="1"/><line x1="320" y1="140" x2="320" y2="172" stroke="#2563eb" stroke-width="1"/><line x1="360" y1="140" x2="360" y2="172" stroke="#2563eb" stroke-width="1"/><line x1="400" y1="140" x2="400" y2="172" stroke="#2563eb" stroke-width="1"/><line x1="440" y1="140" x2="440" y2="172" stroke="#2563eb" stroke-width="1"/><path d="M160,180 Q250,196 300,180 T420,186" stroke="#059669" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M140,110 q-8,-10 0,-24 q8,14 0,24 M130,110 q-6,-8 -2,-14 M150,110 q6,-8 2,-14" fill="none" stroke="#059669" stroke-width="2"/><path d="M200,110 q-8,-10 0,-24 q8,14 0,24 M190,110 q-6,-8 -2,-14 M210,110 q6,-8 2,-14" fill="none" stroke="#059669" stroke-width="2"/><path d="M320,110 q-8,-10 0,-24 q8,14 0,24 M310,110 q-6,-8 -2,-14 M330,110 q6,-8 2,-14" fill="none" stroke="#059669" stroke-width="2"/><path d="M420,110 q-8,-10 0,-24 q8,14 0,24 M410,110 q-6,-8 -2,-14 M430,110 q6,-8 2,-14" fill="none" stroke="#059669" stroke-width="2"/><rect x="90" y="96" width="400" height="14" fill="white" stroke="#1f2937" stroke-width="2"/><circle cx="60" cy="275" r="10" fill="#d97706" stroke="#1f2937" stroke-width="1"/><text x="60" y="279" font-size="11" text-anchor="middle" font-weight="bold" fill="white" >1</text><text x="300" y="356" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937" >1 pilotis (slim columns lift the house) · 2 roof garden · 3 free plan (partitions off the grid)</text><text x="300" y="374" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2937" >4 ribbon windows · 5 free facade (a non-bearing skin)</text><text x="300" y="396" font-size="12" text-anchor="middle" font-weight="normal" fill="#9ca3af" >All five follow from one move: the concrete frame carries the load, so walls no longer have to.</text><circle cx="140" cy="86" r="10" fill="#d97706" stroke="#1f2937" stroke-width="1"/><text x="140" y="90" font-size="11" text-anchor