<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
<rect width="600" height="400" fill="#fff"/>
<text x="300" y="28" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">Parnas's KWIC index: two decompositions</text>
<!-- Left: flowchart -->
<text x="150" y="60" text-anchor="middle" font-size="14" fill="#b91c1c" font-weight="bold">1. By processing steps</text>
<g font-size="12" fill="#222" text-anchor="middle">
<rect x="80" y="75" width="140" height="30" fill="#fee2e2" stroke="#b91c1c"/><text x="150" y="95">Input</text>
<rect x="80" y="125" width="140" height="30" fill="#fee2e2" stroke="#b91c1c"/><text x="150" y="145">Circular shift</text>
<rect x="80" y="175" width="140" height="30" fill="#fee2e2" stroke="#b91c1c"/><text x="150" y="195">Alphabetise</text>
<rect x="80" y="225" width="140" height="30" fill="#fee2e2" stroke="#b91c1c"/><text x="150" y="245">Output</text>
</g>
<g stroke="#b91c1c" stroke-width="1.5"><line x1="150" y1="105" x2="150" y2="125"/><line x1="150" y1="155" x2="150" y2="175"/><line x1="150" y1="205" x2="150" y2="225"/></g>
<rect x="40" y="280" width="220" height="34" fill="#fff7ed" stroke="#f97316" stroke-dasharray="4 3"/>
<text x="150" y="301" text-anchor="middle" font-size="11" fill="#9a3412">shared: line storage format in core</text>
<g stroke="#f97316" stroke-width="1" stroke-dasharray="3 3"><line x1="100" y1="280" x2="110" y2="105"/><line x1="130" y1="280" x2="135" y2="155"/><line x1="170" y1="280" x2="165" y2="205"/><line x1="200" y1="280" x2="190" y2="255"/></g>
<text x="150" y="340" text-anchor="middle" font-size="11" fill="#555">Change the format → every module changes.</text>
<!-- Right: information hiding -->
<text x="450" y="60" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">2. By design decisions hidden</text>
<g font-size="12" fill="#222" text-anchor="middle">
<rect x="340" y="75" width="220" height="30" fill="#dbeafe" stroke="#1d4ed8"/><text x="450" y="95">Line storage (hides format)</text>
<rect x="340" y="125" width="220" height="30" fill="#dbeafe" stroke="#1d4ed8"/><text x="450" y="145">Circular shifter (hides representation)</text>
<rect x="340" y="175" width="220" height="30" fill="#dbeafe" stroke="#1d4ed8"/><text x="450" y="195">Alphabetiser (hides when/how sorted)</text>
<rect x="340" y="225" width="220" height="30" fill="#dbeafe" stroke="#1d4ed8"/><text x="450" y="245">Input / Output formats</text>
<rect x="340" y="275" width="220" height="30" fill="#dbeafe" stroke="#1d4ed8"/><text x="450" y="295">Master control (sequence)</text>
</g>
<text x="450" y="340" text-anchor="middle" font-size="11" fill="#555">Each module owns one secret; interfaces</text>
<text x="450" y="356" text-anchor="middle" font-size="11" fill="#555">are access functions, not data layouts.</text>
<text x="300" y="388" text-anchor="middle" font-size="12" fill="#333">Same program, same steps – different criterion for the cut.</text>
</svg>
