<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="sans-serif" font-size="14">
<rect width="600" height="400" fill="#fff"/>
<text x="300" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Tiered JIT: tier up on heat, deoptimise on broken speculation</text>
<!-- tiers -->
<g stroke="#222" stroke-width="2">
<rect x="30" y="150" width="150" height="80" rx="8" fill="#f3f3f3"/>
<rect x="225" y="150" width="150" height="80" rx="8" fill="#e7f0fa"/>
<rect x="420" y="150" width="150" height="80" rx="8" fill="#e6f5e6"/>
</g>
<text x="105" y="180" text-anchor="middle" font-weight="bold" fill="#222">Interpreter</text>
<text x="105" y="200" text-anchor="middle" font-size="12" fill="#444">bytecode, collects</text>
<text x="105" y="215" text-anchor="middle" font-size="12" fill="#444">type feedback</text>
<text x="300" y="180" text-anchor="middle" font-weight="bold" fill="#222">Baseline JIT</text>
<text x="300" y="200" text-anchor="middle" font-size="12" fill="#444">fast compile,</text>
<text x="300" y="215" text-anchor="middle" font-size="12" fill="#444">little optimisation</text>
<text x="495" y="180" text-anchor="middle" font-weight="bold" fill="#222">Optimising JIT</text>
<text x="495" y="200" text-anchor="middle" font-size="12" fill="#444">speculates on</text>
<text x="495" y="215" text-anchor="middle" font-size="12" fill="#444">profile, inlines</text>
<!-- forward arrows -->
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a6"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c33"/></marker></defs>
<path d="M180 175 L225 175" stroke="#1a6" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M375 175 L420 175" stroke="#1a6" stroke-width="2.5" marker-end="url(#a)"/>
<text x="202" y="165" text-anchor="middle" font-size="11" fill="#1a6">hot</text>
<text x="397" y="165" text-anchor="middle" font-size="11" fill="#1a6">hotter</text>
<!-- deopt arrows -->
<path d="M495 230 C495 320, 105 320, 105 232" fill="none" stroke="#c33" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#r)"/>
<text x="300" y="305" text-anchor="middle" font-size="13" fill="#c33" font-weight="bold">deoptimise: guard fails (unexpected type, uncommon trap)</text>
<text x="300" y="322" text-anchor="middle" font-size="12" fill="#c33">rebuild interpreter frame, resume at same bytecode, re-profile</text>
<!-- OSR -->
<path d="M60 150 C60 90, 460 90, 460 150" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#a)"/>
<text x="260" y="88" text-anchor="middle" font-size="12" fill="#555">OSR: swap a running hot loop into compiled code mid-iteration</text>
<!-- footer -->
<text x="300" y="372" text-anchor="middle" font-size="12" fill="#444">HotSpot: interpreter → C1 (levels 1–3) → C2 (level 4)   ·   V8: Ignition → Sparkplug → Maglev → TurboFan</text>
</svg>
