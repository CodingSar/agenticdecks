<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Helvetica, Arial, sans-serif">
<rect width="640" height="380" fill="#ffffff"/>
<text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Game loop: fixed update, variable render</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<g font-size="15" text-anchor="middle" fill="#222">
<rect x="60" y="70" width="170" height="60" rx="10" fill="#e3f2fd" stroke="#222" stroke-width="2"/>
<text x="145" y="98">processInput()</text><text x="145" y="117" font-size="12" fill="#444">never blocks</text>
<rect x="410" y="70" width="170" height="60" rx="10" fill="#e8f5e9" stroke="#222" stroke-width="2"/>
<text x="495" y="98">lag += elapsed</text><text x="495" y="117" font-size="12" fill="#444">real time passed</text>
<rect x="410" y="200" width="170" height="80" rx="10" fill="#fff3e0" stroke="#222" stroke-width="2"/>
<text x="495" y="225">while lag ≥ STEP:</text><text x="495" y="247">update(STEP)</text><text x="495" y="267">lag -= STEP</text>
<rect x="60" y="210" width="170" height="60" rx="10" fill="#f3e5f5" stroke="#222" stroke-width="2"/>
<text x="145" y="238">render(lag/STEP)</text><text x="145" y="257" font-size="12" fill="#444">interpolate</text>
</g>
<g stroke="#222" stroke-width="2.5" fill="none" marker-end="url(#a)">
<line x1="230" y1="100" x2="405" y2="100"/>
<line x1="495" y1="130" x2="495" y2="195"/>
<line x1="410" y1="240" x2="235" y2="240"/>
<line x1="145" y1="210" x2="145" y2="135"/>
</g>
<text x="320" y="320" text-anchor="middle" font-size="14" fill="#444">Simulation advances in equal steps: deterministic physics on any machine.</text>
<text x="320" y="342" text-anchor="middle" font-size="14" fill="#444">Rendering runs as often as the hardware allows.</text>
</svg>
