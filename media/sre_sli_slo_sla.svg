<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="600" height="400" rx="14" fill="#fbfbf8"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">SLI → SLO → SLA: measurement, target, contract</text>
<line x1="60" y1="330" x2="560" y2="330" stroke="#1f2937" stroke-width="2"/>
<text x="60" y="352" font-size="12" fill="#1f2937" text-anchor="middle">99.0%</text>
<text x="185" y="352" font-size="12" fill="#dc2626" text-anchor="middle">99.5%</text>
<text x="310" y="352" font-size="12" fill="#2563eb" text-anchor="middle">99.9%</text>
<text x="560" y="352" font-size="12" fill="#1f2937" text-anchor="middle">100%</text>
<text x="310" y="378" font-size="12" fill="#6b7280" text-anchor="middle">availability over the 30-day window (not to scale)</text>
<rect x="60" y="250" width="500" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="70" y="272" font-size="13" font-weight="700" fill="#dc2626">SLA 99.5%: contract with consequences (credits, penalties)</text>
<text x="70" y="294" font-size="12" fill="#991b1b">breach here → money and lawyers</text>
<line x1="185" y1="240" x2="185" y2="330" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="310" y="170" width="250" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="320" y="192" font-size="13" font-weight="700" fill="#2563eb">SLO 99.9%: internal target</text>
<text x="320" y="212" font-size="12" fill="#1e40af">stricter than the SLA; a miss</text>
<text x="320" y="226" font-size="12" fill="#1e40af">triggers the error-budget policy</text>
<line x1="310" y1="160" x2="310" y2="330" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M190 240 L305 240" stroke="#d97706" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="248" y="232" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">reaction margin</text>
<rect x="60" y="70" width="500" height="70" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="70" y="94" font-size="13" font-weight="700" fill="#059669">SLI = good events / valid events, e.g.</text>
<text x="70" y="116" font-size="12.5" fill="#065f46" font-family="monospace">requests with status != 5xx and latency &lt; 300 ms</text>
<text x="70" y="132" font-size="12" fill="#065f46">the number you actually measure</text>
<circle cx="520" cy="330" r="7" fill="#059669"/>
<text x="520" y="316" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">SLI today: 99.93%</text>
<line x1="520" y1="140" x2="520" y2="306" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 4"/>
</svg>
