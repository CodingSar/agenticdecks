<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937"><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="600" height="400" fill="white"/><text x="300" y="20" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">MESI: one cache line, as seen by one core's cache</text><circle cx="300" cy="80" r="42" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="300" y="76" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2937">M</text><text x="300" y="94" font-size="10" text-anchor="middle" fill="#1f2937">Modified</text><circle cx="100" cy="205" r="42" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="100" y="201" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2937">E</text><text x="100" y="219" font-size="10" text-anchor="middle" fill="#1f2937">Exclusive</text><circle cx="500" cy="205" r="42" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/><text x="500" y="201" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2937">S</text><text x="500" y="219" font-size="10" text-anchor="middle" fill="#1f2937">Shared</text><circle cx="300" cy="330" r="42" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="300" y="326" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2937">I</text><text x="300" y="344" font-size="10" text-anchor="middle" fill="#1f2937">Invalid</text><text x="240" y="60" font-size="11" text-anchor="end" fill="#4b5563">dirty, only copy</text><text x="100" y="265" font-size="11" text-anchor="middle" fill="#4b5563">clean, only copy</text><text x="500" y="265" font-size="11" text-anchor="middle" fill="#4b5563">clean, maybe copies</text><text x="350" y="360" font-size="11" text-anchor="start" fill="#4b5563">no valid data</text><line x1="264" y1="308" x2="136" y2="227" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="190" y="300" font-size="11" text-anchor="middle" fill="#1f2937">local read, nobody has it</text><line x1="336" y1="308" x2="464" y2="227" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="410" y="300" font-size="11" text-anchor="middle" fill="#1f2937">local read, others have it</text><line x1="136" y1="183" x2="264" y2="102" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="175" y="118" font-size="11" text-anchor="middle" fill="#dc2626">local write (silent)</text><line x1="464" y1="183" x2="336" y2="102" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="400" y="162" font-size="11" text-anchor="middle" fill="#dc2626">local write: upgrade,</text><text x="400" y="176" font-size="11" text-anchor="middle" fill="#dc2626">invalidate others</text><line x1="300" y1="288" x2="300" y2="122" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="308" y="240" font-size="11" text-anchor="start" fill="#dc2626">local write: RFO</text><text x="308" y="254" font-size="10" text-anchor="start" fill="#dc2626">(read for ownership)</text><line x1="142" y1="205" x2="458" y2="205" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><text x="210" y="196" font-size="11" text-anchor="middle" fill="#2563eb">other core reads</text><path d="M338,66 Q600,20 512,163" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><text x="470" y="92" font-size="11" text-anchor="middle" fill="#2563eb">other core reads:</text><text x="470" y="106" font-size="11" text-anchor="middle" fill="#2563eb">write back, share</text><text x="300" y="382" font-size="10" text-anchor="middle" fill="#4b5563">another core's write invalidates any state: E→I, S→I, M→I (after write-back)</text><text x="300" y="396" font-size="10" text-anchor="middle" fill="#4b5563">red = own write, blue = snooped read, black = own read</text></svg>