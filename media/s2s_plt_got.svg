<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937"><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="600" height="400" fill="white"/><text x="300" y="24" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">PLT / GOT lazy binding: first call vs later calls</text><rect x="20" y="60" width="150" height="50" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="95" y="80" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">main.c</text><text x="95" y="100" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace">call puts@plt</text><rect x="230" y="50" width="170" height="90" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="315" y="70" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">PLT[n]  (code, r-x)</text><text x="315" y="90" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace">jmp *GOT[n]</text><text x="315" y="108" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace">push n</text><text x="315" y="126" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace">jmp PLT[0]</text><rect x="440" y="50" width="140" height="70" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="510" y="70" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">GOT[n] (data, rw)</text><text x="510" y="90" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace">init: → PLT[n]+6</text><text x="510" y="108" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace">later: → puts</text><line x1="170" y1="85" x2="230" y2="85" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/><line x1="400" y1="90" x2="440" y2="90" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/><rect x="230" y="190" width="170" height="70" rx="6" fill="#fee2e2" stroke="#1f2937" stroke-width="2"/><text x="315" y="210" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">PLT[0]</text><text x="315" y="230" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace">push link_map</text><text x="315" y="248" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Menlo, Consolas, monospace">jmp *GOT[2]</text><path d="M 320 140 L 320 190" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="20" y="190" width="170" height="70" rx="6" fill="#fee2e2" stroke="#1f2937" stroke-width="2"/><text x="105" y="212" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">_dl_runtime_resolve</text><text x="105" y="232" font-size="11" text-anchor="middle" fill="#1f2937">look up 'puts', write</text><text x="105" y="248" font-size="11" text-anchor="middle" fill="#1f2937">its address into GOT[n]</text><line x1="230" y1="225" x2="190" y2="225" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><path d="M 105 190 C 105 150, 480 160, 505 122" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="440" y="300" width="140" height="50" rx="6" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/><text x="510" y="320" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">libc.so: puts</text><text x="510" y="338" font-size="11" text-anchor="middle" fill="#1f2937">the real function</text><path d="M 540 120 L 540 300" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><path d="M 105 260 C 105 330, 300 325, 440 325" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="300" y="380" font-size="12" text-anchor="middle" fill="#374151">red = first call (slow path through the dynamic linker)   blue = every later call</text><text x="300" y="278" font-size="12" text-anchor="middle" fill="#374151">-z now / full RELRO: do all of this at load time,</text><text x="300" y="294" font-size="12" text-anchor="middle" fill="#374151">then make the GOT read-only</text></svg>