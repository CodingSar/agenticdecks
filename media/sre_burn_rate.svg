<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif">
<rect width="600" height="400" rx="14" fill="#fbfbf8"/>
<text x="24" y="32" font-size="17" font-weight="700" fill="#1f2937">Error budget over a 30-day window: burn rates</text>
<line x1="70" y1="330" x2="330" y2="330" stroke="#1f2937" stroke-width="2"/>
<line x1="70" y1="60" x2="70" y2="330" stroke="#1f2937" stroke-width="2"/>
<text x="70" y="350" font-size="12" fill="#1f2937" text-anchor="middle">day 0</text>
<text x="200" y="350" font-size="12" fill="#1f2937" text-anchor="middle">day 15</text>
<text x="330" y="350" font-size="12" fill="#1f2937" text-anchor="middle">day 30</text>
<text x="62" y="68" font-size="12" fill="#1f2937" text-anchor="end">100%</text>
<text x="62" y="334" font-size="12" fill="#1f2937" text-anchor="end">0%</text>
<text x="22" y="200" font-size="12" fill="#1f2937" transform="rotate(-90 22 200)" text-anchor="middle">budget remaining</text>
<line x1="70" y1="64" x2="330" y2="330" stroke="#059669" stroke-width="2.5"/>
<text x="300" y="316" text-anchor="end" font-size="12" fill="#059669" font-weight="700">1×: lasts 30 d</text>
<line x1="70" y1="64" x2="200" y2="330" stroke="#d97706" stroke-width="2.5"/>
<text x="170" y="252" font-size="12" fill="#d97706" font-weight="700">2×: 15 d</text>
<line x1="70" y1="64" x2="88" y2="330" stroke="#dc2626" stroke-width="3"/>
<text x="96" y="84" font-size="12" fill="#dc2626" font-weight="700">14.4×: ~2 days</text>
<text x="96" y="100" font-size="11" fill="#991b1b">2% of budget per hour</text>
<rect x="350" y="60" width="236" height="92" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="362" y="84" font-size="13" fill="#3730a3" font-weight="700">burn rate = error ratio ÷ (1 − SLO)</text>
<text x="362" y="106" font-size="11.5" fill="#3730a3">SLO 99.9%, errors 1.44%:</text>
<text x="362" y="122" font-size="11.5" fill="#3730a3">0.0144 / 0.001 = 14.4</text>
<text x="362" y="142" font-size="11.5" fill="#3730a3">time to exhaust = window ÷ burn rate</text>
<text x="350" y="196" font-size="12.5" fill="#1f2937" font-weight="700">Fast burn → page:</text>
<text x="350" y="214" font-size="11.5" fill="#1f2937" font-family="monospace">burn(1h) &gt; 14.4</text>
<text x="350" y="230" font-size="11.5" fill="#1f2937" font-family="monospace">AND burn(5m) &gt; 14.4</text>
<text x="350" y="250" font-size="11" fill="#6b7280">long window = significant,</text>
<text x="350" y="264" font-size="11" fill="#6b7280">short window = still happening</text>
<text x="350" y="296" font-size="12.5" fill="#1f2937" font-weight="700">Slow burn → ticket:</text>
<text x="350" y="314" font-size="11.5" fill="#1f2937" font-family="monospace">burn(3d) &gt; 1</text>
<text x="350" y="330" font-size="11.5" fill="#1f2937" font-family="monospace">AND burn(6h) &gt; 1</text>
<text x="350" y="350" font-size="11" fill="#6b7280">short window ≈ 1/12 of long</text>
</svg>
