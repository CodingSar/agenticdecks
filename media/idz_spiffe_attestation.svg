<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"><style>
text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#222}
.t{font-size:15px;font-weight:bold}.s{font-size:11px;fill:#555}
.box{fill:#f4f6fa;stroke:#333;stroke-width:1.5}
.blue{fill:#dbe8fb}.green{fill:#dcefdc}.orange{fill:#fde7cc}.red{fill:#f9d6d5}.grey{fill:#ececec}
.ln{stroke:#333;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="600" height="400" fill="#fff"/><rect class="box orange" x="20" y="40" width="200" height="50" rx="6"/><text class="t" x="120.0" y="65.0" text-anchor="middle">SPIRE Server</text><text class="s" x="120.0" y="81.0" text-anchor="middle">CA, registration entries</text><rect class="box blue" x="20" y="170" width="200" height="50" rx="6"/><text class="t" x="120.0" y="195.0" text-anchor="middle">SPIRE Agent</text><text class="s" x="120.0" y="211.0" text-anchor="middle">one per node</text><rect class="box green" x="20" y="300" width="200" height="50" rx="6"/><text class="t" x="120.0" y="325.0" text-anchor="middle">Workload</text><text class="s" x="120.0" y="341.0" text-anchor="middle">pod / process</text><path class="ln" d="M120,170 L120,90" marker-end="url(#a)"/><text x="130" y="128" class="s">node attestation:</text><text x="130" y="143" class="s">instance doc, TPM, PSAT</text><path class="ln" d="M90,300 L90,220" marker-end="url(#a)"/><text x="130" y="265" class="s">Workload API: "who am I?"</text><path class="ln" d="M150,220 L150,300" marker-end="url(#a)"/><text x="160" y="250" class="s"></text><rect class="box" x="330" y="40" width="250" height="110" rx="6"/><text class="t" x="340" y="62">Workload attestation</text><text class="s" x="340" y="84">agent inspects caller: k8s namespace,</text><text class="s" x="340" y="100">service account, pod label, unix uid…</text><text class="s" x="340" y="122">matches selectors → registration entry</text><text class="s" x="340" y="140">→ SPIFFE ID</text><rect class="box green" x="330" y="190" width="250" height="90" rx="6"/><text class="t" x="340" y="212">SVID issued</text><text class="s" x="340" y="234">spiffe://prod.example/ns/pay/sa/api</text><text class="s" x="340" y="252">X.509 (SAN URI) or JWT, short-lived</text><text class="s" x="340" y="270">rotated automatically, no secret zero</text><path class="ln dash" d="M330,235 L160,320" marker-end="url(#a)"/></svg>