<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
<rect width="600" height="400" fill="#fff"/>
<text x="300" y="30" text-anchor="middle" font-size="18" fill="#222" font-weight="bold">Deep vs shallow modules (Ousterhout)</text>
<!-- deep module -->
<rect x="60" y="110" width="120" height="240" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
<line x1="60" y1="110" x2="180" y2="110" stroke="#dc2626" stroke-width="6"/>
<text x="120" y="98" text-anchor="middle" font-size="13" fill="#dc2626">interface (cost)</text>
<text x="120" y="230" text-anchor="middle" font-size="13" fill="#1e3a8a">functionality</text>
<text x="120" y="248" text-anchor="middle" font-size="13" fill="#1e3a8a">(benefit)</text>
<text x="120" y="375" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">deep</text>
<text x="120" y="392" text-anchor="middle" font-size="11" fill="#555">e.g. Unix file I/O: 5 calls</text>
<!-- shallow modules -->
<g>
<rect x="250" y="300" width="300" height="50" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
<line x1="250" y1="300" x2="550" y2="300" stroke="#dc2626" stroke-width="6"/>
<text x="400" y="288" text-anchor="middle" font-size="13" fill="#dc2626">interface almost as big as what it hides</text>
<text x="400" y="331" text-anchor="middle" font-size="13" fill="#1e3a8a">functionality</text>
<text x="400" y="375" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">shallow</text>
<text x="400" y="392" text-anchor="middle" font-size="11" fill="#555">e.g. getters/setters, a linked-list class</text>
</g>
<text x="400" y="130" text-anchor="middle" font-size="13" fill="#333">value = functionality provided</text>
<text x="400" y="150" text-anchor="middle" font-size="13" fill="#333">minus interface complexity</text>
<text x="400" y="190" text-anchor="middle" font-size="12" fill="#555">Area = benefit. Top edge = what callers must learn.</text>
<text x="400" y="208" text-anchor="middle" font-size="12" fill="#555">Deep: small edge, large area.</text>
</svg>
