<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect width="600" height="400" rx="14" fill="#fbfbf8"/>
<text x="24" y="32" font-size="17" font-weight="700" fill="#1f2937">Incident command: who does what</text>
<rect x="200" y="54" width="200" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="300" y="78" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">Incident Commander</text>
<text x="300" y="98" font-size="11.5" fill="#991b1b" text-anchor="middle">owns decisions, delegates,</text>
<text x="300" y="114" font-size="11.5" fill="#991b1b" text-anchor="middle">never debugs</text>
<line x1="260" y1="126" x2="120" y2="180" stroke="#1f2937" stroke-width="1.5" marker-end="url(#m)"/>
<line x1="300" y1="126" x2="300" y2="180" stroke="#1f2937" stroke-width="1.5" marker-end="url(#m)"/>
<line x1="340" y1="126" x2="480" y2="180" stroke="#1f2937" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="24" y="182" width="190" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="119" y="206" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">Operations Lead</text>
<text x="119" y="226" font-size="11.5" fill="#1e40af" text-anchor="middle">hands on keyboard</text>
<text x="119" y="242" font-size="11.5" fill="#1e40af" text-anchor="middle">runs the technical response</text>
<rect x="205" y="182" width="190" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="300" y="206" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">Communications Lead</text>
<text x="300" y="226" font-size="11.5" fill="#065f46" text-anchor="middle">status page, execs, support</text>
<text x="300" y="242" font-size="11.5" fill="#065f46" text-anchor="middle">"next update at :30"</text>
<rect x="386" y="182" width="190" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="481" y="206" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">Planning / Scribe</text>
<text x="481" y="226" font-size="11.5" fill="#92400e" text-anchor="middle">live incident doc, timeline</text>
<text x="481" y="242" font-size="11.5" fill="#92400e" text-anchor="middle">handoffs, follow-ups, rest</text>
<line x1="119" y1="262" x2="119" y2="296" stroke="#1f2937" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="24" y="298" width="190" height="34" rx="6" fill="#e5e7eb" stroke="#1f2937"/>
<text x="119" y="320" font-size="12" fill="#1f2937" text-anchor="middle">responders / subject experts</text>
<text x="400" y="300" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="700">Borrowed from FEMA ICS</text>
<text x="400" y="320" font-size="11.5" fill="#1f2937" text-anchor="middle">one commander · explicit, acknowledged handoffs</text>
<text x="400" y="338" font-size="11.5" fill="#1f2937" text-anchor="middle">span of control ≈ 3–7 · roles scale up or collapse</text>
<text x="300" y="380" font-size="12" fill="#6b7280" text-anchor="middle">Small incident: one person wears all hats. Big one: each hat is a human.</text>
</svg>
