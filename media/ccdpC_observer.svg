<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937"><title>Observer subject and observers</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="640" height="400" fill="#ffffff"/><text x="320" y="30" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="bold">Observer: subject notifies whoever subscribed</text><rect x="30" y="140" width="190" height="100" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="125.0" y="169.05" text-anchor="middle" font-size="13" font-weight="bold">Subject: PriceFeed</text><text x="125.0" y="186.05" text-anchor="middle" font-size="13">observers: List</text><text x="125.0" y="203.05" text-anchor="middle" font-size="13">subscribe(o)</text><text x="125.0" y="220.05" text-anchor="middle" font-size="13">notify()</text><rect x="420" y="60" width="180" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="510.0" y="86.05" text-anchor="middle" font-size="13" font-weight="bold">Chart</text><text x="510.0" y="103.05" text-anchor="middle" font-size="13">update(price)</text><line x1="222" y1="170" x2="418" y2="90" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="170" width="180" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="510.0" y="196.05" text-anchor="middle" font-size="13" font-weight="bold">Portfolio total</text><text x="510.0" y="213.05" text-anchor="middle" font-size="13">update(price)</text><line x1="222" y1="190" x2="418" y2="200" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="280" width="180" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="510.0" y="306.05" text-anchor="middle" font-size="13" font-weight="bold">Alert rule</text><text x="510.0" y="323.05" text-anchor="middle" font-size="13">update(price)</text><line x1="222" y1="210" x2="418" y2="310" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/><text x="290" y="108" text-anchor="middle" font-size="12" fill="#1f2937" font-style="italic">notify: o.update(price)</text><text x="125" y="270" text-anchor="middle" font-size="12" fill="#b45309" font-style="italic">observers call subscribe(this)</text><text x="125" y="288" text-anchor="middle" font-size="12" fill="#b45309" font-style="italic">and later unsubscribe(this)</text><text x="320" y="380" text-anchor="middle" font-size="13" fill="#1f2937">Subject depends only on the Observer interface: add views without editing it.</text></svg>