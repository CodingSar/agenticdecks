<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="600" height="380" fill="white"/><text x="300" y="28" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937" >Vault types: one bay seen from below</text><rect x="45" y="70" width="150" height="150" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><line x1="45" y1="95" x2="195" y2="95" stroke="#9ca3af" stroke-width="1"/><line x1="45" y1="120" x2="195" y2="120" stroke="#9ca3af" stroke-width="1"/><line x1="45" y1="145" x2="195" y2="145" stroke="#9ca3af" stroke-width="1"/><line x1="45" y1="170" x2="195" y2="170" stroke="#9ca3af" stroke-width="1"/><line x1="45" y1="195" x2="195" y2="195" stroke="#9ca3af" stroke-width="1"/><line x1="120.0" y1="78" x2="120.0" y2="212" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 4"/><line x1="43" y1="100" x2="17" y2="100" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><line x1="197" y1="100" x2="223" y2="100" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><line x1="43" y1="145" x2="17" y2="145" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><line x1="197" y1="145" x2="223" y2="145" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><line x1="43" y1="190" x2="17" y2="190" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><line x1="197" y1="190" x2="223" y2="190" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="120.0" y="250" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937" >Barrel</text><text x="120.0" y="270" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >half-cylinder</text><text x="120.0" y="286" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >thrust along whole wall</text><text x="120.0" y="302" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >→ thick walls, few windows</text><rect x="225" y="70" width="150" height="150" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><line x1="225" y1="70" x2="375" y2="220" stroke="#9ca3af" stroke-width="1.5"/><line x1="375" y1="70" x2="225" y2="220" stroke="#9ca3af" stroke-width="1.5"/><line x1="225" y1="70" x2="199" y2="44" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><line x1="375" y1="70" x2="401" y2="44" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><line x1="225" y1="220" x2="199" y2="246" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><line x1="375" y1="220" x2="401" y2="246" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><text x="300.0" y="250" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937" >Groin</text><text x="300.0" y="270" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >two barrels intersect</text><text x="300.0" y="286" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >thrust gathers at 4 corners</text><text x="300.0" y="302" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >→ piers, walls can open</text><rect x="405" y="70" width="150" height="150" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><line x1="405" y1="70" x2="555" y2="220" stroke="#1f2937" stroke-width="4"/><line x1="555" y1="70" x2="405" y2="220" stroke="#1f2937" stroke-width="4"/><line x1="405" y1="70" x2="555" y2="70" stroke="#1f2937" stroke-width="4"/><line x1="405" y1="220" x2="555" y2="220" stroke="#1f2937" stroke-width="4"/><line x1="405" y1="70" x2="405" y2="220" stroke="#1f2937" stroke-width="4"/><line x1="555" y1="70" x2="555" y2="220" stroke="#1f2937" stroke-width="4"/><circle cx="480.0" cy="145.0" r="7" fill="#d97706" stroke="#1f2937" stroke-width="2"/><line x1="480.0" y1="78" x2="480.0" y2="145.0" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/><line x1="480.0" y1="212" x2="480.0" y2="145.0" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/><line x1="413" y1="145.0" x2="480.0" y2="145.0" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/><line x1="547" y1="145.0" x2="480.0" y2="145.0" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/><line x1="405" y1="70" x2="379" y2="44" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><line x1="555" y1="70" x2="581" y2="44" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><line x1="405" y1="220" x2="379" y2="246" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><line x1="555" y1="220" x2="581" y2="246" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><text x="480.0" y="250" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937" >Rib</text><text x="480.0" y="270" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >ribs built first, thin infill</text><text x="480.0" y="286" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >pointed ribs: any bay shape</text><text x="480.0" y="302" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2937" >→ Gothic skeleton</text><text x="300" y="340" font-size="11" text-anchor="middle" font-weight="normal" fill="#dc2626" >Red arrows = where the vault pushes outward (thrust).</text><text x="300" y="358" font-size="11" text-anchor="middle" font-weight="normal" fill="#9ca3af" >Concentrating thrust at points is what lets walls dissolve into windows.</text></svg>