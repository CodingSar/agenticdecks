<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"><style>
text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#222}
.t{font-size:15px;font-weight:bold}.s{font-size:11px;fill:#555}
.box{fill:#f4f6fa;stroke:#333;stroke-width:1.5}
.blue{fill:#dbe8fb}.green{fill:#dcefdc}.orange{fill:#fde7cc}.red{fill:#f9d6d5}.grey{fill:#ececec}
.ln{stroke:#333;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="600" height="400" fill="#fff"/><rect class="box blue" x="20" y="60" width="180" height="60" rx="6"/><text class="t" x="110.0" y="90.0" text-anchor="middle">Principal</text><text class="s" x="110.0" y="106.0" text-anchor="middle">user / workload in acct A</text><rect class="box orange" x="400" y="60" width="180" height="60" rx="6"/><text class="t" x="490.0" y="90.0" text-anchor="middle">Role</text><text class="s" x="490.0" y="106.0" text-anchor="middle">in account B</text><rect class="box green" x="400" y="250" width="180" height="60" rx="6"/><text class="t" x="490.0" y="280.0" text-anchor="middle">Resources</text><text class="s" x="490.0" y="296.0" text-anchor="middle">in account B</text><path class="ln" d="M200,90 L400,90" marker-end="url(#a)"/><rect x="211" y="69.0" width="178" height="17" fill="#fff"/><text class="" x="300.0" y="82.0" text-anchor="middle">1 AssumeRole / impersonate</text><path class="ln" d="M400,105 L200,105" marker-end="url(#a)"/><rect x="221" y="106.0" width="158" height="17" fill="#fff"/><text class="" x="300.0" y="119.0" text-anchor="middle">2 temporary credentials</text><path class="ln" d="M490,120 L490,250" marker-end="url(#a)"/><rect x="356" y="177" width="125" height="17" fill="#fff"/><text class="" x="478" y="190" text-anchor="end">3 call as the role</text><rect class="box" x="20" y="200" width="300" height="60" rx="6"/><text class="t" x="30" y="222">Trust policy (on the role)</text><text class="s" x="30" y="244">WHO may assume: acct A principal, external ID / audience</text><rect class="box" x="20" y="280" width="300" height="60" rx="6"/><text class="t" x="30" y="302">Permission policy (on the role)</text><text class="s" x="30" y="324">WHAT the role may do; capped by permission boundary</text><text class="s" x="20" y="375">Caller's own policy must also allow the assume action. Effective rights = the role's, not the union.</text></svg>